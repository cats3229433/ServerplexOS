<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServerplexOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Oxanium',sans-serif;overflow:hidden;height:100vh;width:100vw;user-select:none}

/* ── Themes ── */
body.theme-white{--bg:#f0f0f0;--bg2:#e0e0e0;--bg3:#d0d0d0;--text:#000;--text2:#444;--border:#ccc;--win-bg:#fff;--tb-bg:rgba(243,243,243,0.82);--accent:#0078d4;--glass:rgba(255,255,255,0.55)}
body.theme-black{--bg:#000;--bg2:#1a1a1a;--bg3:#2a2a2a;--text:#fff;--text2:#aaa;--border:#444;--win-bg:#1e1e1e;--tb-bg:rgba(10,10,10,0.82);--accent:#0078d4;--glass:rgba(20,20,20,0.55)}
body.theme-grey{--bg:#808080;--bg2:#6a6a6a;--bg3:#555;--text:#fff;--text2:#ddd;--border:#999;--win-bg:#707070;--tb-bg:rgba(50,50,50,0.82);--accent:#4a9eff;--glass:rgba(80,80,80,0.55)}

/* ── Animations ── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes scaleIn{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes winOpen{from{transform:scale(0.93) translateY(12px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
@keyframes winClose{from{transform:scale(1);opacity:1}to{transform:scale(0.93) translateY(12px);opacity:0}}
@keyframes winMin{from{transform:scale(1);opacity:1}to{transform:scale(0.2) translateY(400px);opacity:0}}
@keyframes winRestore{from{transform:scale(0.2) translateY(400px);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes slideRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes slideDown{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes shutdownFade{from{opacity:0}to{opacity:1}}
@keyframes ticker{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Desktop ── */
.desktop{position:fixed;top:0;left:0;width:100%;height:calc(100% - 68px);background:var(--bg);background-size:cover;background-position:center;overflow:hidden}
.desktop-icons{padding:20px;position:relative;width:100%;height:100%}
.desktop-icon{width:80px;height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border-radius:6px;padding:8px;position:absolute;transition:background .15s,box-shadow .15s,transform .15s}
.desktop-icon:not(.dragging){transition:left .2s,top .2s,background .15s,transform .15s}
.desktop-icon.dragging{opacity:.7;transition:none;z-index:999}
.desktop-icon:hover{background:rgba(255,255,255,.14);transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.desktop-icon.selected{background:rgba(0,120,212,.3);border:1px solid var(--accent);animation:pulse .5s ease}
.icon-image{font-size:46px;margin-bottom:3px;transition:transform .2s}
.desktop-icon:hover .icon-image{transform:scale(1.12)}
.icon-label{color:var(--text);font-size:11px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.6);word-break:break-word;width:100%;line-height:1.2}
.icon-label-edit{font-size:11px;width:76px;text-align:center;background:var(--accent);color:#fff;border:none;border-radius:3px;outline:none;font-family:'Oxanium',sans-serif;padding:1px 3px}
.grid-preview{position:absolute;width:80px;height:80px;border:2px dashed var(--accent);background:rgba(0,120,212,.1);border-radius:6px;pointer-events:none;display:none;z-index:999}
.grid-preview.occupied{border-color:#ff3b30;background:rgba(255,59,48,.1)}
/* Rubber-band selection */
.rubber-band{position:absolute;border:1px solid var(--accent);background:rgba(0,120,212,.08);pointer-events:none;display:none;z-index:998}

/* ── Window snapping ── */
.snap-preview{position:fixed;background:rgba(0,120,212,.18);border:2px solid rgba(0,120,212,.55);border-radius:6px;pointer-events:none;z-index:99999;display:none;transition:all .12s}
.window.snap-left{top:0!important;left:0!important;width:50%!important;height:calc(100% - 68px)!important;border-radius:0;transition:all .2s}
.window.snap-right{top:0!important;left:50%!important;width:50%!important;height:calc(100% - 68px)!important;border-radius:0;transition:all .2s}
.window.snap-tl{top:0!important;left:0!important;width:50%!important;height:50%!important;border-radius:0;transition:all .2s}
.window.snap-tr{top:0!important;left:50%!important;width:50%!important;height:50%!important;border-radius:0;transition:all .2s}
.window.snap-bl{top:50%!important;left:0!important;width:50%!important;height:calc(50% - 34px)!important;border-radius:0;transition:all .2s}
.window.snap-br{top:50%!important;left:50%!important;width:50%!important;height:calc(50% - 34px)!important;border-radius:0;transition:all .2s}

/* ── Windows ── */
.window{position:absolute;background:var(--win-bg);border:1px solid var(--border);border-radius:10px 10px 6px 6px;box-shadow:0 16px 48px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.2);display:flex;flex-direction:column;min-width:360px;min-height:260px;z-index:100;animation:winOpen .22s cubic-bezier(.34,1.56,.64,1)}
.window.closing{animation:winClose .18s ease-out forwards}
.window.maximized{top:0!important;left:0!important;width:100%!important;height:calc(100% - 68px)!important;border-radius:0;transition:all .28s cubic-bezier(.34,1.56,.64,1)}
.window.minimizing{animation:winMin .28s ease-out forwards}
.window.minimized{display:none}
.window.restoring{animation:winRestore .28s cubic-bezier(.34,1.56,.64,1)}
.window-titlebar{height:38px;display:flex;align-items:center;padding:0 12px;cursor:move;border-radius:10px 10px 0 0;user-select:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.window-icon{font-size:16px;margin-right:8px}
.window-title{flex:1;font-size:13px;font-weight:600;letter-spacing:.2px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.window-controls{display:flex;gap:6px}
.wcb{width:30px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:4px;font-size:15px;font-weight:700;transition:all .15s;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff}
.wcb:hover{background:rgba(255,255,255,.22);transform:scale(1.08)}
.wcb.min:hover{background:rgba(255,193,7,.8)}
.wcb.max:hover{background:rgba(76,175,80,.8)}
.wcb.cls:hover{background:rgba(244,67,54,.9)}
.window-content{flex:1;overflow:hidden;background:var(--win-bg);color:var(--text)}
.window-content iframe{width:100%;height:100%;border:none}
.resize-handle{position:absolute;background:transparent}
.resize-handle.right{right:0;top:0;width:5px;height:100%;cursor:ew-resize}
.resize-handle.bottom{bottom:0;left:0;width:100%;height:5px;cursor:ns-resize}
.resize-handle.bottom-right{bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize}
.resize-tooltip{position:fixed;background:rgba(0,0,0,.75);color:#fff;font-size:11px;padding:3px 8px;border-radius:5px;pointer-events:none;z-index:999999;display:none;font-family:'Oxanium',sans-serif;letter-spacing:.5px}

/* ── Taskbar ── */
.taskbar{position:fixed;bottom:20px;left:0;width:100%;height:48px;background:var(--tb-bg);border-top:1px solid rgba(255,255,255,.12);display:flex;align-items:center;padding:0 8px;z-index:10000;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 -2px 20px rgba(0,0,0,.15)}
.start-button{width:44px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:none;cursor:pointer;font-size:20px;border-radius:6px;transition:all .25s cubic-bezier(.34,1.56,.64,1);flex-shrink:0}
.start-button:hover{background:var(--bg3);transform:scale(1.1) rotate(8deg)}
/* Virtual desktop switcher */
.vd-switcher{display:flex;gap:3px;padding:0 6px;flex-shrink:0}
.vd-btn{width:28px;height:28px;border-radius:5px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text2);transition:all .18s;font-family:'Oxanium',sans-serif}
.vd-btn:hover{background:var(--bg2);color:var(--text)}
.vd-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Pinned apps */
.pinned-apps{display:flex;gap:3px;padding:0 4px;border-right:1px solid var(--border);margin-right:4px;flex-shrink:0}
.pinned-app{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;font-size:20px;transition:all .18s;position:relative;border:1px solid transparent}
.pinned-app:hover{background:var(--bg2);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.pinned-app.running::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent)}
/* Open apps */
.taskbar-apps{flex:1;display:flex;gap:3px;padding:0 4px;overflow-x:auto;min-width:0}
.taskbar-apps::-webkit-scrollbar{display:none}
.taskbar-app{min-width:130px;max-width:200px;height:36px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--bg2);border:none;border-radius:6px;cursor:pointer;color:var(--text);font-size:12px;font-weight:600;transition:all .18s;position:relative;animation:slideUp .25s ease;border-bottom:2px solid transparent;flex-shrink:0}
.taskbar-app:hover{background:var(--bg3);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.taskbar-app.active{background:var(--accent);color:#fff;border-bottom-color:rgba(255,255,255,.5)}
.taskbar-app-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-cls{width:14px;height:14px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:10px;opacity:0;transition:all .12s;flex-shrink:0}
.taskbar-app:hover .tb-cls{opacity:1}
.tb-cls:hover{background:rgba(220,53,69,.7);color:#fff}
/* System tray */
.system-tray{display:flex;align-items:center;gap:8px;padding:0 8px;flex-shrink:0}
.tray-icon{cursor:pointer;padding:4px 6px;border-radius:4px;transition:all .18s;color:var(--text);font-size:13px;display:flex;align-items:center;gap:3px}
.tray-icon:hover{background:var(--bg2);transform:scale(1.08)}
.tray-clock{display:flex;flex-direction:column;align-items:center;padding:4px 8px;cursor:pointer}
.tray-clock:hover{background:var(--bg2);border-radius:4px}
#clockTime{font-size:13px;font-weight:700;line-height:1.2;color:var(--text)}
#clockDate{font-size:9px;color:var(--text2);line-height:1.2}
/* DnD indicator */
.dnd-dot{width:6px;height:6px;border-radius:50%;background:#ff3b30;display:none;margin-left:-2px}
.dnd-dot.on{display:block}

/* ── News ticker ── */
.news-ticker{position:fixed;bottom:0;left:0;width:100%;height:20px;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);display:flex;align-items:center;overflow:hidden;z-index:9999;border-top:1px solid rgba(255,255,255,.07)}
.ticker-label{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--accent);padding:0 10px;white-space:nowrap;flex-shrink:0;border-right:1px solid rgba(255,255,255,.15);margin-right:8px}
.ticker-track{flex:1;overflow:hidden;position:relative;height:100%}
.ticker-inner{position:absolute;white-space:nowrap;font-size:10px;color:rgba(255,255,255,.7);top:50%;transform:translateY(-50%);animation:ticker 40s linear infinite}
.ticker-inner:hover{animation-play-state:paused}

/* ── Start Menu ── */
.start-menu{position:fixed;bottom:72px;left:8px;width:580px;height:580px;background:var(--glass);border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.35);display:none;flex-direction:column;z-index:10001;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.start-menu.active{display:flex;animation:scaleIn .25s cubic-bezier(.34,1.56,.64,1)}
.sm-header{padding:18px 20px 14px;border-bottom:1px solid var(--border)}
.sm-user{display:flex;align-items:center;gap:12px}
.sm-avatar{width:44px;height:44px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:transform .3s}
.sm-avatar:hover{transform:rotate(360deg)}
.sm-name{font-weight:700;font-size:15px;color:var(--text)}
.sm-status{font-size:11px;color:var(--text2)}
.sm-apps{flex:1;padding:16px;overflow-y:auto}
.sm-section{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-bottom:10px}
.sm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.sm-item{padding:12px 8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .22s cubic-bezier(.34,1.56,.64,1);display:flex;flex-direction:column;align-items:center;gap:6px}
.sm-item:hover{background:var(--bg3);transform:translateY(-3px) scale(1.02);box-shadow:0 8px 20px rgba(0,0,0,.25);border-color:var(--accent)}
.sm-icon{font-size:28px;transition:transform .2s}
.sm-item:hover .sm-icon{transform:scale(1.15) rotate(5deg)}
.sm-label{font-size:11px;color:var(--text);font-weight:600;text-align:center}
.sm-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:8px}
.sm-btn{padding:7px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--text);font-size:12px;font-family:'Oxanium',sans-serif;transition:all .2s}
.sm-btn:hover{background:var(--bg3);transform:scale(1.04)}

/* ── Spotlight search ── */
.spotlight-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);z-index:99990;display:none;align-items:flex-start;justify-content:center;padding-top:120px}
.spotlight-overlay.open{display:flex;animation:fadeIn .15s ease}
.spotlight-box{width:580px;background:var(--glass);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5);backdrop-filter:blur(24px);animation:slideDown .2s ease}
.spotlight-input-row{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.spotlight-input-row span{font-size:18px;flex-shrink:0}
.spotlight-input{flex:1;background:transparent;border:none;outline:none;font-family:'Oxanium',sans-serif;font-size:16px;color:var(--text)}
.spotlight-input::placeholder{color:var(--text2)}
.spotlight-results{max-height:360px;overflow-y:auto;padding:8px}
.spotlight-result{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:background .12s}
.spotlight-result:hover,.spotlight-result.highlighted{background:var(--bg2)}
.spotlight-result-icon{font-size:24px;width:32px;text-align:center;flex-shrink:0}
.spotlight-result-name{font-size:14px;font-weight:600;color:var(--text)}
.spotlight-result-cat{font-size:11px;color:var(--text2)}
.spotlight-empty{text-align:center;padding:30px;color:var(--text2);font-size:13px}

/* ── Virtual desktop preview ── */
.vd-preview-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:99980;display:none;align-items:center;justify-content:center;gap:20px}
.vd-preview-overlay.open{display:flex;animation:fadeIn .2s ease}
.vd-thumb{width:220px;height:140px;background:var(--bg2);border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.vd-thumb:hover,.vd-thumb.active{border-color:var(--accent);transform:scale(1.04);box-shadow:0 8px 24px rgba(0,120,212,.3)}
.vd-thumb-label{font-size:13px;font-weight:700;color:var(--text)}
.vd-thumb-count{font-size:11px;color:var(--text2)}

/* ── Notification center ── */
.notif-panel{position:fixed;top:0;right:0;width:320px;height:calc(100% - 68px);background:var(--glass);border-left:1px solid var(--border);backdrop-filter:blur(24px);z-index:99970;transform:translateX(100%);transition:transform .28s cubic-bezier(.34,1.56,.64,1);display:flex;flex-direction:column}
.notif-panel.open{transform:translateX(0)}
.notif-header{padding:18px 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.notif-title{font-size:14px;font-weight:700;color:var(--text)}
.notif-clear{font-size:11px;color:var(--accent);cursor:pointer;padding:3px 8px;border-radius:4px;border:none;background:transparent;font-family:'Oxanium',sans-serif}
.notif-clear:hover{background:var(--bg2)}
.notif-list{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:8px}
.notif-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;animation:slideDown .2s ease}
.notif-item-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.notif-item-icon{font-size:16px}
.notif-item-app{font-size:11px;font-weight:700;color:var(--text2);flex:1;letter-spacing:.5px;text-transform:uppercase}
.notif-item-time{font-size:10px;color:var(--text2)}
.notif-item-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.notif-item-body{font-size:12px;color:var(--text2);line-height:1.5}
.notif-dismiss{background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px;padding:0 4px;transition:color .15s}
.notif-dismiss:hover{color:var(--text)}
.notif-empty{text-align:center;padding:40px 20px;color:var(--text2);font-size:13px}

/* ── Quick settings ── */
.qs-panel{position:fixed;bottom:72px;right:8px;width:280px;background:var(--glass);border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.35);backdrop-filter:blur(24px);z-index:99971;display:none;padding:16px;animation:scaleIn .2s ease}
.qs-panel.open{display:block}
.qs-title{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-bottom:12px}
.qs-toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.qs-toggle{padding:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;cursor:pointer;text-align:center;transition:all .18s;font-size:12px;font-weight:600;color:var(--text)}
.qs-toggle:hover{background:var(--bg3)}
.qs-toggle.on{background:rgba(0,120,212,.2);border-color:var(--accent);color:var(--accent)}
.qs-toggle-icon{font-size:20px;display:block;margin-bottom:4px}
.qs-slider-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qs-slider-row span:first-child{font-size:16px;width:22px;text-align:center}
.qs-slider{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--bg3);outline:none;cursor:pointer}
.qs-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer}
.qs-val{font-size:11px;font-weight:700;color:var(--text);width:32px;text-align:right}
.qs-themes{display:flex;gap:6px;margin-top:12px}
.qs-theme{flex:1;padding:6px;border-radius:7px;cursor:pointer;border:2px solid var(--border);font-size:11px;font-weight:700;text-align:center;transition:all .18s}
.qs-theme:hover{transform:scale(1.04)}
.qs-theme.active{border-color:var(--accent)}

/* ── Calendar popup ── */
.cal-popup{position:fixed;bottom:72px;right:8px;width:240px;background:var(--glass);border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.35);backdrop-filter:blur(24px);z-index:99972;display:none;padding:14px;animation:scaleIn .18s ease}
.cal-popup.open{display:block}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-month{font-size:13px;font-weight:700;color:var(--text)}
.cal-nav{background:none;border:none;cursor:pointer;color:var(--text2);font-size:14px;padding:2px 6px;border-radius:4px;transition:background .15s;font-family:'Oxanium',sans-serif}
.cal-nav:hover{background:var(--bg2);color:var(--text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-dow{font-size:9px;font-weight:700;color:var(--text2);padding:2px 0;letter-spacing:1px}
.cal-day{font-size:11px;padding:4px 2px;border-radius:4px;cursor:default;color:var(--text);transition:background .12s}
.cal-day.today{background:var(--accent);color:#fff;border-radius:50%;font-weight:700}
.cal-day.other-month{color:var(--text2);opacity:.4}

/* ── Desktop context menu ── */
.desk-ctx{position:fixed;background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:4px 0;min-width:200px;box-shadow:0 10px 28px rgba(0,0,0,.3);z-index:99999;display:none;backdrop-filter:blur(20px)}
.desk-ctx.open{display:block;animation:scaleIn .12s ease}
.ctx-item{padding:8px 14px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:10px;color:var(--text);transition:background .1s}
.ctx-item:hover{background:var(--bg2)}
.ctx-sep{height:1px;background:var(--border);margin:3px 0}

/* ── Desktop widgets ── */
.desktop-widget{position:absolute;z-index:50;user-select:none}
.widget-clock{background:rgba(0,0,0,.48);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 18px;color:#fff;text-align:center;cursor:move;min-width:140px}
.widget-clock .wc-time{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1}
.widget-clock .wc-date{font-size:11px;opacity:.55;margin-top:4px;letter-spacing:1px}
.widget-stats{background:rgba(0,0,0,.48);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;color:#fff;cursor:move;min-width:160px}
.widget-stats .ws-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:2px 0}
.widget-stats .ws-label{opacity:.55}

.widget-sticky{background:#fef08a;border-radius:10px;padding:10px 12px;cursor:move;min-width:160px;min-height:100px;box-shadow:0 4px 14px rgba(0,0,0,.2)}

.widget-close{position:absolute;top:5px;right:7px;background:rgba(0,0,0,.18);border:none;border-radius:50%;width:17px;height:17px;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .18s}
.desktop-widget:hover .widget-close{opacity:1}

/* ── Tray popups ── */
.tray-popup{position:fixed;bottom:72px;right:12px;background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:14px;width:250px;box-shadow:0 10px 32px rgba(0,0,0,.3);z-index:99973;display:none;backdrop-filter:blur(24px);animation:scaleIn .18s ease}
.tray-popup.active{display:block}
.tray-popup-title{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-bottom:10px}
.tray-slider-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tray-slider-row span{font-size:16px;width:22px;text-align:center}
.tray-slider{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--bg3);outline:none;cursor:pointer}
.tray-slider::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 4px rgba(0,120,212,.4)}
.tray-value{font-size:12px;font-weight:700;color:var(--text);width:34px;text-align:right}
.tray-mute-btn{width:100%;padding:7px;margin-top:5px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--text);font-size:12px;font-family:'Oxanium',sans-serif;transition:background .15s}
.tray-mute-btn:hover{background:var(--bg3)}
.net-status{display:flex;align-items:center;gap:10px;padding:9px 10px;background:var(--bg2);border-radius:8px}
.net-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.net-dot.online{background:#34c759;box-shadow:0 0 6px #34c759}

.ns-label{font-size:12px;font-weight:700;color:var(--text)}
.ns-sub{font-size:10px;color:var(--text2);margin-top:1px}

/* ── Taskbar right-click menu ── */
.tb-ctx{position:fixed;background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:4px 0;min-width:170px;box-shadow:0 10px 28px rgba(0,0,0,.3);z-index:99998;display:none;backdrop-filter:blur(20px)}

/* ── Shutdown overlay ── */

.shutdown-overlay.open{display:flex;animation:shutdownFade .5s ease}
.shutdown-logo{font-size:64px;animation:pulse 2s ease infinite}
.shutdown-text{font-family:'Oxanium',sans-serif;font-size:16px;letter-spacing:4px;color:rgba(255,255,255,.6);text-transform:uppercase}
.shutdown-dots{display:flex;gap:8px}
.shutdown-dots span{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease infinite}
.shutdown-dots span:nth-child(2){animation-delay:.2s}
.shutdown-dots span:nth-child(3){animation-delay:.4s}

/* ── Scrollbars ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

<script>
// ══════════════════════════════════════════════
//  ONE-TIME MIGRATION: eclipseos_* → serverplex_*
//  Runs once on first load, converts all old keys silently.
// ══════════════════════════════════════════════
(function migrateLegacyKeys() {
  if (localStorage.getItem('serverplex_migrated') === 'true') return;
  var oldPrefix = 'eclipseos_', newPrefix = 'serverplex_';
  Object.keys(localStorage).forEach(function(key) {
    if (key.indexOf(oldPrefix) === 0) {
      var newKey = newPrefix + key.slice(oldPrefix.length);
      // Don't overwrite if new key already exists
      if (!localStorage.getItem(newKey)) localStorage.setItem(newKey, localStorage.getItem(key));
      localStorage.removeItem(key);
    }
  });
  // Also migrate sessionStorage authed flag
  var authed = sessionStorage.getItem('eclipseos_authed');
  if (authed) { sessionStorage.setItem('serverplex_authed', authed); sessionStorage.removeItem('eclipseos_authed'); }
  localStorage.setItem('serverplex_migrated', 'true');
})();

// ══════════════════════════════════════════════
//  BOOT ROUTING
// ══════════════════════════════════════════════
(function(){
  var setup = localStorage.getItem('serverplex_setup_complete') === 'true';
  var hasPin = !!localStorage.getItem('serverplex_pin');
  var hasPw  = !!localStorage.getItem('serverplex_password');
  var authed = sessionStorage.getItem('serverplex_authed') === 'true' || sessionStorage.getItem('eclipseos_authed') === 'true';
  if (!setup) { window.location.replace('welcome.html'); return; }
  if ((hasPin || hasPw) && !authed) { window.location.replace('account.html'); return; }
})();

// ══════════════════════════════════════════════
//  APP REGISTRY + PER-APP COLORS
// ══════════════════════════════════════════════
const APP_COLORS = {
  browser:'#0078d4', notepad:'#ff9500', calculator:'#5856d6', calendar:'#34c759',
  terminal:'#1c1c1e', code:'#007acc', paint:'#ff2d55', todolist:'#ff9500',
  stickynotes:'#ffcc00', imageviewer:'#af52de', clock:'#5ac8fa', recyclebin:'#8e8e93',
  search:'#0078d4', musicplayer:'#fc3158', markdowneditor:'#34c759',
  settings:'#636366', filemanager:'#0078d4', games:'#ff375f',
  voicerecorder:'#ff3b30', screenrecorder:'#ff3b30', appstore:'#0078d4',
};

const apps = {
  browser:        { name:'Browser',         icon:'🌐', file:'os-apps/browser.html',        category:'Internet' },
  notepad:        { name:'Notepad',          icon:'📝', file:'os-apps/notepad.html',         category:'Productivity' },
  calculator:     { name:'Calculator',       icon:'🧮', file:'os-apps/calculator.html',      category:'Utilities', width:360, height:520 },
  calendar:       { name:'Calendar',         icon:'📅', file:'os-apps/calendar.html',        category:'Productivity' },
  terminal:       { name:'Terminal',         icon:'💻', file:'os-apps/terminal.html',        category:'System' },
  code:           { name:'Code Editor',      icon:'👨‍💻', file:'os-apps/code.html',            category:'Development', width:1200, height:700 },
  paint:          { name:'Paint',            icon:'🎨', file:'os-apps/paint.html',           category:'Creative' },
  todolist:       { name:'To-Do List',       icon:'📋', file:'os-apps/todolist.html',        category:'Productivity' },
  stickynotes:    { name:'Sticky Notes',     icon:'📌', file:'os-apps/stickynotes.html',     category:'Productivity' },
  imageviewer:    { name:'Image Viewer',     icon:'🖼️', file:'os-apps/imageviewer.html',     category:'Media' },
  clock:          { name:'Clock',            icon:'⏰', file:'os-apps/clock.html',           category:'Utilities' },
  recyclebin:     { name:'Recycle Bin',      icon:'🗑️', file:'os-apps/recyclebin.html',      category:'System' },
  search:         { name:'Search',           icon:'🔍', file:'os-apps/search.html',          category:'System' },
  musicplayer:    { name:'Music Player',     icon:'🎵', file:'os-apps/musicplayer.html',     category:'Media' },
  markdowneditor: { name:'Markdown Editor',  icon:'📄', file:'os-apps/markdowneditor.html',  category:'Productivity' },
  settings:       { name:'Settings',         icon:'⚙️', file:'settings/settings-main.html', category:'System' },
  filemanager:    { name:'File Manager',     icon:'📁', file:'os-apps/filemanager.html',     category:'System' },
  games:          { name:'Games',            icon:'🎮', file:'os-apps/games.html',           category:'Entertainment' },
  voicerecorder:  { name:'Voice Recorder',   icon:'🎙️', file:'os-apps/voicerecorder.html',  category:'Media' },
  screenrecorder: { name:'Screen Recorder',  icon:'📹', file:'os-apps/screenrecorder.html', category:'Media' },
  appstore:       { name:'App Store',        icon:'🏪', file:'os-apps/appstore.html',        category:'System' },
};

// Custom icons map (add image URLs here per app ID)
const CUSTOM_ICONS = {};

function getIconHtml(app, size) {
  size = size || 48;
  if (app && app.customIcon) return '<img src="'+app.customIcon+'" width="'+size+'" height="'+size+'" style="object-fit:contain;border-radius:'+Math.round(size*.18)+'px" alt="">';
  return (app && app.icon) ? app.icon : '';
}

// Apply custom icons from map
Object.keys(CUSTOM_ICONS).forEach(id => { if (apps[id]) apps[id].customIcon = CUSTOM_ICONS[id]; });

// ══════════════════════════════════════════════
//  OS STATE
// ══════════════════════════════════════════════
let windows = {}, zIdx = 100;
let selectedIcons = new Set();
let currentTheme = localStorage.getItem('serverplex_theme') || 'white';
let desktopLayout = JSON.parse(localStorage.getItem('serverplex_desktop_layout') || '{}');
let currentVd = 0; // virtual desktop index (0-3)
let dndMode = localStorage.getItem('serverplex_dnd') === 'true';
let notifications = JSON.parse(localStorage.getItem('serverplex_notifs') || '[]');
let pinnedAppIds = JSON.parse(localStorage.getItem('serverplex_pinned') || '["browser","games","settings","terminal"]');
let volLevel = 100, isMuted = false;
let calDate = new Date();
const GRID_SIZE = 100, GRID_PAD = 20;

// Purge stale layout
Object.keys(desktopLayout).forEach(id => { if (!apps[id]) delete desktopLayout[id]; });

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
function init() {
  document.body.className = 'theme-' + currentTheme;
  var fs = localStorage.getItem('serverplex_os_font_size');
  if (fs) document.body.style.fontSize = fs + 'px';
  var acc = localStorage.getItem('serverplex_accent');
  if (acc) document.documentElement.style.setProperty('--accent', acc);

  var wp = localStorage.getItem('serverplex_wallpaper');
  if (wp && wp !== 'none') {
    var d = document.getElementById('desktop');
    d.style.background = (wp.startsWith('http') || wp.startsWith('data:')) ? "url('"+wp+"') center/cover no-repeat" : wp;
  }

  var nm = localStorage.getItem('serverplex_nightmode') === 'true';
  if (nm) document.body.style.filter = 'sepia(20%) brightness(85%)';

  document.getElementById('smUsername').textContent = localStorage.getItem('serverplex_username') || 'User';
  document.getElementById('smAvatar').textContent   = localStorage.getItem('serverplex_avatar')   || '👤';

  if (dndMode) { document.getElementById('dndDot').classList.add('on'); document.getElementById('qsDnd').classList.add('on'); }

  renderDesktopIcons();
  renderPinnedApps();
  renderStartMenuApps();
  renderVdSwitcher();
  updateClock();
  setInterval(updateClock, 1000);
  initContextMenu();
  initWidgets();
  initRubberBand();
  initTicker();
  updateQsTheme();
  updateNetworkStatus();
  renderNotifList();

  document.getElementById('startButton').addEventListener('click', toggleStartMenu);
  document.addEventListener('click', e => {
    if (!e.target.closest('.start-menu') && !e.target.closest('.start-button')) closeStartMenu();
    if (!e.target.closest('.qs-panel') && !e.target.closest('[onclick*="toggleQs"]')) document.getElementById('qsPanel').classList.remove('open');
    if (!e.target.closest('.cal-popup') && !e.target.closest('.tray-clock')) document.getElementById('calPopup').classList.remove('open');
    if (!e.target.closest('.tray-popup') && !e.target.closest('[onclick*="toggleTray"]')) document.querySelectorAll('.tray-popup').forEach(p => p.classList.remove('active'));
    if (!e.target.closest('.tb-ctx')) document.getElementById('tbCtx').classList.remove('open');
    if (!e.target.closest('.desk-ctx')) document.getElementById('deskCtx').classList.remove('open');
  });
  document.getElementById('desktop').addEventListener('click', e => {
    if (e.target.id === 'desktop' || e.target.id === 'desktopIcons') deselectAllIcons();
  });
  window.addEventListener('resize', () => { Object.values(windows).forEach(w => constrainWindow(w.element)); });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === ' ') { e.preventDefault(); toggleSpotlight(); }
    if (e.key === 'Escape') { closeSpotlight(); closeVdPreview(); document.getElementById('notifPanel').classList.remove('open'); }
    if (e.ctrlKey && e.key >= '1' && e.key <= '4') switchVd(parseInt(e.key) - 1);
    if (e.ctrlKey && e.shiftKey && e.key === 'D') showVdPreview();
  });

  // Startup chime
  setTimeout(playStartupChime, 400);

  // Startup apps
  setTimeout(() => {
    JSON.parse(localStorage.getItem('serverplex_startup_apps') || '[]').forEach(id => { if (apps[id]) openApp(id); });
  }, 800);
}

// ══════════════════════════════════════════════
//  STARTUP CHIME
// ══════════════════════════════════════════════
function playStartupChime() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    [[261.63,0],[329.63,.13],[392,.26],[523.25,.4]].forEach(([freq, t]) => {
      var osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq; osc.type = 'sine';
      gain.gain.setValueAtTime(0, ctx.currentTime + t);
      gain.gain.linearRampToValueAtTime(.12, ctx.currentTime + t + .06);
      gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .5);
      osc.start(ctx.currentTime + t); osc.stop(ctx.currentTime + t + .5);
    });
  } catch(e) {}
}

// ══════════════════════════════════════════════
//  GRID HELPERS
// ══════════════════════════════════════════════
function getGridPos(x, y) {
  var col = Math.round((x - GRID_PAD) / GRID_SIZE), row = Math.round((y - GRID_PAD) / GRID_SIZE);
  return { x: GRID_PAD + col * GRID_SIZE, y: GRID_PAD + row * GRID_SIZE, col, row };
}
function gridOccupied(col, row, exclude) {
  return Object.keys(desktopLayout).some(id => {
    if (id === exclude) return false;
    var g = getGridPos(desktopLayout[id].x, desktopLayout[id].y);
    return g.col === col && g.row === row;
  });
}
function nextFreeGrid(start) {
  start = start || 0;
  var maxCols = Math.floor((window.innerWidth - GRID_PAD * 2) / GRID_SIZE);
  for (var i = start; i < 1000; i++) {
    var col = i % maxCols, row = Math.floor(i / maxCols);
    if (!gridOccupied(col, row)) return { x: GRID_PAD + col * GRID_SIZE, y: GRID_PAD + row * GRID_SIZE, col, row };
  }
  return { x: GRID_PAD, y: GRID_PAD, col: 0, row: 0 };
}

// ══════════════════════════════════════════════
//  DESKTOP ICONS
// ══════════════════════════════════════════════
function renderDesktopIcons() {
  var container = document.getElementById('desktopIcons');
  container.innerHTML = '';
  var gridIdx = 0;
  Object.keys(apps).forEach((appId, idx) => {
    var app = apps[appId];
    var icon = document.createElement('div');
    icon.className = 'desktop-icon';
    icon.dataset.appId = appId;
    icon.style.opacity = '0';
    icon.style.animation = 'fadeIn .45s ease forwards';
    icon.style.animationDelay = (idx * .04) + 's';

    var saved = desktopLayout[appId];
    var pos;
    if (saved) {
      pos = getGridPos(saved.x, saved.y);
      if (gridOccupied(pos.col, pos.row, appId)) { pos = nextFreeGrid(gridIdx); gridIdx++; }
    } else { pos = nextFreeGrid(gridIdx); gridIdx++; }
    icon.style.left = pos.x + 'px'; icon.style.top = pos.y + 'px';
    desktopLayout[appId] = { x: pos.x, y: pos.y };

    icon.innerHTML = '<div class="icon-image">' + getIconHtml(app, 46) + '</div><div class="icon-label" id="lbl-'+appId+'">' + app.name + '</div>';
    icon.addEventListener('click', e => { e.stopPropagation(); selectIcon(icon, e.ctrlKey || e.metaKey); });
    icon.addEventListener('dblclick', () => openApp(appId));
    icon.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); showIconCtx(e, appId, icon); });
    makeIconDraggable(icon);
    container.appendChild(icon);
  });
  localStorage.setItem('serverplex_desktop_layout', JSON.stringify(desktopLayout));
}

function selectIcon(icon, multi) {
  if (!multi) deselectAllIcons();
  icon.classList.add('selected');
  selectedIcons.add(icon.dataset.appId);
}
function deselectAllIcons() {
  document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
  selectedIcons.clear();
}

function showIconCtx(e, appId, icon) {
  var menu = document.getElementById('deskCtx');
  menu.innerHTML = `
    <div class="ctx-item" onclick="openApp('${appId}');closeCtxMenu()">▶ Open</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" onclick="startRename('${appId}');closeCtxMenu()">✏️ Rename</div>
    <div class="ctx-item" onclick="pinToggle('${appId}');closeCtxMenu()">📌 ${pinnedAppIds.includes(appId)?'Unpin from':'Pin to'} Taskbar</div>`;
  var x = Math.min(e.clientX, window.innerWidth - 200), y = Math.min(e.clientY, window.innerHeight - 150);
  menu.style.left = x + 'px'; menu.style.top = y + 'px';
  menu.classList.add('open');
}

function startRename(appId) {
  var lbl = document.getElementById('lbl-' + appId);
  if (!lbl) return;
  var cur = apps[appId].name;
  lbl.innerHTML = '<input class="icon-label-edit" value="' + cur + '" id="ren-' + appId + '">';
  var inp = document.getElementById('ren-' + appId);
  inp.focus(); inp.select();
  function done() {
    var val = inp.value.trim() || cur;
    apps[appId].name = val;
    lbl.textContent = val;
    renderStartMenuApps();
    renderPinnedApps();
  }
  inp.addEventListener('blur', done);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { inp.blur(); } if (e.key === 'Escape') { inp.value = cur; inp.blur(); } });
}

function makeIconDraggable(element) {
  var isDragging = false, startX, startY, initialX, initialY;
  var gp = document.getElementById('gridPreview');
  element.addEventListener('mousedown', e => {
    if (e.detail === 2 || e.button !== 0) return;
    isDragging = true; startX = e.clientX; startY = e.clientY;
    initialX = element.offsetLeft; initialY = element.offsetTop;
    element.style.zIndex = 1000; element.classList.add('dragging');
  });
  document.addEventListener('mousemove', e => {
    if (!isDragging) return; e.preventDefault();
    var nx = initialX + (e.clientX - startX), ny = initialY + (e.clientY - startY);
    element.style.left = nx + 'px'; element.style.top = ny + 'px';
    var gPos = getGridPos(nx, ny), occ = gridOccupied(gPos.col, gPos.row, element.dataset.appId);
    gp.style.display = 'block'; gp.style.left = gPos.x + 'px'; gp.style.top = gPos.y + 'px';
    gp.className = 'grid-preview' + (occ ? ' occupied' : '');
  });
  document.addEventListener('mouseup', () => {
    if (!isDragging) return; isDragging = false;
    element.style.zIndex = ''; element.classList.remove('dragging'); gp.style.display = 'none';
    var cx = parseInt(element.style.left), cy = parseInt(element.style.top);
    var gPos = getGridPos(cx, cy), appId = element.dataset.appId;
    if (gridOccupied(gPos.col, gPos.row, appId)) {
      var s = desktopLayout[appId];
      if (s) { element.style.left = s.x + 'px'; element.style.top = s.y + 'px'; }
    } else {
      element.style.left = gPos.x + 'px'; element.style.top = gPos.y + 'px';
      desktopLayout[appId] = { x: gPos.x, y: gPos.y };
      localStorage.setItem('serverplex_desktop_layout', JSON.stringify(desktopLayout));
    }
  });
}

// ══════════════════════════════════════════════
//  RUBBER-BAND MULTI-SELECT
// ══════════════════════════════════════════════
function initRubberBand() {
  var rb = document.getElementById('rubberBand');
  var startX, startY, dragging = false;
  document.getElementById('desktopIcons').addEventListener('mousedown', e => {
    if (e.target !== e.currentTarget && !e.target.classList.contains('desktop-icons')) return;
    if (e.button !== 0) return;
    startX = e.clientX; startY = e.clientY; dragging = true;
    rb.style.display = 'block'; rb.style.left = startX + 'px'; rb.style.top = startY + 'px';
    rb.style.width = '0'; rb.style.height = '0';
    if (!e.ctrlKey && !e.metaKey) deselectAllIcons();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    var x = Math.min(e.clientX, startX), y = Math.min(e.clientY, startY);
    var w = Math.abs(e.clientX - startX), h = Math.abs(e.clientY - startY);
    rb.style.left = x + 'px'; rb.style.top = y + 'px'; rb.style.width = w + 'px'; rb.style.height = h + 'px';
    var r1 = { x, y, x2: x + w, y2: y + h };
    document.querySelectorAll('.desktop-icon').forEach(icon => {
      var r = icon.getBoundingClientRect();
      var r2 = { x: r.left, y: r.top, x2: r.right, y2: r.bottom };
      var overlaps = r1.x < r2.x2 && r1.x2 > r2.x && r1.y < r2.y2 && r1.y2 > r2.y;
      if (overlaps) { icon.classList.add('selected'); selectedIcons.add(icon.dataset.appId); }
      else if (!e.ctrlKey && !e.metaKey) { icon.classList.remove('selected'); selectedIcons.delete(icon.dataset.appId); }
    });
  });
  document.addEventListener('mouseup', () => { if (!dragging) return; dragging = false; rb.style.display = 'none'; });
}

//  START MENU
// ══════════════════════════════════════════════
function renderStartMenuApps() {
  var g = document.getElementById('smGrid'); g.innerHTML = '';
  Object.keys(apps).forEach((id, i) => {
    var a = apps[id], item = document.createElement('div');
    item.className = 'sm-item';
    item.style.animation = 'slideUp .35s ease forwards';
    item.style.animationDelay = (i * .025) + 's';
    item.style.opacity = '0';
    item.innerHTML = '<div class="sm-icon">' + getIconHtml(a, 28) + '</div><div class="sm-label">' + a.name + '</div>';
    item.addEventListener('click', () => { openApp(id); closeStartMenu(); });
    g.appendChild(item);
  });
}
function toggleStartMenu() { document.getElementById('startMenu').classList.toggle('active'); }
function closeStartMenu() { document.getElementById('startMenu').classList.remove('active'); }

// ══════════════════════════════════════════════
//  PINNED APPS
// ══════════════════════════════════════════════
function renderPinnedApps() {
  var c = document.getElementById('pinnedApps'); c.innerHTML = '';
  pinnedAppIds.forEach(id => {
    var a = apps[id]; if (!a) return;
    var btn = document.createElement('div');
    btn.className = 'pinned-app';
    btn.title = a.name;
    btn.dataset.appId = id;
    btn.innerHTML = getIconHtml(a, 20) || a.icon;
    btn.addEventListener('click', () => openApp(id));
    btn.addEventListener('contextmenu', e => { e.preventDefault(); showTbCtx(e, id, true); });
    if (windows[id]) btn.classList.add('running');
    c.appendChild(btn);
  });
  localStorage.setItem('serverplex_pinned', JSON.stringify(pinnedAppIds));
}
function pinToggle(id) {
  if (pinnedAppIds.includes(id)) pinnedAppIds = pinnedAppIds.filter(x => x !== id);
  else pinnedAppIds.push(id);
  renderPinnedApps();
}

// ══════════════════════════════════════════════
//  VIRTUAL DESKTOPS
// ══════════════════════════════════════════════
function renderVdSwitcher() {
  var c = document.getElementById('vdSwitcher'); c.innerHTML = '';
  for (var i = 0; i < 4; i++) {
    var btn = document.createElement('div');
    btn.className = 'vd-btn' + (i === currentVd ? ' active' : '');
    btn.textContent = i + 1;
    btn.dataset.vd = i;
    btn.title = 'Desktop ' + (i + 1);
    btn.addEventListener('click', (function(idx){ return () => switchVd(idx); })(i));
    btn.addEventListener('contextmenu', e => { e.preventDefault(); showVdPreview(); });
    c.appendChild(btn);
  }
}
function switchVd(idx) {
  if (idx === currentVd) return;
  Object.values(windows).forEach(w => {
    var el = w.element;
    el.style.display = (w.vd === idx && !w.minimized) ? '' : 'none';
  });
  currentVd = idx;
  renderVdSwitcher();
  updateTaskbar();
}
function showVdPreview() {
  var ov = document.getElementById('vdPreview'); ov.innerHTML = '';
  for (var i = 0; i < 4; i++) {
    var thumb = document.createElement('div');
    thumb.className = 'vd-thumb' + (i === currentVd ? ' active' : '');
    var count = Object.values(windows).filter(w => w.vd === i).length;
    thumb.innerHTML = '<div class="vd-thumb-label">Desktop ' + (i+1) + '</div><div class="vd-thumb-count">' + count + ' window' + (count !== 1 ? 's' : '') + '</div>';
    thumb.addEventListener('click', (function(idx){ return () => { switchVd(idx); closeVdPreview(); }; })(i));
    ov.appendChild(thumb);
  }
  ov.classList.add('open');
}
function closeVdPreview() { document.getElementById('vdPreview').classList.remove('open'); }

// ══════════════════════════════════════════════
//  WINDOW MANAGEMENT
// ══════════════════════════════════════════════
function openApp(appId) {
  var existing = windows[appId];
  if (existing) {
    bringToFront(appId);
    if (existing.minimized) {
      existing.element.classList.remove('minimized');
      existing.element.classList.add('restoring');
      existing.minimized = false;
      existing.element.style.display = '';
      constrainWindow(existing.element);
      setTimeout(() => existing.element.classList.remove('restoring'), 300);
    }
    return;
  }
  var a = apps[appId];
  var el = document.createElement('div');
  el.className = 'window';
  el.dataset.appId = appId;
  el.style.zIndex = ++zIdx;

  var mw = window.innerWidth - 40, mh = window.innerHeight - 88;
  var dw = Math.min(a.width || 820, mw), dh = Math.min(a.height || 620, mh);
  var left = Math.max(20, (window.innerWidth - dw) / 2);
  var top  = Math.max(20, (window.innerHeight - dh - 68) / 2);
  left = Math.min(left, window.innerWidth - dw - 20);
  top  = Math.min(top,  window.innerHeight - dh - 88);
  el.style.width = dw + 'px'; el.style.height = dh + 'px';
  el.style.left  = left + 'px'; el.style.top = top + 'px';

  var tbColor = APP_COLORS[appId] || 'var(--accent)';
  el.innerHTML = `
    <div class="window-titlebar" style="background:${tbColor}">
      <span class="window-icon">${getIconHtml(a,16)}</span>
      <span class="window-title">${a.name}</span>
      <div class="window-controls">
        <div class="wcb min" title="Minimize">−</div>
        <div class="wcb max" title="Maximize">□</div>
        <div class="wcb cls" title="Close">×</div>
      </div>
    </div>
    <div class="window-content"><iframe src="${a.file}"></iframe></div>
    <div class="resize-handle right"></div>
    <div class="resize-handle bottom"></div>
    <div class="resize-handle bottom-right"></div>`;

  document.body.appendChild(el);
  windows[appId] = { element: el, minimized: false, maximized: false, vd: currentVd };
  constrainWindow(el);

  el.querySelector('.min').addEventListener('click', () => minimizeWindow(appId));
  el.querySelector('.max').addEventListener('click', () => toggleMaximize(appId));
  el.querySelector('.cls').addEventListener('click', () => closeWindow(appId));
  el.addEventListener('mousedown', () => bringToFront(appId));
  makeWindowDraggable(el);
  makeWindowResizable(el);
  updateTaskbar();
  renderPinnedApps();

  // Show notification
  pushNotif(a.icon, a.name, a.name + ' opened', '');
}

function makeWindowDraggable(el) {
  var tb = el.querySelector('.window-titlebar');
  var isDrag = false, sx, sy, ix, iy, wasSnapped = false;
  var snap = null;
  var preview = document.getElementById('snapPreview');

  tb.addEventListener('mousedown', e => {
    if (e.target.closest('.window-controls') || el.classList.contains('maximized')) return;
    isDrag = true; sx = e.clientX; sy = e.clientY;
    ix = el.offsetLeft; iy = el.offsetTop;
    wasSnapped = ['snap-left','snap-right','snap-tl','snap-tr','snap-bl','snap-br'].some(c => el.classList.contains(c));
    if (wasSnapped) el.className = el.className.replace(/snap-\w+/g, '').trim();
  });
  document.addEventListener('mousemove', e => {
    if (!isDrag) return; e.preventDefault();
    var nx = Math.max(0, Math.min(ix + (e.clientX - sx), window.innerWidth - el.offsetWidth));
    var ny = Math.max(0, Math.min(iy + (e.clientY - sy), window.innerHeight - 68 - el.offsetHeight));
    el.style.left = nx + 'px'; el.style.top = ny + 'px';
    snap = getSnapZone(e.clientX, e.clientY);
    showSnapPreview(snap);
  });
  document.addEventListener('mouseup', () => {
    if (!isDrag) return; isDrag = false; preview.style.display = 'none';
    if (snap) { applySnap(el, snap); snap = null; }
  });
}

function getSnapZone(x, y) {
  var h = window.innerHeight - 68, w = window.innerWidth;
  if (y < 6) return 'maximize';
  if (x < 16 && y < h * .5) return 'snap-tl';
  if (x < 16 && y >= h * .5) return 'snap-bl';
  if (x > w - 16 && y < h * .5) return 'snap-tr';
  if (x > w - 16 && y >= h * .5) return 'snap-br';
  if (x < 16) return 'snap-left';
  if (x > w - 16) return 'snap-right';
  return null;
}
function showSnapPreview(zone) {
  var p = document.getElementById('snapPreview'), h = window.innerHeight - 68, w = window.innerWidth;
  if (!zone) { p.style.display = 'none'; return; }
  var styles = {
    'maximize':   `top:0;left:0;width:${w}px;height:${h}px`,
    'snap-left':  `top:0;left:0;width:${w*.5}px;height:${h}px`,
    'snap-right': `top:0;left:${w*.5}px;width:${w*.5}px;height:${h}px`,
    'snap-tl':    `top:0;left:0;width:${w*.5}px;height:${h*.5}px`,
    'snap-tr':    `top:0;left:${w*.5}px;width:${w*.5}px;height:${h*.5}px`,
    'snap-bl':    `top:${h*.5}px;left:0;width:${w*.5}px;height:${h*.5}px`,
    'snap-br':    `top:${h*.5}px;left:${w*.5}px;width:${w*.5}px;height:${h*.5}px`,
  };
  p.style.cssText = 'display:block;position:fixed;background:rgba(0,120,212,.18);border:2px solid rgba(0,120,212,.55);border-radius:6px;pointer-events:none;z-index:99999;transition:all .1s;' + styles[zone];
}
function applySnap(el, zone) {
  el.className = el.className.replace(/snap-\w+/g, '').replace(/maximized/g, '').trim();
  if (zone === 'maximize') { el.classList.add('maximized'); return; }
  el.classList.add(zone);
}

function makeWindowResizable(el) {
  var tip = document.getElementById('resizeTooltip');
  el.querySelectorAll('.resize-handle').forEach(handle => {
    var isRes = false, sx, sy, sw, sh;
    handle.addEventListener('mousedown', e => {
      if (el.classList.contains('maximized')) return;
      e.stopPropagation(); isRes = true;
      sx = e.clientX; sy = e.clientY; sw = el.offsetWidth; sh = el.offsetHeight;
    });
    document.addEventListener('mousemove', e => {
      if (!isRes) return; e.preventDefault();
      var dx = e.clientX - sx, dy = e.clientY - sy;
      var maxW = Math.max(360, window.innerWidth - el.offsetLeft);
      var maxH = Math.max(260, window.innerHeight - 68 - el.offsetTop);
      if (handle.classList.contains('right') || handle.classList.contains('bottom-right'))
        el.style.width = Math.min(Math.max(360, sw + dx), maxW) + 'px';
      if (handle.classList.contains('bottom') || handle.classList.contains('bottom-right'))
        el.style.height = Math.min(Math.max(260, sh + dy), maxH) + 'px';
      tip.style.display = 'block';
      tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
      tip.textContent = Math.round(el.offsetWidth) + ' × ' + Math.round(el.offsetHeight);
    });
    document.addEventListener('mouseup', () => { if (isRes) { isRes = false; tip.style.display = 'none'; } });
  });
}

function bringToFront(appId) {
  if (windows[appId]) { windows[appId].element.style.zIndex = ++zIdx; updateTaskbar(); }
}
function constrainWindow(el) {
  if (el.classList.contains('maximized')) return;
  var w = el.offsetWidth, h = el.offsetHeight;
  var l = Math.max(0, Math.min(el.offsetLeft, window.innerWidth - w));
  var t = Math.max(0, Math.min(el.offsetTop, window.innerHeight - 68 - h));
  el.style.left = l + 'px'; el.style.top = t + 'px';
}
function minimizeWindow(appId) {
  var w = windows[appId]; if (!w) return;
  w.element.classList.add('minimizing');
  setTimeout(() => { w.element.classList.remove('minimizing'); w.element.style.display = 'none'; w.minimized = true; updateTaskbar(); }, 280);
}
function toggleMaximize(appId) {
  var w = windows[appId]; if (!w) return;
  w.element.className = w.element.className.replace(/snap-\w+/g, '').trim();
  w.element.classList.toggle('maximized'); w.maximized = !w.maximized;
}
function closeWindow(appId) {
  var w = windows[appId]; if (!w) return;
  w.element.classList.add('closing');
  setTimeout(() => { w.element.remove(); delete windows[appId]; updateTaskbar(); renderPinnedApps(); }, 200);
}

// Taskbar right-click on app
function showTbCtx(e, appId, isPinned) {
  var menu = document.getElementById('tbCtx');
  menu.innerHTML = `
    <div class="ctx-item" onclick="openApp('${appId}');document.getElementById('tbCtx').classList.remove('open')">▶ Open</div>
    <div class="ctx-item" onclick="pinToggle('${appId}');document.getElementById('tbCtx').classList.remove('open')">📌 ${pinnedAppIds.includes(appId)?'Unpin':'Pin to Taskbar'}</div>
    ${windows[appId] ? `<div class="ctx-sep"></div>
    <div class="ctx-item" onclick="minimizeWindow('${appId}');document.getElementById('tbCtx').classList.remove('open')">− Minimize</div>
    <div class="ctx-item" onclick="toggleMaximize('${appId}');document.getElementById('tbCtx').classList.remove('open')">□ Maximize</div>
    <div class="ctx-item" onclick="closeWindow('${appId}');document.getElementById('tbCtx').classList.remove('open')">✕ Close</div>` : ''}`;
  var x = Math.min(e.clientX, window.innerWidth - 190);
  var y = Math.max(0, e.clientY - menu.offsetHeight - 8);
  menu.style.left = x + 'px'; menu.style.top = (e.clientY - 120) + 'px';
  menu.classList.add('open');
}

function updateTaskbar() {
  var c = document.getElementById('taskbarApps'); c.innerHTML = '';
  Object.keys(windows).filter(id => windows[id].vd === currentVd).forEach(id => {
    var a = apps[id], w = windows[id];
    var btn = document.createElement('button');
    btn.className = 'taskbar-app';
    if (parseInt(w.element.style.zIndex) === zIdx) btn.classList.add('active');
    btn.innerHTML = '<span>' + getIconHtml(a, 16) + '</span><span class="taskbar-app-text">' + a.name + '</span><span class="tb-cls" onclick="event.stopPropagation();closeWindow(\''+id+'\')">✕</span>';
    btn.addEventListener('click', () => {
      if (w.minimized) { w.element.style.display = ''; w.element.classList.add('restoring'); w.minimized = false; constrainWindow(w.element); setTimeout(() => w.element.classList.remove('restoring'), 280); }
      bringToFront(id);
    });
    btn.addEventListener('contextmenu', e => { e.preventDefault(); showTbCtx(e, id, false); });
    c.appendChild(btn);
  });
  document.querySelectorAll('.pinned-app').forEach(p => {
    var id = p.dataset.appId;
    p.classList.toggle('running', !!windows[id]);
  });
}

// ══════════════════════════════════════════════
//  SPOTLIGHT SEARCH
// ══════════════════════════════════════════════
var spotlightIdx = -1;
function toggleSpotlight() {
  var ov = document.getElementById('spotlightOverlay');
  if (ov.classList.contains('open')) { closeSpotlight(); return; }
  ov.classList.add('open');
  document.getElementById('spotlightInput').value = '';
  spotlightSearch();
  setTimeout(() => document.getElementById('spotlightInput').focus(), 50);
}
function closeSpotlight() {
  document.getElementById('spotlightOverlay').classList.remove('open');
}
function spotlightSearch() {
  var q = document.getElementById('spotlightInput').value.toLowerCase();
  var res = document.getElementById('spotlightResults');
  var matches = Object.keys(apps).filter(id => !q || apps[id].name.toLowerCase().includes(q) || apps[id].category.toLowerCase().includes(q));
  if (!matches.length) { res.innerHTML = '<div class="spotlight-empty">No results for "' + q + '"</div>'; return; }
  spotlightIdx = -1;
  res.innerHTML = matches.map((id, i) => `<div class="spotlight-result" data-id="${id}" onclick="openApp('${id}');closeSpotlight()">
    <div class="spotlight-result-icon">${getIconHtml(apps[id],24)}</div>
    <div><div class="spotlight-result-name">${apps[id].name}</div><div class="spotlight-result-cat">${apps[id].category}</div></div>
  </div>`).join('');
}
function spotlightKey(e) {
  var items = document.querySelectorAll('.spotlight-result');
  if (e.key === 'ArrowDown') { spotlightIdx = Math.min(spotlightIdx + 1, items.length - 1); highlightSpotlight(items); }
  else if (e.key === 'ArrowUp') { spotlightIdx = Math.max(spotlightIdx - 1, 0); highlightSpotlight(items); }
  else if (e.key === 'Enter') {
    var sel = document.querySelector('.spotlight-result.highlighted');
    if (sel) { openApp(sel.dataset.id); closeSpotlight(); }
  } else if (e.key === 'Escape') closeSpotlight();
}
function highlightSpotlight(items) {
  items.forEach((el, i) => el.classList.toggle('highlighted', i === spotlightIdx));
  if (items[spotlightIdx]) items[spotlightIdx].scrollIntoView({ block: 'nearest' });
}

// ══════════════════════════════════════════════
//  NOTIFICATIONS
// ══════════════════════════════════════════════
function pushNotif(icon, app, title, body) {
  if (dndMode) return;
  var n = { id: Date.now(), icon, app, title, body, time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) };
  notifications.unshift(n);
  if (notifications.length > 50) notifications.pop();
  localStorage.setItem('serverplex_notifs', JSON.stringify(notifications));
  renderNotifList();
  var badge = document.getElementById('notifIcon');
  badge.textContent = '🔔' + (notifications.length > 0 ? ' ' + notifications.length : '');
}
function renderNotifList() {
  var c = document.getElementById('notifList');
  if (!notifications.length) { c.innerHTML = '<div class="notif-empty">No notifications</div>'; return; }
  c.innerHTML = notifications.map(n => `<div class="notif-item" id="notif-${n.id}">
    <div class="notif-item-header">
      <span class="notif-item-icon">${n.icon||'💬'}</span>
      <span class="notif-item-app">${n.app||''}</span>
      <span class="notif-item-time">${n.time||''}</span>
      <button class="notif-dismiss" onclick="dismissNotif(${n.id})">✕</button>
    </div>
    <div class="notif-item-title">${n.title||''}</div>
    ${n.body ? '<div class="notif-item-body">'+n.body+'</div>' : ''}
  </div>`).join('');
}
function dismissNotif(id) {
  notifications = notifications.filter(n => n.id !== id);
  localStorage.setItem('serverplex_notifs', JSON.stringify(notifications));
  renderNotifList();
}
function clearNotifs() { notifications = []; localStorage.setItem('serverplex_notifs', '[]'); renderNotifList(); document.getElementById('notifIcon').textContent = '🔔'; }
function toggleNotifPanel() { document.getElementById('notifPanel').classList.toggle('open'); }

function toggleQs() { document.getElementById('qsPanel').classList.toggle('open'); }
function toggleDnd() {
  dndMode = !dndMode;
  localStorage.setItem('serverplex_dnd', dndMode);
  document.getElementById('dndDot').classList.toggle('on', dndMode);
  document.getElementById('qsDnd').classList.toggle('on', dndMode);
}
function toggleNightMode() {

  var on = btn.classList.toggle('on');
  document.body.style.filter = on ? 'sepia(20%) brightness(85%)' : '';
  localStorage.setItem('serverplex_nightmode', on);
}
function onBrightness(v) {

function updateQsTheme() {

//  VOLUME
// ══════════════════════════════════════════════
function onVolumeChange(v) {
  volLevel = parseInt(v); isMuted = false;
  var icon = volLevel === 0 ? '🔇' : volLevel < 40 ? '🔉' : '🔊';
  document.getElementById('volEmoji').textContent = icon;
  document.getElementById('volumeIcon').textContent = icon;
  document.getElementById('volValue').textContent = v + '%';
  if (document.getElementById('qsVolVal')) document.getElementById('qsVolVal').textContent = v + '%';

}
function toggleMute() {
  isMuted = !isMuted;
  var icon = isMuted ? '🔇' : volLevel < 40 ? '🔉' : '🔊';
  document.getElementById('volEmoji').textContent = icon;
  document.getElementById('volumeIcon').textContent = icon;
}

// ══════════════════════════════════════════════
//  TRAY POPUPS
// ══════════════════════════════════════════════
function toggleTray(name) {
  document.querySelectorAll('.tray-popup').forEach(p => { if (p.id !== name + 'Popup') p.classList.remove('active'); });
  var p = document.getElementById(name + 'Popup'); if (!p) return;
  p.classList.toggle('active');
  if (name === 'network') updateNetworkStatus();
}
function updateNetworkStatus() {
  var dot = document.getElementById('netDot'), lbl = document.getElementById('netLabel'), sub = document.getElementById('netSub');
  if (!dot) return;
  var online = navigator.onLine;
  dot.className = 'net-dot ' + (online ? 'online' : 'offline');
  lbl.textContent = online ? 'Connected' : 'No Connection';
  sub.textContent = online ? 'Internet available' : 'Check your network';
  document.getElementById('networkIcon').textContent = online ? '📶' : '❌';
}
window.addEventListener('online',  updateNetworkStatus);
window.addEventListener('offline', updateNetworkStatus);

// ══════════════════════════════════════════════
//  CALENDAR
// ══════════════════════════════════════════════
function toggleCal() { var c = document.getElementById('calPopup'); c.classList.toggle('open'); if (c.classList.contains('open')) renderCal(); }
function calNav(dir) { calDate.setMonth(calDate.getMonth() + dir); renderCal(); }
function renderCal() {
  var now = new Date(), y = calDate.getFullYear(), m = calDate.getMonth();
  document.getElementById('calMonth').textContent = calDate.toLocaleString('default', {month:'long',year:'numeric'});
  var g = document.getElementById('calGrid');
  var days = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  g.innerHTML = days.map(d => '<div class="cal-dow">'+d+'</div>').join('');
  var first = new Date(y, m, 1).getDay(), last = new Date(y, m+1, 0).getDate();
  for (var i = 0; i < first; i++) g.innerHTML += '<div class="cal-day other-month"></div>';
  for (var d = 1; d <= last; d++) {
    var isToday = d === now.getDate() && m === now.getMonth() && y === now.getFullYear();
    g.innerHTML += '<div class="cal-day' + (isToday?' today':'') + '">' + d + '</div>';
  }
}

// ══════════════════════════════════════════════
//  CLOCK
// ══════════════════════════════════════════════
function updateClock() {
  var now = new Date();
  var fmt = localStorage.getItem('serverplex_clock_format') || '12';
  var h = now.getHours(), m = now.getMinutes().toString().padStart(2,'0');
  var timeStr = fmt === '24' ? h.toString().padStart(2,'0') + ':' + m : ((h%12||12) + ':' + m + ' ' + (h>=12?'PM':'AM'));
  document.getElementById('clockTime').textContent = timeStr;
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('clockDate').textContent = months[now.getMonth()] + ' ' + now.getDate();
}

function changeTheme(theme) {
  currentTheme = theme;
  document.body.className = 'theme-' + theme;
  localStorage.setItem('serverplex_theme', theme);
  updateQsTheme();

function setWallpaper(value) {
  var d = document.getElementById('desktop');
  if (value === 'none') { d.style.background = 'var(--bg)'; localStorage.removeItem('serverplex_wallpaper'); }
  else if (value.startsWith('http') || value.startsWith('data:')) { d.style.background = "url('"+value+"') center/cover no-repeat"; localStorage.setItem('serverplex_wallpaper', value); }
  else { d.style.background = value; localStorage.setItem('serverplex_wallpaper', value); }
}
function resetDesktopLayout() {
  if (confirm('Reset all desktop icons to default positions?')) { desktopLayout = {}; localStorage.removeItem('serverplex_desktop_layout'); renderDesktopIcons(); }
}

// ══════════════════════════════════════════════
function initContextMenu() {
  var menu = document.getElementById('deskCtx');
  document.getElementById('desktop').addEventListener('contextmenu', e => {
    if (e.target.closest('.desktop-icon') || e.target.closest('.desktop-widget')) return;
    e.preventDefault();
    menu.innerHTML = `
      <div class="ctx-item" onclick="openApp('notepad');closeCtxMenu()">📝 New Note</div>
      <div class="ctx-item" onclick="openApp('stickynotes');closeCtxMenu()">📌 New Sticky Note</div>
      <div class="ctx-sep"></div>
      <div class="ctx-item" onclick="addWidget('clock');closeCtxMenu()">🕐 Add Clock Widget</div>
      <div class="ctx-item" onclick="addWidget('stats');closeCtxMenu()">📊 Add Stats Widget</div>
      <div class="ctx-item" onclick="addWidget('weather');closeCtxMenu()">🌤️ Add Weather Widget</div>
      <div class="ctx-item" onclick="addWidget('sticky');closeCtxMenu()">📌 Add Sticky Widget</div>
      <div class="ctx-sep"></div>
      <div class="ctx-item" onclick="toggleSpotlight();closeCtxMenu()">🔍 Spotlight Search</div>
      <div class="ctx-item" onclick="openApp('settings');closeCtxMenu()">⚙️ Settings</div>
      <div class="ctx-item" onclick="resetDesktopLayout();closeCtxMenu()">↺ Reset Icon Layout</div>
      <div class="ctx-sep"></div>
      <div class="ctx-item" onclick="changeTheme(currentTheme==='white'?'black':'white');closeCtxMenu()">🎨 Toggle Theme</div>`;
    var x = Math.min(e.clientX, window.innerWidth - 220), y = Math.min(e.clientY, window.innerHeight - 320);
    menu.style.left = x + 'px'; menu.style.top = y + 'px';
    menu.classList.add('open');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCtxMenu(); });
}
function closeCtxMenu() { document.getElementById('deskCtx').classList.remove('open'); }

// ══════════════════════════════════════════════
//  DESKTOP WIDGETS
// ══════════════════════════════════════════════
var widgets = JSON.parse(localStorage.getItem('serverplex_widgets') || '[]');
function saveWidgets() { localStorage.setItem('serverplex_widgets', JSON.stringify(widgets)); }
function addWidget(type) {
  var w = { id: Date.now(), type, x: 100 + Math.random()*200, y: 80 + Math.random()*100, text:'' };
  widgets.push(w); saveWidgets(); renderWidget(w);
}
function removeWidget(id) {
  widgets = widgets.filter(w => w.id !== id); saveWidgets();
  var el = document.getElementById('widget-' + id); if (el) el.remove();
}
function renderWidget(w) {
  var container = document.getElementById('widgetContainer');
  var div = document.createElement('div');
  div.className = 'desktop-widget'; div.id = 'widget-' + w.id;
  div.style.left = w.x + 'px'; div.style.top = w.y + 'px'; div.style.position = 'absolute';

  if (w.type === 'clock') {
    div.innerHTML = `<div class="widget-clock"><div class="wc-time" id="wt-${w.id}">--:--</div><div class="wc-date" id="wd-${w.id}"></div></div><button class="widget-close" onclick="removeWidget(${w.id})">×</button>`;
    var tick = setInterval(() => {
      var now = new Date(), t = document.getElementById('wt-'+w.id), d = document.getElementById('wd-'+w.id);
      if (!t) { clearInterval(tick); return; }
      t.textContent = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
      d.textContent = now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    }, 1000);

  } else if (w.type === 'stats') {
    div.innerHTML = `<div class="widget-stats">
      <div style="font-size:10px;font-weight:800;letter-spacing:2px;opacity:.55;margin-bottom:8px;text-transform:uppercase">System</div>
      <div class="ws-row"><span class="ws-label">CPU</span><span class="ws-val" id="wcpu-${w.id}">--</span></div>
      <div class="ws-bar"><div class="ws-fill" id="wcpub-${w.id}" style="background:#0078d4;width:0%"></div></div>
      <div class="ws-row"><span class="ws-label">RAM</span><span class="ws-val" id="wram-${w.id}">--</span></div>
      <div class="ws-bar"><div class="ws-fill" id="wramb-${w.id}" style="background:#34c759;width:0%"></div></div>
      <div class="ws-row"><span class="ws-label">Disk</span><span class="ws-val" id="wdisk-${w.id}">--</span></div>
      <div class="ws-bar"><div class="ws-fill" id="wdiskb-${w.id}" style="background:#ff9500;width:0%"></div></div>
    </div><button class="widget-close" onclick="removeWidget(${w.id})">×</button>`;
    // Simulate animated stats
    var cpuVal = 20 + Math.random() * 30;
    var ramVal = 40 + Math.random() * 20;
    var diskVal = 55 + Math.random() * 15;
    var statsInt = setInterval(() => {
      cpuVal = Math.max(5, Math.min(95, cpuVal + (Math.random()-0.5)*15));
      ramVal = Math.max(20, Math.min(90, ramVal + (Math.random()-0.5)*5));
      diskVal = Math.max(40, Math.min(95, diskVal + (Math.random()-0.5)*2));
      var c = document.getElementById('wcpu-'+w.id);
      if (!c) { clearInterval(statsInt); return; }
      c.textContent = Math.round(cpuVal) + '%'; document.getElementById('wcpub-'+w.id).style.width = cpuVal + '%';
      document.getElementById('wram-'+w.id).textContent = Math.round(ramVal) + '%'; document.getElementById('wramb-'+w.id).style.width = ramVal + '%';
      document.getElementById('wdisk-'+w.id).textContent = Math.round(diskVal) + '%'; document.getElementById('wdiskb-'+w.id).style.width = diskVal + '%';
    }, 1200);

  } else if (w.type === 'weather') {
    div.innerHTML = `<div class="widget-weather">
      <div style="font-size:10px;font-weight:800;letter-spacing:2px;opacity:.55;margin-bottom:8px;text-transform:uppercase">Weather</div>
      <div id="wweath-${w.id}" style="font-size:12px;opacity:.7">Fetching location…</div>
      <input id="wcity-${w.id}" placeholder="Or type a city…" style="margin-top:8px;width:100%;padding:5px 8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:5px;color:#fff;font-family:Oxanium,sans-serif;font-size:11px;outline:none" onkeydown="if(event.key==='Enter')fetchWidgetWeather(${w.id},null)">
    </div><button class="widget-close" onclick="removeWidget(${w.id})">×</button>`;
    if (w.city) fetchWidgetWeather(w.id, w.city);
    else fetchWeatherByLocation(w.id);

  } else if (w.type === 'sticky') {
    div.innerHTML = `<div class="widget-sticky"><textarea placeholder="Widget note…" oninput="updateWidgetText(${w.id},this.value)">${w.text||''}</textarea></div><button class="widget-close" onclick="removeWidget(${w.id})">×</button>`;
  }

  makeDraggableWidget(div, w);
  container.appendChild(div);
}
function updateWidgetText(id, text) { var w = widgets.find(x => x.id === id); if (w) { w.text = text; saveWidgets(); } }
function makeDraggableWidget(el, w) {
  var dragging = false, sx, sy, ix, iy;
  el.addEventListener('mousedown', e => {
    if (e.target.tagName === 'TEXTAREA' || e.target.classList.contains('widget-close') || e.target.tagName === 'INPUT') return;
    dragging = true; sx = e.clientX; sy = e.clientY; ix = el.offsetLeft; iy = el.offsetTop; el.style.zIndex = 999;
  });
  document.addEventListener('mousemove', e => { if (!dragging) return; el.style.left = (ix + e.clientX - sx) + 'px'; el.style.top = (iy + e.clientY - sy) + 'px'; w.x = ix + e.clientX - sx; w.y = iy + e.clientY - sy; });
  document.addEventListener('mouseup', () => { if (dragging) { dragging = false; el.style.zIndex = ''; saveWidgets(); } });
}

// Weather using Open-Meteo (free, no API key)
function fetchWeatherByLocation(wid) {
  if (!navigator.geolocation) { fetchWidgetWeather(wid, null); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    var lat = pos.coords.latitude.toFixed(4), lon = pos.coords.longitude.toFixed(4);
    fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current_weather=true&temperature_unit=celsius')
      .then(r => r.json()).then(d => {
        var el = document.getElementById('wweath-'+wid); if (!el) return;
        var cw = d.current_weather;
        var codes = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',61:'🌧️',71:'❄️',80:'🌦️',95:'⛈️'};
        var icon = codes[Math.floor(cw.weathercode/10)*10] || codes[cw.weathercode] || '🌡️';
        el.innerHTML = '<div style="font-size:26px;margin-bottom:2px">'+icon+' '+Math.round(cw.temperature)+'°C</div><div style="font-size:10px;opacity:.6">Wind: '+cw.windspeed+' km/h</div>';
        var w = widgets.find(x => x.id === wid); if (w) { w.lat = lat; w.lon = lon; saveWidgets(); }
        var inp = document.getElementById('wcity-'+wid); if (inp) inp.style.display = 'none';
      }).catch(() => { fetchWidgetWeather(wid, null); });
  }, () => { fetchWidgetWeather(wid, null); });
}
function fetchWidgetWeather(id, city) {
  var cityEl = document.getElementById('wcity-'+id);
  var c = city || (cityEl && cityEl.value.trim());
  var el = document.getElementById('wweath-'+id);
  if (!c) return;
  var w = widgets.find(x => x.id === id); if (w) { w.city = c; saveWidgets(); }
  if (el) el.textContent = 'Loading…';
  // Use geocoding then Open-Meteo
  fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(c)+'&count=1')
    .then(r => r.json()).then(geo => {
      if (!geo.results || !geo.results.length) { if(el) el.textContent = '❌ City not found'; return; }
      var loc = geo.results[0];
      return fetch('https://api.open-meteo.com/v1/forecast?latitude='+loc.latitude+'&longitude='+loc.longitude+'&current_weather=true').then(r => r.json()).then(d => {
        if (!el) return;
        var cw = d.current_weather;
        var codes = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',51:'🌦️',61:'🌧️',71:'❄️',80:'🌦️',95:'⛈️'};
        var icon = codes[Math.floor(cw.weathercode/10)*10] || codes[cw.weathercode] || '🌡️';
        el.innerHTML = '<div style="font-size:24px;margin-bottom:2px">'+icon+' '+Math.round(cw.temperature)+'°C</div><div style="font-size:10px;opacity:.55">'+loc.name+', '+loc.country+'</div>';
        if (cityEl) cityEl.style.display = 'none';
      });
    }).catch(() => { if(el) el.textContent = '⚠️ Weather unavailable'; });
}
function initWidgets() { widgets.forEach(w => renderWidget(w)); }
