<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title> <link id="favicon" rel="icon" type="image/x-icon" href="https://www.google.com/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; overflow: hidden; background: #0d0d1a; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
            animation: fadeIn 0.8s ease-in forwards; 
        }
    </style>
</head>
<body>

    <iframe id="mainFrame" src="about:blank"></iframe>

    <script>
        const frame = document.getElementById('mainFrame');
        const isReturningUser = localStorage.getItem('serverplex_setup_complete') === 'true';

        // --- TAB CLOAKING LOGIC ---
        // This ensures even if the HTML file is named index.html, 
        // the browser tab looks like Google.
        document.title = "Google";
        const link = document.querySelector("link[rel*='icon']") || document.createElement('link');
        link.type = 'image/x-icon';
        link.rel = 'shortcut icon';
        link.href = 'https://www.google.com/favicon.ico';
        document.getElementsByTagName('head')[0].appendChild(link);

        // --- NAVIGATION LOGIC ---
        window.addEventListener('DOMContentLoaded', () => {
            frame.src = 'TechDepot.html';

            // Wait exactly 4 seconds (4000ms) before switching
            setTimeout(() => {
                if (isReturningUser) {
                    frame.src = 'account.html';
                } else {
                    frame.src = 'welcome.html';
                }
            }, 4000); 
        });

        window.addEventListener('message', e => {
            if (e.data && e.data.type === 'navigate') {
                frame.src = e.data.path;
            }
        });

        window.addEventListener('beforeunload', e => { 
            e.preventDefault(); 
            e.returnValue = ''; 
        });
    </script>
</body>
</html>
