<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>Site Temporarily Closed</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<style>
		:root {
			color-scheme: dark;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: radial-gradient(circle at top, #1f2937 0, #020617 55%, #000 100%);
			color: #e5e7eb;
		}

		.card {
			width: 100%;
			max-width: 640px;
			padding: 2.5rem 2rem;
			background: rgba(15, 23, 42, 0.9);
			border-radius: 18px;
			border: 1px solid rgba(148, 163, 184, 0.35);
			box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
			backdrop-filter: blur(18px);
			text-align: center;
		}

		h1 {
			font-size: 1.9rem;
			margin: 0 0 0.75rem;
			letter-spacing: 0.04em;
		}

		.badge {
			display: inline-flex;
			align-items: center;
			gap: 0.4rem;
			padding: 0.25rem 0.7rem;
			border-radius: 999px;
			font-size: 0.75rem;
			text-transform: uppercase;
			letter-spacing: 0.12em;
			background: rgba(56, 189, 248, 0.12);
			color: #7dd3fc;
			border: 1px solid rgba(56, 189, 248, 0.4);
			margin-bottom: 0.9rem;
		}

		p {
			margin: 0.25rem 0;
			color: #9ca3af;
			font-size: 0.95rem;
		}

		.date {
			margin-top: 0.75rem;
			font-weight: 600;
			color: #e5e7eb;
		}

		.countdown-wrapper {
			margin-top: 1.8rem;
		}

		.countdown-label {
			font-size: 0.8rem;
			text-transform: uppercase;
			letter-spacing: 0.16em;
			color: #9ca3af;
			margin-bottom: 0.7rem;
		}

		.countdown {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 0.75rem;
		}

		.time-box {
			min-width: 80px;
			padding: 0.7rem 0.6rem;
			border-radius: 12px;
			background: radial-gradient(circle at top, #0f172a 0, #020617 70%);
			border: 1px solid rgba(148, 163, 184, 0.35);
		}

		.time-value {
			font-size: 1.4rem;
			font-weight: 700;
			color: #f9fafb;
		}

		.time-label {
			font-size: 0.7rem;
			text-transform: uppercase;
			letter-spacing: 0.16em;
			color: #9ca3af;
			margin-top: 0.15rem;
		}

		.footer-note {
			margin-top: 1.8rem;
			font-size: 0.8rem;
			color: #6b7280;
		}

		@media (max-width: 480px) {
			.card {
				padding: 2rem 1.4rem;
			}

			h1 {
				font-size: 1.6rem;
			}

			.time-box {
				min-width: 70px;
			}

			.time-value {
				font-size: 1.2rem;
			}
		}
	</style>
</head>

<body>
	<div class="card">
		<div class="badge">
			● Status: Offline
		</div>
		<h1>Site Temporarily Shut Down</h1>
		<p>This site is currently offline for maintenance and upgrades.</p>
		<p class="date">Planned reopening: <strong>August 15, 2026</strong></p>

		<div class="countdown-wrapper">
			<div class="countdown-label">Time until we’re back</div>
			<div class="countdown" id="countdown">
				<div class="time-box">
					<div class="time-value" id="days">--</div>
					<div class="time-label">Days</div>
				</div>
				<div class="time-box">
					<div class="time-value" id="hours">--</div>
					<div class="time-label">Hours</div>
				</div>
				<div class="time-box">
					<div class="time-value" id="minutes">--</div>
					<div class="time-label">Minutes</div>
				</div>
				<div class="time-box">
					<div class="time-value" id="seconds">--</div>
					<div class="time-label">Seconds</div>
				</div>
			</div>
		</div>

		<div class="footer-note" id="footer-note">
			Thanks for your patience. Check back closer to the reopening date for updates.
		</div>
	</div>

	<script>
		// Set target date (midnight on August 15, 2026)
    const targetDate = new Date("2026-08-15T00:00:00");

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const footerNoteEl = document.getElementById("footer-note");

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        daysEl.textContent = "0";
        hoursEl.textContent = "0";
        minutesEl.textContent = "0";
        secondsEl.textContent = "0";
        footerNoteEl.textContent = "We’re scheduled to be back. If you still see this page, the relaunch is in progress.";
        clearInterval(timer);
        return;
      }

      const seconds = Math.floor(diff / 1000);
      const days = Math.floor(seconds / (60 * 60 * 24));
      const hours = Math.floor((seconds % (60 * 60 * 24)) / (60 * 60));
      const minutes = Math.floor((seconds % (60 * 60)) / 60);
      const secs = seconds % 60;

      daysEl.textContent = days;
      hoursEl.textContent = String(hours).padStart(2, "0");
      minutesEl.textContent = String(minutes).padStart(2, "0");
      secondsEl.textContent = String(secs).padStart(2, "0");
    }

    const timer = setInterval(updateCountdown, 1000);
    updateCountdown();
	</script>
</body>

</html>
