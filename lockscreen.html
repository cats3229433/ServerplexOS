<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServerplexOS — Locked</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Oxanium',sans-serif;background:#07090f;color:#fff;height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 70% 60% at 20% 30%,rgba(0,120,212,.1) 0%,transparent 65%),radial-gradient(ellipse 50% 50% at 80% 75%,rgba(118,75,162,.08) 0%,transparent 65%),#07090f}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,120,212,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,120,212,.03) 1px,transparent 1px);background-size:48px 48px}
#wakeScreen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;transition:opacity .6s}
#wakeScreen.hidden{opacity:0;pointer-events:none}
.wake-time{font-size:80px;font-weight:700;letter-spacing:4px;color:rgba(255,255,255,.92);text-shadow:0 0 60px rgba(0,120,212,.4);line-height:1}
.wake-date{font-size:16px;letter-spacing:3px;color:rgba(255,255,255,.4);text-transform:uppercase}
.wake-hint{margin-top:32px;font-size:13px;letter-spacing:2px;color:rgba(255,255,255,.22);text-transform:uppercase;animation:hintPulse 2.5s ease-in-out infinite}
@keyframes hintPulse{0%,100%{opacity:.22;transform:translateY(0)}50%{opacity:.55;transform:translateY(-4px)}}
#loginScreen{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;opacity:0;pointer-events:none;transform:translateY(24px);transition:opacity .5s,transform .5s cubic-bezier(.34,1.56,.64,1)}
#loginScreen.visible{opacity:1;pointer-events:all;transform:translateY(0)}
.avatar-wrap{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#0078d4,#764ba2);display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 0 0 4px rgba(0,120,212,.25),0 12px 40px rgba(0,0,0,.5);margin-bottom:18px;overflow:hidden}
.avatar-wrap img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.lock-username{font-size:22px;font-weight:700;letter-spacing:1px;margin-bottom:4px;color:rgba(255,255,255,.92)}
.lock-subtitle{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:32px}
.pin-display{display:flex;gap:16px;margin-bottom:12px;justify-content:center}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.25);transition:all .2s}
.pin-dot.filled{background:#0078d4;border-color:#0078d4;box-shadow:0 0 10px rgba(0,120,212,.7)}
.pin-dot.error{background:#ff4444;border-color:#ff4444;box-shadow:0 0 10px rgba(255,68,68,.7)}
.pw-wrap{position:relative;width:280px;margin-bottom:12px}
.pw-wrap input{width:100%;padding:13px 44px 13px 18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font-family:'Oxanium',sans-serif;font-size:16px;letter-spacing:2px;outline:none;transition:all .25s}
.pw-wrap input:focus{border-color:rgba(0,120,212,.6);background:rgba(0,120,212,.08);box-shadow:0 0 0 3px rgba(0,120,212,.15)}
.pw-wrap input::placeholder{letter-spacing:1px;color:rgba(255,255,255,.25)}
.pw-eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:18px;cursor:pointer;opacity:.4;transition:opacity .2s}
.pw-eye:hover{opacity:.8}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:280px;margin-bottom:20px}
.nk{padding:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;font-size:20px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;color:#fff;font-family:'Oxanium',sans-serif;user-select:none}
.nk:hover{background:rgba(255,255,255,.12);border-color:rgba(0,120,212,.4)}
.nk:active{transform:scale(.93);background:rgba(0,120,212,.2)}
.nk:empty{pointer-events:none}
.unlock-btn{width:280px;padding:14px;background:linear-gradient(135deg,#0078d4,#005fa3);border:none;border-radius:12px;color:#fff;font-family:'Oxanium',sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;cursor:pointer;margin-bottom:16px;transition:all .25s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 20px rgba(0,120,212,.3)}
.unlock-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,120,212,.5)}
.error-msg{font-size:13px;color:#ff6b6b;letter-spacing:.5px;min-height:18px;text-align:center;margin-bottom:8px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .4s ease}
</style>
</head>
<body>
<div class="bg"></div>
<div class="bg-grid"></div>
<div id="wakeScreen" onclick="wake()">
  <div class="wake-time" id="wakeTime">00:00</div>
  <div class="wake-date" id="wakeDate"></div>
  <div class="wake-hint">Click anywhere to unlock</div>
</div>
<div id="loginScreen">
  <div class="avatar-wrap" id="avatarWrap"></div>
  <div class="lock-username" id="lockUsername">User</div>
  <div class="lock-subtitle">ServerplexOS</div>
  <div id="pinMode">
    <div class="pin-display" id="pinDisplay"></div>
    <div class="error-msg" id="pinError"></div>
    <div class="numpad" id="numpad"></div>
  </div>
  <div id="pwMode" style="display:none">
    <div class="pw-wrap">
      <input type="password" id="pwInput" placeholder="Password" autocomplete="off">
      <span class="pw-eye" id="pwEye">👁</span>
    </div>
    <div class="error-msg" id="pwError"></div>
    <button class="unlock-btn" onclick="submitPassword()">Unlock →</button>
  </div>
</div>
<script>
var savedPin=localStorage.getItem('serverplex_pin')||'';
var savedPassword=localStorage.getItem('serverplex_password')||'';
var savedUsername=localStorage.getItem('serverplex_username')||'User';
var savedAvatar=localStorage.getItem('serverplex_avatar')||'👤';
var avatarImage=localStorage.getItem('serverplex_avatar_image')||'';
if(!savedPin&&!savedPassword){window.location.replace('desktop.html');}
document.getElementById('lockUsername').textContent=savedUsername;
var aw=document.getElementById('avatarWrap');
if(avatarImage){aw.innerHTML='<img src="'+avatarImage+'" alt="avatar">';}else{aw.textContent=savedAvatar;}
function updateClock(){
  var now=new Date(),fmt=localStorage.getItem('serverplex_clock_format')||'12';
  var h=now.getHours(),m=now.getMinutes().toString().padStart(2,'0');
  var ts=fmt==='24'?h.toString().padStart(2,'0')+':'+m:((h%12||12)+':'+m+' '+(h>=12?'PM':'AM'));
  document.getElementById('wakeTime').textContent=ts;
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('wakeDate').textContent=days[now.getDay()]+', '+months[now.getMonth()]+' '+now.getDate();
}
updateClock();setInterval(updateClock,1000);
function wake(){
  document.getElementById('wakeScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.add('visible');
  if(savedPassword&&!savedPin)document.getElementById('pwInput').focus();
}
if(savedPin){document.getElementById('pwMode').style.display='none';document.getElementById('pinMode').style.display='block';buildPinUI();}
else{document.getElementById('pinMode').style.display='none';document.getElementById('pwMode').style.display='block';}
var pinValue='';
function buildPinUI(){
  var display=document.getElementById('pinDisplay');
  display.innerHTML='';
  for(var i=0;i<4;i++){var d=document.createElement('div');d.className='pin-dot';d.id='pd'+i;display.appendChild(d);}
  var numpad=document.getElementById('numpad');
  [1,2,3,4,5,6,7,8,9,'',0,'⌫'].forEach(function(k){
    var key=document.createElement('div');
    key.className='nk';key.textContent=k===''?'':k;
    if(k!==''){key.addEventListener('click',function(){
      if(k==='⌫'){pinValue=pinValue.slice(0,-1);}else if(pinValue.length<4){pinValue+=k;}
      updateDots();document.getElementById('pinError').textContent='';
      if(pinValue.length===4)setTimeout(submitPin,200);
    });}
    numpad.appendChild(key);
  });
}
function updateDots(err){
  for(var i=0;i<4;i++){var dot=document.getElementById('pd'+i);if(!dot)return;dot.className='pin-dot'+(i<pinValue.length?(err?' error':' filled'):'');}
}
function submitPin(){
  if(pinValue===savedPin){unlock();}
  else{
    updateDots(true);document.getElementById('pinError').textContent='Incorrect PIN.';
    document.getElementById('numpad').classList.add('shake');
    setTimeout(function(){pinValue='';updateDots();document.getElementById('pinError').textContent='';document.getElementById('numpad').classList.remove('shake');},700);
  }
}
document.getElementById('pwEye').addEventListener('click',function(){var i=document.getElementById('pwInput');i.type=i.type==='password'?'text':'password';});
document.getElementById('pwInput').addEventListener('keydown',function(e){if(e.key==='Enter')submitPassword();});
function submitPassword(){
  var entered=document.getElementById('pwInput').value;
  if(entered===savedPassword){unlock();}
  else{
    var inp=document.getElementById('pwInput');
    inp.classList.add('shake');document.getElementById('pwError').textContent='Incorrect password.';inp.style.borderColor='rgba(255,80,80,.6)';
    setTimeout(function(){inp.classList.remove('shake');inp.style.borderColor='';document.getElementById('pwError').textContent='';inp.value='';},700);
  }
}
// BUG FIX: was arrow fn with two statements and no braces — syntax error
function unlock(){
  var screen=document.getElementById('loginScreen');
  screen.style.transition='opacity .4s ease';
  screen.style.opacity='0';
  setTimeout(function(){
    sessionStorage.setItem('serverplex_authed','true');
    window.location.href='desktop.html';
  },400);
}
document.addEventListener('keydown',function(e){
  if(!document.getElementById('loginScreen').classList.contains('visible')){wake();return;}
  if(savedPin){
    if(e.key>='0'&&e.key<='9'&&pinValue.length<4){pinValue+=e.key;updateDots();if(pinValue.length===4)setTimeout(submitPin,200);}
    else if(e.key==='Backspace'){pinValue=pinValue.slice(0,-1);updateDots();}
  }
});
</script>
</body>
</html>
