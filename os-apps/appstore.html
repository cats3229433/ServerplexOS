<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Serverplex App Store — Maintenance</title>
<style>
  body {
    margin: 0;
    background: #000;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", sans-serif;
    color: #e5e5e5;
    overflow: hidden;
  }

  .panel {
    width: 600px;
    padding: 40px;
    background: rgba(0,0,0,0.65);
    border: 1px solid rgba(255,200,100,0.25);
    border-radius: 18px;
    backdrop-filter: blur(18px);
    text-align: center;
    box-shadow: 0 0 40px rgba(255,200,100,0.25);
  }

  .title {
    font-size: 34px;
    font-weight: 600;
    color: #ffcc66;
    text-shadow: 0 0 12px rgba(255,200,100,0.6);
    margin-bottom: 12px;
  }

  .text {
    font-size: 18px;
    opacity: 0.85;
    line-height: 1.6;
  }

  .footer {
    margin-top: 30px;
    opacity: 0.45;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="panel">
  <div class="title">Serverplex App Store</div>
  <div class="text">
    The App Store is temporarily offline while updates are applied.<br>
    Services will return shortly.
  </div>
  <div class="footer">We appreciate your patience.</div>
</div>

</body>
</html>
