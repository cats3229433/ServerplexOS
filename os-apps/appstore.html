<!DOCTYPE html>
<html lang="en">
<head>
<script src="app-theme.js"></script>
<meta charset="UTF-8"><title>App Store</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Oxanium',sans-serif;background:var(--app-bg);color:var(--app-text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:rgba(14,20,32,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--app-border);padding:0 20px;height:54px;display:flex;align-items:center;gap:14px;flex-shrink:0;z-index:10;position:relative}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--app-accent),#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
.logo-text{font-size:16px;font-weight:800;letter-spacing:.5px}
.logo-sub{font-size:10px;color:var(--app-text2);letter-spacing:1px;text-transform:uppercase;margin-top:1px}
.spacer{flex:1}
.search-wrap{position:relative}
.search-input{width:260px;padding:8px 14px 8px 38px;background:rgba(128,128,128,0.05);border:1px solid var(--app-border);border-radius:10px;color:var(--app-text);font-family:'Oxanium',sans-serif;font-size:13px;outline:none;transition:all .2s}
.search-input:focus{border-color:var(--app-accent);background:rgba(59,130,246,0.05);box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
.search-input::placeholder{color:var(--app-text2)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--app-text2);pointer-events:none}
.topbar-btn{padding:7px 14px;border-radius:8px;cursor:pointer;font-family:'Oxanium',sans-serif;font-size:12px;font-weight:600;border:1px solid var(--app-border);background:rgba(128,128,128,0.04);color:var(--app-text2);transition:all .2s;letter-spacing:.3px}
.topbar-btn:hover{color:var(--app-text);background:var(--app-border);border-color:var(--app-border)}
.topbar-btn.active{background:rgba(59,130,246,0.15);border-color:rgba(59,130,246,0.4);color:var(--app-accent)}
.refresh-btn{padding:7px 10px;font-size:16px;color:var(--app-text2)}
.main{flex:1;display:flex;overflow:hidden}
.sidebar{width:210px;flex-shrink:0;background:var(--app-surface);border-right:1px solid var(--app-border);padding:16px 10px;overflow-y:auto}
.sidebar-label{font-size:9px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--app-text2);padding:0 10px 10px}
.cat-btn{width:100%;padding:9px 12px;border-radius:9px;background:none;border:none;color:var(--app-text2);font-family:'Oxanium',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;transition:all .15s;position:relative;margin-bottom:2px}
.cat-btn:hover{background:rgba(128,128,128,0.05);color:var(--app-text)}
.cat-btn.active{background:rgba(59,130,246,0.12);color:#93c5fd}
.cat-btn.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:0 2px 2px 0;background:var(--app-accent)}
.cat-emoji{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.cat-label{flex:1}
.cat-pill{font-size:10px;font-weight:700;background:var(--app-border);color:var(--app-text2);padding:1px 7px;border-radius:20px;transition:all .15s}
.cat-btn.active .cat-pill{background:rgba(59,130,246,0.2);color:var(--app-accent)}
.sidebar-divider{height:1px;background:var(--app-border);margin:10px 10px}
.content{flex:1;overflow-y:auto;padding:20px 22px}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:rgba(128,128,128,0.1);border-radius:3px}
/* Featured */
.featured-wrap{margin-bottom:28px;border-radius:18px;overflow:hidden;cursor:pointer;position:relative}
.featured-bg{position:absolute;inset:0;background:linear-gradient(135deg,#1e3a5f 0%,#1a1040 50%,#0f1a35 100%)}
.featured-glow{position:absolute;top:-40px;right:-40px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.3),transparent 70%)}
.featured-content{position:relative;padding:26px 28px;display:flex;align-items:center;gap:22px}
.feat-icon-wrap{position:relative;flex-shrink:0}
.feat-icon{width:80px;height:80px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:42px;background:rgba(128,128,128,.08);border:1px solid rgba(128,128,128,.12);box-shadow:0 8px 32px rgba(0,0,0,.3);backdrop-filter:blur(10px)}
.feat-badge{position:absolute;top:-8px;right:-8px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:white;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.feat-info{flex:1}
.feat-eye{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(147,197,253,.7);margin-bottom:6px}
.feat-name{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;color:white}
.feat-desc{font-size:13px;color:rgba(255,255,255,.55);line-height:1.65;margin-bottom:16px;max-width:460px}
.feat-row{display:flex;align-items:center;gap:10px}
.feat-author{font-size:12px;color:rgba(128,128,128,.35)}
.feat-sep{color:rgba(128,128,128,.15)}
.feat-ver{font-size:12px;color:rgba(128,128,128,.35)}
.btn-feat{padding:9px 22px;border-radius:10px;border:none;cursor:pointer;font-family:'Oxanium',sans-serif;font-size:13px;font-weight:700;letter-spacing:.5px;transition:all .2s;background:rgba(128,128,128,.15);color:white;backdrop-filter:blur(10px);border:1px solid rgba(128,128,128,.2)}
.btn-feat:hover{background:rgba(128,128,128,.25);transform:translateY(-1px)}
.btn-feat.done{background:rgba(34,197,94,.2);border-color:rgba(34,197,94,.4);color:#86efac}
.btn-feat.done:hover{background:rgba(239,68,68,.2);border-color:rgba(239,68,68,.4);color:#fca5a5}
.btn-feat-det{padding:9px 18px;border-radius:10px;border:1px solid rgba(128,128,128,.12);background:transparent;color:rgba(255,255,255,.5);font-family:'Oxanium',sans-serif;font-size:13px;cursor:pointer;transition:all .2s}
.btn-feat-det:hover{background:rgba(128,128,128,.06);color:white}
/* Grid */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-title{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--app-text2)}
.sec-count{font-size:12px;color:var(--app-text2)}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:28px}
.app-card{background:var(--app-surface);border:1px solid var(--app-border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.app-card:hover{border-color:var(--app-border);background:var(--app-surface2);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.35)}
.card-top{display:flex;gap:12px;align-items:flex-start}
.card-icon{width:52px;height:52px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px;border:1px solid var(--app-border);position:relative;overflow:hidden}
.card-icon-bg{position:absolute;inset:0;opacity:.15}
.card-meta{flex:1;min-width:0}
.card-name{font-size:14px;font-weight:700;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-author{font-size:11px;color:var(--app-text2);margin-bottom:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-tag{display:inline-flex;align-items:center;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:20px}
.tag-Games{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.2)}
.tag-Utilities{background:rgba(59,130,246,.12);color:#93c5fd;border:1px solid rgba(59,130,246,.2)}
.tag-Productivity{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.2)}
.tag-Media{background:rgba(245,158,11,.12);color:#fcd34d;border:1px solid rgba(245,158,11,.2)}
.tag-DeveloperTools{background:rgba(168,85,247,.12);color:var(--app-accent);border:1px solid rgba(168,85,247,.2)}
.tag-Other{background:rgba(128,128,128,.05);color:var(--app-text2);border:1px solid var(--app-border)}
    .tag-NewsWeather{background:rgba(14,165,233,.12);color:#7dd3fc;border:1px solid rgba(14,165,233,.2)}
.card-desc{font-size:12px;color:var(--app-text2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.card-ver{font-size:10px;color:var(--app-text2);letter-spacing:.5px}
.btn-install{padding:5px 14px;border-radius:7px;border:none;cursor:pointer;font-family:'Oxanium',sans-serif;font-size:11px;font-weight:700;letter-spacing:.5px;transition:all .2s}
.btn-install.get{background:rgba(59,130,246,.15);color:var(--app-accent);border:1px solid rgba(59,130,246,.25)}
.btn-install.get:hover{background:rgba(59,130,246,.3)}
.btn-install.done{background:rgba(34,197,94,.1);color:#86efac;border:1px solid rgba(34,197,94,.2)}
.btn-install.done:hover{background:rgba(239,68,68,.1);color:#fca5a5;border-color:rgba(239,68,68,.2)}
/* States */
.state-box{padding:60px;text-align:center;color:var(--app-text2);display:flex;flex-direction:column;align-items:center;gap:14px}
.state-icon{font-size:52px}
.state-msg{font-size:14px}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--app-surface);border:1px solid var(--app-border);border-radius:20px;width:100%;max-width:520px;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,.7);animation:slideUp .2s cubic-bezier(.34,1.56,.64,1)}
@keyframes slideUp{from{transform:translateY(20px) scale(.97);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.modal-hero{padding:24px 24px 20px;background:linear-gradient(180deg,var(--app-surface2),var(--app-surface));border-bottom:1px solid var(--app-border);display:flex;gap:18px;align-items:flex-start}
.modal-icon{width:72px;height:72px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:38px;background:rgba(128,128,128,.06);border:1px solid var(--app-border);flex-shrink:0;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.modal-title{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.modal-byline{font-size:12px;color:var(--app-text2);margin-bottom:10px}
.modal-tags{display:flex;gap:6px;flex-wrap:wrap}
.modal-body{flex:1;overflow-y:auto;padding:20px 24px}
.modal-body::-webkit-scrollbar{width:4px}
.modal-body::-webkit-scrollbar-thumb{background:rgba(128,128,128,.1);border-radius:2px}
.msec{margin-bottom:20px}
.msec-title{font-size:9px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--app-text2);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.msec-title::after{content:'';flex:1;height:1px;background:var(--app-border)}
.modal-desc{font-size:13px;color:rgba(232,237,245,.75);line-height:1.75}
.contact-list{display:flex;flex-direction:column;gap:5px}
.contact-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:rgba(128,128,128,.03);border:1px solid var(--app-border);border-radius:9px;text-decoration:none;color:var(--app-text);transition:all .15s;font-size:13px}
.contact-row:hover{background:rgba(128,128,128,.07);border-color:var(--app-border)}
.contact-emoji{font-size:15px;width:22px;text-align:center;flex-shrink:0}
.contact-key{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--app-text2);min-width:72px}
.contact-val{color:var(--app-accent);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.detail-cell{background:rgba(128,128,128,.03);border:1px solid var(--app-border);border-radius:8px;padding:10px 12px}
.detail-key{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--app-text2);margin-bottom:4px}
.detail-val{font-size:13px;font-weight:600}
.modal-footer{padding:14px 20px;border-top:1px solid var(--app-border);display:flex;gap:8px;background:rgba(14,20,32,.5);flex-shrink:0}
.modal-install{flex:1;padding:11px;border-radius:10px;border:none;font-family:'Oxanium',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.5px}
.modal-install.get{background:var(--app-accent);color:white;box-shadow:0 4px 16px rgba(59,130,246,.35)}
.modal-install.get:hover{background:var(--app-accent);transform:translateY(-1px)}
.modal-install.done{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.3)}
.modal-install.done:hover{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.3)}
.modal-close{padding:11px 18px;border-radius:10px;border:1px solid var(--app-border);background:rgba(128,128,128,.04);color:var(--app-text2);font-family:'Oxanium',sans-serif;font-size:14px;cursor:pointer}
.modal-close:hover{background:rgba(128,128,128,.08);color:var(--app-text)}
/* Status */
.statusbar{background:var(--app-surface);border-top:1px solid var(--app-border);padding:4px 18px;display:flex;gap:16px;font-size:10px;color:var(--app-text2);flex-shrink:0;letter-spacing:.5px}
/* Toast */

    .screenshots{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
    .screenshots::-webkit-scrollbar{height:4px}
    .screenshots::-webkit-scrollbar-thumb{background:rgba(128,128,128,.1);border-radius:2px}
    .screenshot{height:160px;min-width:240px;border-radius:10px;object-fit:cover;border:1px solid var(--app-border);cursor:pointer;transition:all .2s;flex-shrink:0}
    .screenshot:hover{border-color:var(--app-border);transform:scale(1.02)}
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(12px)}
    .lightbox.open{display:flex}
    .lightbox img{max-width:100%;max-height:90vh;border-radius:12px;box-shadow:0 24px 80px rgba(0,0,0,.8)}
    .lightbox-close{position:absolute;top:16px;right:20px;background:rgba(128,128,128,.1);border:none;color:white;font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .lightbox-close:hover{background:rgba(128,128,128,.2)}
    .toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--app-surface);border:1px solid rgba(128,128,128,.1);color:var(--app-text);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,.5);transition:all .3s cubic-bezier(.34,1.56,.64,1);opacity:0;z-index:9999;pointer-events:none;display:flex;align-items:center;gap:8px}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success .tdot{color:var(--app-green)}
.toast.error .tdot{color:var(--app-red)}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">🏪</div>
    <div><div class="logo-text">App Store</div><div class="logo-sub">ServerplexOS</div></div>
  </div>
  <div class="spacer"></div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" placeholder="Search apps, authors…" oninput="render()">
  </div>
  <button class="topbar-btn" id="installedBtn" onclick="toggleInstalled()">📦 Installed</button>
  <button class="topbar-btn refresh-btn" onclick="loadRegistry()" title="Refresh">↻</button>
</div>
<div class="main">
  <div class="sidebar">
    <div class="sidebar-label">Discover</div>
    <button class="cat-btn active" data-cat="all" onclick="setCat('all')"><span class="cat-emoji">✦</span><span class="cat-label">All Apps</span><span class="cat-pill" id="cnt-all">0</span></button>
    <div class="sidebar-divider"></div>
    <div class="sidebar-label">Categories</div>
    <button class="cat-btn" data-cat="Games" onclick="setCat('Games')"><span class="cat-emoji">🎮</span><span class="cat-label">Games</span><span class="cat-pill" id="cnt-Games">0</span></button>
    <button class="cat-btn" data-cat="Utilities" onclick="setCat('Utilities')"><span class="cat-emoji">🔧</span><span class="cat-label">Utilities</span><span class="cat-pill" id="cnt-Utilities">0</span></button>
    <button class="cat-btn" data-cat="Productivity" onclick="setCat('Productivity')"><span class="cat-emoji">📋</span><span class="cat-label">Productivity</span><span class="cat-pill" id="cnt-Productivity">0</span></button>
    <button class="cat-btn" data-cat="Media" onclick="setCat('Media')"><span class="cat-emoji">🎵</span><span class="cat-label">Media</span><span class="cat-pill" id="cnt-Media">0</span></button>
    <button class="cat-btn" data-cat="Developer Tools" onclick="setCat('Developer Tools')"><span class="cat-emoji">💻</span><span class="cat-label">Dev Tools</span><span class="cat-pill" id="cnt-Developer Tools">0</span></button>
    <button class="cat-btn" data-cat="Other" onclick="setCat('Other')"><span class="cat-emoji">📦</span><span class="cat-label">Other</span><span class="cat-pill" id="cnt-Other">0</span></button>
    <button class="cat-btn" data-cat="News & Weather" onclick="setCat('News & Weather')"><span class="cat-emoji">🌤️</span><span class="cat-label">News & Weather</span><span class="cat-pill" id="cnt-News & Weather">0</span></button>
  </div>
  <div class="content" id="content">
    <div class="state-box"><span class="state-icon spin">⟳</span><p class="state-msg">Loading apps…</p></div>
  </div>
</div>
<div class="statusbar">
  <span id="statusText">Connecting…</span>
  <span style="margin-left:auto" id="statusInstalled"></span>
</div>
<div class="overlay" id="overlay" onclick="closeOverlay(event)">
  <div class="modal">
    <div class="modal-hero">
      <div class="modal-icon" id="mIcon"></div>
      <div style="flex:1;min-width:0">
        <div class="modal-title" id="mTitle"></div>
        <div class="modal-byline" id="mByline"></div>
        <div class="modal-tags" id="mTags"></div>
      </div>
    </div>
    <div class="modal-body">
      <div class="msec"><div class="msec-title">Description</div><div class="modal-desc" id="mDesc"></div></div>
      <div class="msec" id="mScreenshotSec">
        <div class="msec-title">Screenshots</div>
        <div class="screenshots" id="mScreenshots"></div>
      </div>
      <div class="msec" id="mContactSec"><div class="msec-title">Contact & Links</div><div class="contact-list" id="mContact"></div></div>
      <div class="msec"><div class="msec-title">Details</div><div class="detail-grid" id="mDetails"></div></div>
    </div>
    <div class="modal-footer">
      <button class="modal-install get" id="mInstallBtn" onclick="toggleInstallModal()"></button>
      <button class="modal-close" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="document.getElementById('lightbox').classList.remove('open')">×</button>
  <img id="lightboxImg" src="" alt="">
</div>
<div class="toast" id="toast"><span class="tdot">●</span><span id="toastMsg"></span></div>
<script>
const REGISTRY_URL='https://cdn.jsdelivr.net/gh/YOUR_USERNAME/serverplexos-store@main/registry.json';
const CONTACT_META={email:{icon:'📧',label:'Email',href:v=>`mailto:${v}`},altEmail:{icon:'📧',label:'Alt Email',href:v=>`mailto:${v}`},phone:{icon:'📱',label:'Phone',href:v=>`tel:${v}`},website:{icon:'🌐',label:'Website',href:v=>v},github:{icon:'🐙',label:'GitHub',href:v=>`https://github.com/${v}`},discord:{icon:'💬',label:'Discord',href:v=>v.startsWith('http')?v:`https://discord.gg/${v}`},discordUser:{icon:'👤',label:'Discord',href:null},instagram:{icon:'📸',label:'Instagram',href:v=>`https://instagram.com/${v}`},snapchat:{icon:'👻',label:'Snapchat',href:null},twitter:{icon:'🐦',label:'Twitter/X',href:v=>`https://x.com/${v}`},youtube:{icon:'▶️',label:'YouTube',href:v=>v.startsWith('http')?v:`https://youtube.com/@${v}`},tiktok:{icon:'🎵',label:'TikTok',href:v=>`https://tiktok.com/@${v}`},twitch:{icon:'🟣',label:'Twitch',href:v=>`https://twitch.tv/${v}`},reddit:{icon:'🤖',label:'Reddit',href:v=>`https://reddit.com/u/${v}`},linkedin:{icon:'💼',label:'LinkedIn',href:v=>`https://linkedin.com/in/${v}`},telegram:{icon:'✈️',label:'Telegram',href:v=>`https://t.me/${v}`},patreon:{icon:'🎁',label:'Patreon',href:v=>`https://patreon.com/${v}`},kofi:{icon:'☕',label:'Ko-fi',href:v=>`https://ko-fi.com/${v}`},npm:{icon:'📦',label:'NPM',href:v=>`https://npmjs.com/~${v}`}};
const CAT_GRAD={Games:'linear-gradient(135deg,#7f1d1d,#991b1b)',Utilities:'linear-gradient(135deg,#1e3a5f,#1e40af)',Productivity:'linear-gradient(135deg,#14532d,#15803d)',Media:'linear-gradient(135deg,#78350f,#b45309)','Developer Tools':'linear-gradient(135deg,#3b0764,#7e22ce)',Other:'linear-gradient(135deg,#1f2937,#374151)'};
let apps=[],installed=JSON.parse(localStorage.getItem('serverplex_store_installed')||'{}');
let currentCat='all',showInstalled=false,activeApp=null;

async function loadRegistry(){
  document.getElementById('content').innerHTML='<div class="state-box"><span class="state-icon spin">⟳</span><p class="state-msg">Loading registry…</p></div>';
  try{const r=await fetch(REGISTRY_URL+'?t='+Date.now());if(!r.ok)throw 0;const d=await r.json();apps=d.apps||d||[];document.getElementById('statusText').textContent=`${apps.length} apps in store`;}
  catch(e){apps=getDemoApps();document.getElementById('statusText').textContent='Demo mode — set REGISTRY_URL to go live';}
  updateCounts();render();restoreApps();
}
function getDemoApps(){return[
  {id:'snake',name:'Snake',icon:'🐍',category:'Games',version:'1.0',author:'ServerplexOS Team',description:'Classic snake game. Eat food, grow longer, don\'t hit the walls or yourself! Score tracking and increasing difficulty.',url:'',featured:true,contact:{github:'YOUR_USERNAME',discord:'your-server'}},
  {id:'tetris',name:'Tetris',icon:'🟦',category:'Games',version:'1.2',author:'ServerplexOS Team',description:'The classic block-stacking puzzle game. Clear lines to score points and beat your high score.',url:'',contact:{github:'YOUR_USERNAME'}},
  {id:'weather',name:'Weather',icon:'🌤️',category:'Utilities',version:'2.0',author:'ServerplexOS Team',description:'Current weather and 7-day forecast for any city worldwide.',url:'',contact:{github:'YOUR_USERNAME',website:'https://example.com'}},
  {id:'pomodoro',name:'Pomodoro Timer',icon:'🍅',category:'Productivity',version:'1.0',author:'DevGroup',description:'Boost productivity with the Pomodoro technique. 25-minute sessions with break tracking.',url:'',contact:{email:'dev@example.com',discord:'abc123'}},
  {id:'colorpicker',name:'Color Picker',icon:'🎨',category:'Developer Tools',version:'1.1',author:'ToolsMaker',description:'Pick colors, convert HEX/RGB/HSL, build and export full palettes.',url:'',contact:{github:'toolsmaker',npm:'toolsmaker'}},
  {id:'converter',name:'Unit Converter',icon:'📐',category:'Utilities',version:'1.0',author:'ServerplexOS Team',description:'Convert length, weight, temperature, volume, speed and more.',url:'',contact:{github:'YOUR_USERNAME'}},
  {id:'flashcards',name:'Flashcards',icon:'🃏',category:'Productivity',version:'1.0',author:'StudyApps',description:'Create and study flashcard decks using spaced repetition.',url:'',contact:{email:'hello@studyapps.dev',github:'studyapps'}},
  {id:'spectrumviz',name:'Spectrum Viz',icon:'🌈',category:'Media',version:'0.9',author:'VisualLabs',description:'Real-time audio spectrum visualizer with animated visuals.',url:'',contact:{twitter:'visuallabs',youtube:'VisualLabsYT'}},
];}

function setCat(c){currentCat=c;showInstalled=false;document.getElementById('installedBtn').classList.remove('active');document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('active',b.dataset.cat===c));render();}
function toggleInstalled(){showInstalled=!showInstalled;document.getElementById('installedBtn').classList.toggle('active',showInstalled);document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));if(!showInstalled){document.querySelector('[data-cat="all"]').classList.add('active');currentCat='all';}render();}
function updateCounts(){['all','Games','Utilities','Productivity','Media','Developer Tools','Other','News & Weather'].forEach(c=>{const el=document.getElementById('cnt-'+c);if(el)el.textContent=c==='all'?apps.length:apps.filter(a=>a.category===c).length;});}

function render(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  let list=apps.filter(a=>{
    if(showInstalled)return!!installed[a.id];
    if(currentCat!=='all'&&a.category!==currentCat)return false;
    if(q&&!a.name.toLowerCase().includes(q)&&!a.description.toLowerCase().includes(q)&&!(a.author||'').toLowerCase().includes(q))return false;
    return true;
  });
  const c=document.getElementById('content');
  if(!list.length){c.innerHTML=`<div class="state-box"><span class="state-icon">${showInstalled?'📦':'🔍'}</span><p class="state-msg">${showInstalled?'No apps installed yet':'No apps match your search'}</p></div>`;return;}
  let html='';
  const feat=list.find(a=>a.featured);
  if(feat&&!q&&currentCat==='all'&&!showInstalled){
    const inst=!!installed[feat.id];
    html+=`<div class="featured-wrap" onclick="openModal('${feat.id}')"><div class="featured-bg"></div><div class="featured-glow"></div><div class="featured-content"><div class="feat-icon-wrap"><div class="feat-icon">${feat.icon}</div><div class="feat-badge">⭐ Featured</div></div><div class="feat-info"><div class="feat-eye">App of the Week</div><div class="feat-name">${feat.name}</div><div class="feat-desc">${feat.description}</div><div class="feat-row"><span class="feat-author">by ${feat.author||'Unknown'}</span><span class="feat-sep">·</span><span class="feat-ver">v${feat.version||'1.0'}</span><button class="btn-feat ${inst?'done':''}" onclick="toggleInstall('${feat.id}',event)">${inst?'✓ Installed':'+ Get'}</button><button class="btn-feat-det" onclick="event.stopPropagation();openModal('${feat.id}')">Details</button></div></div></div></div>`;
    list=list.filter(a=>a.id!==feat.id);
  }
  const label=showInstalled?'Installed':currentCat==='all'?'All Apps':currentCat;
  html+=`<div class="sec-head"><div class="sec-title">${label}</div><div class="sec-count">${list.length} app${list.length!==1?'s':''}</div></div><div class="app-grid">`;
  list.forEach(a=>{
    const inst=!!installed[a.id];
    const grad=CAT_GRAD[a.category]||CAT_GRAD.Other;
    const tagCls='tag-'+(a.category||'Other').replace(/[\s&]+/g,'');
    html+=`<div class="app-card" onclick="openModal('${a.id}')"><div class="card-top"><div class="card-icon"><div class="card-icon-bg" style="background:${grad}"></div>${a.icon}</div><div class="card-meta"><div class="card-name">${a.name}</div><div class="card-author">by ${a.author||'Unknown'}</div><span class="cat-tag ${tagCls}">${a.category}</span></div></div><div class="card-desc">${a.description}</div><div class="card-footer"><span class="card-ver">v${a.version||'1.0'}</span><button class="btn-install ${inst?'done':'get'}" onclick="toggleInstall('${a.id}',event)">${inst?'✓ Installed':'+ Get'}</button></div></div>`;
  });
  html+='</div>';
  c.innerHTML=html;updateInstCount();
}

function toggleInstall(id,e){
  e&&e.stopPropagation();
  const a=apps.find(x=>x.id===id);if(!a)return;
  if(installed[id]){if(!confirm(`Uninstall "${a.name}"?`))return;delete installed[id];unregister(a);toast(`"${a.name}" uninstalled`,'error');}
  else{if(!a.url){toast('App URL not available in demo mode','error');return;}installed[id]={id,name:a.name,icon:a.icon,url:a.url,installedAt:Date.now()};register(a);toast(`"${a.name}" installed!`,'success');}
  localStorage.setItem('serverplex_store_installed',JSON.stringify(installed));
  render();if(activeApp&&activeApp.id===id)refreshModalBtn();
}
function toggleInstallModal(){if(activeApp)toggleInstall(activeApp.id);}
function register(a){if(window.parent&&window.parent.apps){window.parent.apps[a.id]={name:a.name,icon:a.icon,file:a.url,category:a.category||'Other'};if(window.parent.renderDesktopIcons)window.parent.renderDesktopIcons();if(window.parent.renderStartMenuApps)window.parent.renderStartMenuApps();}}
function unregister(a){if(window.parent&&window.parent.apps){delete window.parent.apps[a.id];if(window.parent.renderDesktopIcons)window.parent.renderDesktopIcons();if(window.parent.renderStartMenuApps)window.parent.renderStartMenuApps();}}
function restoreApps(){Object.values(installed).forEach(i=>{const a=apps.find(x=>x.id===i.id);if(a&&a.url)register(a);});}
function updateInstCount(){const n=Object.keys(installed).length;document.getElementById('statusInstalled').textContent=n?`${n} installed`:'';}

function openModal(id){
  const a=apps.find(x=>x.id===id);if(!a)return;
  activeApp=a;
  document.getElementById('mIcon').textContent=a.icon;
  document.getElementById('mTitle').textContent=a.name;
  document.getElementById('mByline').textContent=`by ${a.author||'Unknown'} · v${a.version||'1.0'}`;
  const tagCls='tag-'+(a.category||'Other').replace(/[\s&]+/g,'');
  document.getElementById('mTags').innerHTML=`<span class="cat-tag ${tagCls}">${a.category}</span>`;
  document.getElementById('mDesc').textContent=a.description;
  const contact=a.contact||{};
  const ks=Object.keys(contact).filter(k=>contact[k]&&CONTACT_META[k]);
  const cs=document.getElementById('mContactSec');
  if(ks.length){cs.style.display='';document.getElementById('mContact').innerHTML=ks.map(k=>{const m=CONTACT_META[k];const v=contact[k];const href=m.href?m.href(v):null;return href?`<a class="contact-row" href="${href}" target="_blank"><span class="contact-emoji">${m.icon}</span><span class="contact-key">${m.label}</span><span class="contact-val">${v}</span></a>`:`<div class="contact-row"><span class="contact-emoji">${m.icon}</span><span class="contact-key">${m.label}</span><span class="contact-val">${v}</span></div>`;}).join('');}else cs.style.display='none';
  // Screenshots
  const screenshots = a.screenshots || [];
  const screenshotSec = document.getElementById('mScreenshotSec');
  if(screenshots.length){
    screenshotSec.style.display='';
    document.getElementById('mScreenshots').innerHTML = screenshots.map(s =>
      `<img class="screenshot" src="${s}" alt="Screenshot" onclick="openLightbox('${s}')">`
    ).join('');
  } else {
    screenshotSec.style.display='none';
  }
  document.getElementById('mDetails').innerHTML=`<div class="detail-cell"><div class="detail-key">Version</div><div class="detail-val">${a.version||'1.0'}</div></div><div class="detail-cell"><div class="detail-key">Category</div><div class="detail-val">${a.category}</div></div><div class="detail-cell"><div class="detail-key">Author</div><div class="detail-val">${a.author||'Unknown'}</div></div><div class="detail-cell"><div class="detail-key">Source</div><div class="detail-val" style="font-size:10px;word-break:break-all">${a.url||'Demo / Not set'}</div></div>`;
  refreshModalBtn();
  document.getElementById('overlay').classList.add('open');
}
function refreshModalBtn(){const inst=!!installed[activeApp?.id];const btn=document.getElementById('mInstallBtn');btn.textContent=inst?'🗑️ Uninstall':'+ Install';btn.className='modal-install '+(inst?'done':'get');}
function closeOverlay(e){if(e.target===document.getElementById('overlay'))closeModal();}
function closeModal(){document.getElementById('overlay').classList.remove('open');activeApp=null;}
function openLightbox(src){
  document.getElementById('lightboxImg').src=src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(e){
  if(e.target===document.getElementById('lightbox'))
    document.getElementById('lightbox').classList.remove('open');
}
function toast(msg,type='success'){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;t.className='toast '+(type==='success'?'success':'error');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

loadRegistry();
</script>
</body>
</html>
