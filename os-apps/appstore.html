<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page Disabled</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .box {
      text-align: center;
      padding: 2rem 2.5rem;
      background: #020617;
      border-radius: 0.75rem;
      border: 1px solid #1f2937;
      box-shadow: 0 18px 45px rgba(0,0,0,0.45);
      max-width: 420px;
    }
    .box h1 {
      font-size: 1.4rem;
      margin-bottom: 0.75rem;
    }
    .box p {
      margin: 0.25rem 0;
      font-size: 0.95rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Page Currently Disabled</h1>
    <p>The page you are trying to access is currently disabled to the public.</p>
    <p>Please check back later or contact the site owner if you believe this is an error.</p>
  </div>
</body>
</html>
