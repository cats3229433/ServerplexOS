<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>App Store</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b10;--surface:#0e1420;--surface2:#141c2e;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--text:#e8edf5;--muted:#6b7a99;--accent:#3b82f6;--accent2:#60a5fa;--green:#22c55e;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Oxanium',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* Topbar */
.topbar{background:rgba(14,20,32,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 20px;height:54px;display:flex;align-items:center;gap:14px;flex-shrink:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
.logo-text{font-size:16px;font-weight:800;letter-spacing:.5px}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:1px}
.spacer{flex:1}
.search-wrap{position:relative}
.search-input{width:260px;padding:8px 14px 8px 38px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Oxanium',sans-serif;font-size:13px;outline:none;transition:all .2s}
.search-input:focus{border-color:var(--accent);background:rgba(59,130,246,0.05);box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
.search-input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted);pointer-events:none}
.topbar-btn{padding:7px 14px;border-radius:8px;cursor:pointer;font-family:'Oxanium',sans-serif;font-size:12px;font-weight:600;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--muted);transition:all .2s;letter-spacing:.3px}
.topbar-btn:hover{color:var(--text);background:rgba(255,255,255,0.08);border-color:var(--border2)}
.topbar-btn.active{background:rgba(59,130,246,0.15);border-color:rgba(59,130,246,0.4);color:var(--accent2)}
.refresh-btn{padding:7px 10px;font-size:16px;color:var(--muted)}

/* Main */
.main{flex:1;display:flex;overflow:hidden}

/* Sidebar */
.sidebar{width:210px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:16px 10px;overflow-y:auto}
.sidebar-label{font-size:9px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--muted);padding:0 10px 10px}
.cat-btn{width:100%;padding:9px 12px;border-radius:9px;background:none;border:none;color:var(--muted);font-family:'Oxanium',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;transition:all .15s;position:relative;margin-bottom:2px}
.cat-btn:hover{background:rgba(255,255,255,0.05);color:var(--text)}
.cat-btn.active{background:rgba(59,130,246,0.12);color:#93c5fd}
.cat-btn.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:0 2px 2px 0;background:var(--accent)}
.cat-emoji{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.cat-label{flex:1}
.cat-pill{font-size:10px;font-weight:700;background:rgba(255,255,255,0.07);color:var(--muted);padding:1px 7px;border-radius:20px}
.cat-btn.active .cat-pill{background:rgba(59,130,246,0.2);color:var(--accent2)}
.sidebar-divider{height:1px;background:var(--border);margin:10px 10px}

/* Content */
.content{flex:1;overflow-y:auto;padding:20px 22px}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}

/* Featured */
.featured-wrap{margin-bottom:28px;border-radius:18px;overflow:hidden;cursor:pointer;position:relative}
.featured-bg{position:absolute;inset:0;background:linear-gradient(135deg,#1e3a5f 0%,#1a1040 50%,#0f1a35 100%)}
.featured-glow{position:absolute;top:-40px;right:-40px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.3),transparent 70%)}
.featured-content{position:relative;padding:26px 28px;display:flex;align-items:center;gap:22px}
.feat-icon-wrap{position:relative;flex-shrink:0}
.feat-icon{width:80px;height:80px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:42px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 32px rgba(0,0,0,.3);overflow:hidden}
.feat-icon img{width:100%;height:100%;object-fit:cover;border-radius:18px}
.feat-badge{position:absolute;top:-8px;right:-8px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:white;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.feat-info{flex:1}
.feat-eye{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(147,197,253,.7);margin-bottom:6px}
.feat-name{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;color:white}
.feat-desc{font-size:13px;color:rgba(255,255,255,.55);line-height:1.65;margin-bottom:16px;max-width:460px}
.feat-row{display:flex;align-items:center;gap:10px}
.feat-author{font-size:12px;color:rgba(255,255,255,.35)}
.feat-sep{color:rgba(255,255,255,.15)}
.feat-ver{font-size:12px;color:rgba(255,255,255,.35)}
.btn-feat{padding:9px 22px;border-radius:10px;border:none;cursor:pointer;font-family:'Oxanium',sans-serif;font-size:13px;font-weight:700;letter-spacing:.5px;transition:all .2s;background:rgba(255,255,255,.15);color:white;border:1px solid rgba(255,255,255,.2)}
.btn-feat:hover{background:rgba(255,255,255,.25);transform:translateY(-1px)}
.btn-feat.installed{background:rgba(34,197,94,.2);border-color:rgba(34,197,94,.4);color:#86efac}
.btn-feat.installed:hover{background:rgba(239,68,68,.2);border-color:rgba(239,68,68,.4);color:#fca5a5}

/* Section */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-title{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.sec-count{font-size:12px;color:var(--muted)}

/* Grid */
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:28px}
.app-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:all .2s;position:relative}
.app-card:hover{border-color:var(--border2);background:var(--surface2);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.35)}
.card-top{display:flex;gap:12px;align-items:flex-start}
.card-icon{width:52px;height:52px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px;border:1px solid var(--border);position:relative;overflow:hidden}
.card-icon img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.card-icon-bg{position:absolute;inset:0;opacity:.15}
.card-meta{flex:1;min-width:0}
.card-name{font-size:14px;font-weight:700;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-author{font-size:11px;color:var(--muted);margin-bottom:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-tag{display:inline-flex;align-items:center;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:20px}
.tag-Games{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.2)}
.tag-Utilities{background:rgba(59,130,246,.12);color:#93c5fd;border:1px solid rgba(59,130,246,.2)}
.tag-Productivity{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.2)}
.tag-Media{background:rgba(245,158,11,.12);color:#fcd34d;border:1px solid rgba(245,158,11,.2)}
.tag-DeveloperTools{background:rgba(168,85,247,.12);color:#d8b4fe;border:1px solid rgba(168,85,247,.2)}
.tag-Other{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border)}
.tag-NewsWeather{background:rgba(14,165,233,.12);color:#7dd3fc;border:1px solid rgba(14,165,233,.2)}
.card-desc{font-size:12px;color:var(--muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.card-ver{font-size:10px;color:var(--muted);letter-spacing:.5px}
.btn-install{padding:5px 14px;border-radius:7px;border:none;cursor:pointer;font-family:'Oxanium',sans-serif;font-size:11px;font-weight:700;letter-spacing:.5px;transition:all .2s}
.btn-install.get{background:rgba(59,130,246,.15);color:var(--accent2);border:1px solid rgba(59,130,246,.25)}
.btn-install.get:hover{background:rgba(59,130,246,.3)}
.btn-install.installed{background:rgba(34,197,94,.1);color:#86efac;border:1px solid rgba(34,197,94,.2)}
.btn-install.installed:hover{background:rgba(239,68,68,.1);color:#fca5a5;border-color:rgba(239,68,68,.2)}

/* State */
.state-box{padding:60px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px}
.state-icon{font-size:52px}
.state-msg{font-size:14px}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:20px;width:100%;max-width:520px;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,.7);animation:slideUp .2s cubic-bezier(.34,1.56,.64,1)}
@keyframes slideUp{from{transform:translateY(20px) scale(.97);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.modal-hero{padding:24px 24px 20px;background:linear-gradient(180deg,var(--surface2),var(--surface));border-bottom:1px solid var(--border);display:flex;gap:18px;align-items:flex-start}
.modal-icon{width:72px;height:72px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:38px;background:rgba(255,255,255,.06);border:1px solid var(--border2);flex-shrink:0;box-shadow:0 4px 20px rgba(0,0,0,.3);overflow:hidden}
.modal-icon img{width:100%;height:100%;object-fit:cover;border-radius:16px}
.modal-title{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.modal-byline{font-size:12px;color:var(--muted);margin-bottom:10px}
.modal-tags{display:flex;gap:6px;flex-wrap:wrap}
.modal-body{flex:1;overflow-y:auto;padding:20px 24px}
.modal-body::-webkit-scrollbar{width:4px}
.modal-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.msec{margin-bottom:20px}
.msec-title{font-size:9px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.msec-title::after{content:'';flex:1;height:1px;background:var(--border)}
.modal-desc{font-size:13px;color:rgba(232,237,245,.75);line-height:1.75}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.detail-cell{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:9px;padding:10px 12px}
.detail-key{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.detail-val{font-size:13px;font-weight:600}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;background:rgba(14,20,32,.5);flex-shrink:0}
.modal-install{flex:1;padding:11px;border-radius:10px;border:none;font-family:'Oxanium',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.5px}
.modal-install.get{background:var(--accent);color:white;box-shadow:0 4px 16px rgba(59,130,246,.35)}
.modal-install.get:hover{background:#2563eb;transform:translateY(-1px)}
.modal-install.installed{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.3)}
.modal-install.installed:hover{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.3)}
.modal-close{padding:11px 18px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);font-family:'Oxanium',sans-serif;font-size:14px;cursor:pointer}
.modal-close:hover{background:rgba(255,255,255,.08);color:var(--text)}

/* Statusbar */
.statusbar{background:var(--surface);border-top:1px solid var(--border);padding:4px 18px;display:flex;gap:16px;font-size:10px;color:var(--muted);flex-shrink:0;letter-spacing:.5px}

/* Toast */
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(70px);background:#1e293b;border:1px solid rgba(255,255,255,.1);color:var(--text);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,.5);transition:all .3s cubic-bezier(.34,1.56,.64,1);opacity:0;z-index:9999;pointer-events:none;display:flex;align-items:center;gap:8px}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success .tdot{color:var(--green)}
.toast.error .tdot{color:var(--red)}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">🏪</div>
    <div><div class="logo-text">App Store</div><div class="logo-sub">EclipseOS</div></div>
  </div>
  <div class="spacer"></div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" placeholder="Search apps…" oninput="render()">
  </div>
  <button class="topbar-btn active" id="installedBtn" onclick="toggleInstalled()">📦 Installed</button>
  <button class="topbar-btn refresh-btn" onclick="loadRegistry()" title="Refresh">↻</button>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-label">Discover</div>
    <button class="cat-btn active" data-cat="all" onclick="setCat('all')"><span class="cat-emoji">✦</span><span class="cat-label">All Apps</span><span class="cat-pill" id="cnt-all">0</span></button>
    <div class="sidebar-divider"></div>
    <div class="sidebar-label">Categories</div>
    <button class="cat-btn" data-cat="Games"          onclick="setCat('Games')">         <span class="cat-emoji">🎮</span><span class="cat-label">Games</span>        <span class="cat-pill" id="cnt-Games">0</span></button>
    <button class="cat-btn" data-cat="Utilities"      onclick="setCat('Utilities')">     <span class="cat-emoji">🔧</span><span class="cat-label">Utilities</span>    <span class="cat-pill" id="cnt-Utilities">0</span></button>
    <button class="cat-btn" data-cat="Productivity"   onclick="setCat('Productivity')">  <span class="cat-emoji">📋</span><span class="cat-label">Productivity</span> <span class="cat-pill" id="cnt-Productivity">0</span></button>
    <button class="cat-btn" data-cat="Media"          onclick="setCat('Media')">         <span class="cat-emoji">🎵</span><span class="cat-label">Media</span>        <span class="cat-pill" id="cnt-Media">0</span></button>
    <button class="cat-btn" data-cat="Developer Tools" onclick="setCat('Developer Tools')"><span class="cat-emoji">💻</span><span class="cat-label">Dev Tools</span>  <span class="cat-pill" id="cnt-Developer Tools">0</span></button>
    <button class="cat-btn" data-cat="News & Weather" onclick="setCat('News & Weather')"><span class="cat-emoji">🌤️</span><span class="cat-label">News & Weather</span><span class="cat-pill" id="cnt-News & Weather">0</span></button>
    <button class="cat-btn" data-cat="Other"          onclick="setCat('Other')">         <span class="cat-emoji">📦</span><span class="cat-label">Other</span>        <span class="cat-pill" id="cnt-Other">0</span></button>
  </div>

  <div class="content" id="content">
    <div class="state-box"><span class="state-icon spin">⟳</span><p class="state-msg">Loading apps…</p></div>
  </div>
</div>

<div class="statusbar">
  <span id="statusText">Connecting…</span>
  <span style="margin-left:auto" id="statusInstalled"></span>
</div>

<!-- Detail modal -->
<div class="overlay" id="overlay" onclick="closeOverlay(event)">
  <div class="modal">
    <div class="modal-hero">
      <div class="modal-icon" id="mIcon"></div>
      <div style="flex:1;min-width:0">
        <div class="modal-title" id="mTitle"></div>
        <div class="modal-byline" id="mByline"></div>
        <div class="modal-tags" id="mTags"></div>
      </div>
    </div>
    <div class="modal-body">
      <div class="msec"><div class="msec-title">Description</div><div class="modal-desc" id="mDesc"></div></div>
      <div class="msec"><div class="msec-title">Details</div><div class="detail-grid" id="mDetails"></div></div>
    </div>
    <div class="modal-footer">
      <button class="modal-install get" id="mInstallBtn" onclick="toggleInstallModal()"></button>
      <button class="modal-close" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="tdot">●</span><span id="toastMsg"></span></div>

<script>
// ─────────────────────────────────────────────────────────
//  CONFIG — replace with your GitHub details
//
//  Your registry.json format:
//  {
//    "apps": [
//      {
//        "id":          "mycalc",
//        "name":        "My Calculator",
//        "icon":        "🧮",
//        "cover":       "https://i.imgur.com/abc.png",   ← optional image icon
//        "category":    "Utilities",
//        "version":     "1.0",
//        "author":      "You",
//        "description": "A nice calculator.",
//        "url":         "https://cdn.jsdelivr.net/gh/YOU/REPO@main/apps/calc.html",
//        "featured":    false
//      }
//    ]
//  }
// ─────────────────────────────────────────────────────────
const REGISTRY_URL = 'https://cdn.jsdelivr.net/gh/YOUR_USERNAME/YOUR_REPO@main/registry.json';

// Storage key — matches what eclipseos.html reads on boot
const STORE_KEY = 'eclipseos_store_installed';

const CAT_GRAD = {
  Games:'linear-gradient(135deg,#7f1d1d,#991b1b)',
  Utilities:'linear-gradient(135deg,#1e3a5f,#1e40af)',
  Productivity:'linear-gradient(135deg,#14532d,#15803d)',
  Media:'linear-gradient(135deg,#78350f,#b45309)',
  'Developer Tools':'linear-gradient(135deg,#3b0764,#7e22ce)',
  Other:'linear-gradient(135deg,#1f2937,#374151)'
};

let apps = [];
// installed = { id: { id, name, icon, url, category, version } }
let installed = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
let currentCat = 'all';
let showInstalled = false;
let activeApp = null;

function saveInstalled() {
  localStorage.setItem(STORE_KEY, JSON.stringify(installed));
  // Tell the parent OS to refresh its app list immediately if open in iframe
  if (window.parent && window.parent !== window) {
    try {
      // Inject/remove from parent apps object live
      Object.values(installed).forEach(a => {
        if (window.parent.apps) {
          window.parent.apps[a.id] = { name: a.name, icon: a.icon, file: a.url, category: a.category || 'Other' };
        }
      });
      if (window.parent.renderDesktopIcons)  window.parent.renderDesktopIcons();
      if (window.parent.renderStartMenuApps) window.parent.renderStartMenuApps();
    } catch(e) {}
  }
}

function isInstalled(id) { return !!installed[id]; }

// Load registry
async function loadRegistry() {
  document.getElementById('content').innerHTML = '<div class="state-box"><span class="state-icon spin">⟳</span><p class="state-msg">Loading registry…</p></div>';
  try {
    const r = await fetch(REGISTRY_URL + '?t=' + Date.now());
    if (!r.ok) throw 0;
    const d = await r.json();
    apps = d.apps || d || [];
    document.getElementById('statusText').textContent = apps.length + ' apps in store';
  } catch(e) {
    apps = getDemoApps();
    document.getElementById('statusText').textContent = 'Demo mode — set REGISTRY_URL to go live';
  }
  updateCounts(); render(); updateInstCount();
}

function getDemoApps() {
  return [
    { id:'weather',    name:'Weather',        icon:'🌤️', category:'Utilities',      version:'2.0', author:'EclipseOS Team', description:'Current weather and 7-day forecast for any city.',         url:'', featured:true  },
    { id:'pomodoro',   name:'Pomodoro Timer', icon:'🍅', category:'Productivity',   version:'1.0', author:'DevGroup',       description:'Boost productivity with 25-minute focus sessions.',        url:'', featured:false },
    { id:'colorpick',  name:'Color Picker',   icon:'🎨', category:'Developer Tools',version:'1.1', author:'ToolsMaker',     description:'Pick colors, convert HEX/RGB/HSL, export palettes.',     url:'', featured:false },
    { id:'converter',  name:'Unit Converter', icon:'📐', category:'Utilities',      version:'1.0', author:'EclipseOS Team', description:'Convert length, weight, temperature, volume and more.',   url:'', featured:false },
    { id:'flashcards', name:'Flashcards',     icon:'🃏', category:'Productivity',   version:'1.0', author:'StudyApps',      description:'Create and study flashcard decks with spaced repetition.',url:'', featured:false },
  ];
}

// Category
function setCat(cat) {
  currentCat = cat; showInstalled = false;
  document.getElementById('installedBtn').classList.remove('active');
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  render();
}
function toggleInstalled() {
  showInstalled = !showInstalled;
  document.getElementById('installedBtn').classList.toggle('active', showInstalled);
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  if (!showInstalled) { document.querySelector('[data-cat="all"]').classList.add('active'); currentCat = 'all'; }
  render();
}

// Counts
function updateCounts() {
  ['all','Games','Utilities','Productivity','Media','Developer Tools','Other','News & Weather'].forEach(c => {
    const el = document.getElementById('cnt-' + c);
    if (el) el.textContent = c === 'all' ? apps.length : apps.filter(a => a.category === c).length;
  });
}
function updateInstCount() {
  const n = Object.keys(installed).length;
  document.getElementById('statusInstalled').textContent = n ? n + ' installed' : '';
}

// Render
function render() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let list = apps.filter(a => {
    if (showInstalled) return isInstalled(a.id);
    if (currentCat !== 'all' && a.category !== currentCat) return false;
    if (q && !a.name.toLowerCase().includes(q) && !(a.description||'').toLowerCase().includes(q) && !(a.author||'').toLowerCase().includes(q)) return false;
    return true;
  });

  const c = document.getElementById('content');
  if (!list.length) {
    c.innerHTML = `<div class="state-box"><span class="state-icon">${showInstalled?'📦':'🔍'}</span><p class="state-msg">${showInstalled?'No apps installed yet':'No apps found'}</p></div>`;
    return;
  }

  let html = '';

  // Featured banner
  const feat = list.find(a => a.featured);
  if (feat && !q && currentCat === 'all' && !showInstalled) {
    const inst = isInstalled(feat.id);
    const iconHtml = feat.cover
      ? `<img src="${feat.cover}" style="width:100%;height:100%;object-fit:cover;border-radius:18px" onerror="this.outerHTML='${feat.icon||'📦'}'">` 
      : (feat.icon || '📦');
    html += `<div class="featured-wrap" onclick="openModal('${feat.id}')">
      <div class="featured-bg"></div><div class="featured-glow"></div>
      <div class="featured-content">
        <div class="feat-icon-wrap">
          <div class="feat-icon">${iconHtml}</div>
          <div class="feat-badge">⭐ Featured</div>
        </div>
        <div class="feat-info">
          <div class="feat-eye">App of the Week</div>
          <div class="feat-name">${feat.name}</div>
          <div class="feat-desc">${feat.description||''}</div>
          <div class="feat-row">
            <span class="feat-author">by ${feat.author||'Unknown'}</span>
            <span class="feat-sep">·</span>
            <span class="feat-ver">v${feat.version||'1.0'}</span>
            <button class="btn-feat ${inst?'installed':''}" onclick="event.stopPropagation();toggleInstall('${feat.id}')">${inst?'✓ Installed':'+ Install'}</button>
          </div>
        </div>
      </div>
    </div>`;
    list = list.filter(a => a.id !== feat.id);
  }

  const label = showInstalled ? 'Installed Apps' : currentCat === 'all' ? 'All Apps' : currentCat;
  html += `<div class="sec-head"><div class="sec-title">${label}</div><div class="sec-count">${list.length} app${list.length!==1?'s':''}</div></div>`;
  html += `<div class="app-grid">`;
  list.forEach(a => {
    const inst = isInstalled(a.id);
    const grad = CAT_GRAD[a.category] || CAT_GRAD.Other;
    const tagCls = 'tag-' + (a.category||'Other').replace(/[\s&]+/g,'');
    const iconHtml = a.cover
      ? `<img src="${a.cover}" style="width:100%;height:100%;object-fit:cover;border-radius:12px" onerror="this.outerHTML='${a.icon||'📦'}'">` 
      : (a.icon || '📦');
    html += `<div class="app-card" onclick="openModal('${a.id}')">
      <div class="card-top">
        <div class="card-icon"><div class="card-icon-bg" style="background:${grad}"></div>${iconHtml}</div>
        <div class="card-meta">
          <div class="card-name">${a.name}</div>
          <div class="card-author">by ${a.author||'Unknown'}</div>
          <span class="cat-tag ${tagCls}">${a.category||'Other'}</span>
        </div>
      </div>
      <div class="card-desc">${a.description||''}</div>
      <div class="card-footer">
        <span class="card-ver">v${a.version||'1.0'}</span>
        <button class="btn-install ${inst?'installed':'get'}" onclick="event.stopPropagation();toggleInstall('${a.id}')">${inst?'✓ Installed':'+ Install'}</button>
      </div>
    </div>`;
  });
  html += '</div>';
  c.innerHTML = html;
}

// Install / Uninstall
function toggleInstall(id) {
  const a = apps.find(x => x.id === id); if (!a) return;
  if (isInstalled(id)) {
    if (!confirm(`Uninstall "${a.name}"?`)) return;
    delete installed[id];
    // Remove from parent OS live
    if (window.parent && window.parent !== window) {
      try {
        delete window.parent.apps[id];
        if (window.parent.renderDesktopIcons)  window.parent.renderDesktopIcons();
        if (window.parent.renderStartMenuApps) window.parent.renderStartMenuApps();
      } catch(e) {}
    }
    toast(`"${a.name}" uninstalled`, 'error');
  } else {
    if (!a.url) { toast('No URL set for this app — demo mode only', 'error'); return; }
    installed[id] = {
      id:       a.id,
      name:     a.name,
      icon:     a.icon || '📦',
      url:      a.url,
      category: a.category || 'Other',
      version:  a.version  || '1.0',
    };
    // Add to parent OS live
    if (window.parent && window.parent !== window) {
      try {
        window.parent.apps[id] = { name: a.name, icon: a.icon || '📦', file: a.url, category: a.category || 'Other' };
        if (window.parent.renderDesktopIcons)  window.parent.renderDesktopIcons();
        if (window.parent.renderStartMenuApps) window.parent.renderStartMenuApps();
      } catch(e) {}
    }
    toast(`"${a.name}" installed!`, 'success');
  }
  saveInstalled(); updateInstCount(); render();
  if (activeApp?.id === id) refreshModalBtn();
}
function toggleInstallModal() { if (activeApp) toggleInstall(activeApp.id); }

// Modal
function openModal(id) {
  const a = apps.find(x => x.id === id); if (!a) return;
  activeApp = a;
  const iconHtml = a.cover
    ? `<img src="${a.cover}" style="width:100%;height:100%;object-fit:cover;border-radius:16px" onerror="this.outerHTML='${a.icon||'📦'}'">`
    : (a.icon || '📦');
  document.getElementById('mIcon').innerHTML = iconHtml;
  document.getElementById('mTitle').textContent  = a.name;
  document.getElementById('mByline').textContent = `by ${a.author||'Unknown'} · v${a.version||'1.0'}`;
  const tagCls = 'tag-' + (a.category||'Other').replace(/[\s&]+/g,'');
  document.getElementById('mTags').innerHTML = `<span class="cat-tag ${tagCls}">${a.category||'Other'}</span>`;
  document.getElementById('mDesc').textContent = a.description || 'No description.';
  document.getElementById('mDetails').innerHTML = `
    <div class="detail-cell"><div class="detail-key">Version</div><div class="detail-val">${a.version||'1.0'}</div></div>
    <div class="detail-cell"><div class="detail-key">Category</div><div class="detail-val">${a.category||'Other'}</div></div>
    <div class="detail-cell"><div class="detail-key">Author</div><div class="detail-val">${a.author||'Unknown'}</div></div>
    <div class="detail-cell"><div class="detail-key">Status</div><div class="detail-val">${isInstalled(a.id)?'✅ Installed':'Not installed'}</div></div>`;
  refreshModalBtn();
  document.getElementById('overlay').classList.add('open');
}
function refreshModalBtn() {
  const inst = isInstalled(activeApp?.id);
  const btn = document.getElementById('mInstallBtn');
  btn.textContent = inst ? '🗑️ Uninstall' : '+ Install';
  btn.className = 'modal-install ' + (inst ? 'installed' : 'get');
}
function closeOverlay(e) { if (e.target.id === 'overlay') closeModal(); }
function closeModal()     { document.getElementById('overlay').classList.remove('open'); activeApp = null; }

// Toast
let toastT;
function toast(msg, type='success') {
  clearTimeout(toastT);
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.className = 'toast ' + type;
  t.classList.add('show');
  toastT = setTimeout(() => t.classList.remove('show'), 2500);
}

loadRegistry();
</script>
</body>
</html>
