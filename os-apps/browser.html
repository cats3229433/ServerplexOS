<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
  <title>Browser — ServerplexOS</title>
  <style>
    :root { --accent: #0078d4; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: 'Oxanium', sans-serif; }
    body { display: flex; flex-direction: column; }

    body.spx-dark  { --hbg:#0d0f14;--htext:#e8edf5;--hborder:#2a2a3a;--hbg2:#12151f;--hbg3:#1a1e2e;--ntp:linear-gradient(135deg,#0d0f14,#12151f); }
    body.spx-light { --hbg:#fff;   --htext:#333;   --hborder:#ddd;   --hbg2:#f0f0f0;--hbg3:#e0e0e0;--ntp:linear-gradient(135deg,#1a1a2e,#16213e); }
    body.spx-grey  { --hbg:#3a3e4a;--htext:#eef0f4;--hborder:#555;  --hbg2:#484c57;--hbg3:#4e535e;--ntp:linear-gradient(135deg,#1a1a2e,#16213e); }

    /* ── Tab bar ── */
    .tab-bar { height:36px;background:var(--hbg);border-bottom:1px solid var(--hborder);display:flex;align-items:flex-end;padding:0 4px;gap:2px;overflow-x:auto;flex-shrink:0;position:relative; }
    .tab-bar::-webkit-scrollbar { display:none; }
    .tab { display:flex;align-items:center;gap:5px;padding:5px 10px;background:var(--hbg2);border:1px solid var(--hborder);border-bottom:none;border-radius:7px 7px 0 0;cursor:pointer;min-width:110px;max-width:190px;color:var(--htext);font-size:11px;font-weight:500;transition:background .12s;flex-shrink:0;user-select:none;position:relative; }
    .tab:hover { background:var(--hbg3); }
    .tab.active { background:var(--hbg);border-bottom:2px solid var(--accent);color:var(--accent);font-weight:700; }
    .tab.pinned { min-width:36px;max-width:36px;padding:5px 8px;justify-content:center; }
    .tab.pinned .tab-title,.tab.pinned .tab-close { display:none; }
    .tab.pinned .tab-favicon { display:flex!important; }
    .tab-favicon { font-size:13px;flex-shrink:0;display:none; }
    .tab.pinned .tab-favicon { display:flex; }
    .tab-title { flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .tab-close { width:15px;height:15px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:11px;opacity:0;flex-shrink:0;transition:all .12s; }
    .tab:hover .tab-close { opacity:.6; }
    .tab-close:hover { background:rgba(220,53,69,.2);color:#f85149;opacity:1!important; }
    .new-tab-btn { padding:3px 10px;background:transparent;border:none;color:var(--htext);font-size:17px;cursor:pointer;border-radius:6px;opacity:.5;transition:all .15s;align-self:center;flex-shrink:0;margin-bottom:1px; }
    .new-tab-btn:hover { background:var(--hbg2);opacity:1; }
    /* collapse toggle */
    .collapse-btn { position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;background:var(--accent);border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.3); }
    .collapse-btn svg { width:14px;height:14px;fill:white;transition:transform .25s; }
    .collapsed .collapse-btn svg { transform:rotate(180deg); }

    /* ── Toolbar ── */
    .toolbar { height:38px;background:var(--hbg);border-bottom:1px solid var(--hborder);display:flex;align-items:center;gap:5px;padding:0 8px;flex-shrink:0; }
    .tb-btn { width:28px;height:28px;border:none;background:transparent;color:var(--htext);font-size:13px;cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:background .12s;flex-shrink:0;opacity:.65; }
    .tb-btn:hover { background:var(--hbg2);opacity:1; }
    .tb-btn.disabled { opacity:.25;cursor:not-allowed; }
    .tb-btn.disabled:hover { background:transparent; }
    .tb-btn svg { width:14px;height:14px;fill:currentColor; }
    .url-wrap { flex:1;position:relative; }
    .url-bar { width:100%;display:flex;align-items:center;gap:6px;background:var(--hbg2);border:1.5px solid var(--hborder);border-radius:18px;padding:5px 12px;transition:all .2s;cursor:text; }
    .url-bar:focus-within { border-color:var(--accent);background:var(--hbg);box-shadow:0 0 0 3px rgba(0,120,212,.1); }
    .sec-icon { font-size:11px;flex-shrink:0; }
    .url-input { flex:1;border:none;background:transparent;font-family:'Oxanium',sans-serif;font-size:12px;color:var(--htext);outline:none; }
    .url-input::placeholder { color:var(--htext);opacity:.35; }
    .suggestions { position:absolute;top:100%;left:0;right:0;background:var(--hbg);border:1px solid var(--hborder);border-top:none;border-radius:0 0 10px 10px;z-index:9999;display:none;max-height:240px;overflow-y:auto;box-shadow:0 8px 20px rgba(0,0,0,.2);margin-top:2px;border-radius:10px; }
    .suggestions.open { display:block; }
    .sug-item { padding:7px 12px;cursor:pointer;font-size:11px;color:var(--htext);display:flex;align-items:center;gap:10px;transition:background .1s; }
    .sug-item:hover,.sug-item.hi { background:var(--hbg2); }
    .sug-icon { font-size:12px;width:16px;text-align:center;opacity:.55; }
    .sug-text { flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .sug-type { font-size:9px;opacity:.35; }

    /* ── Bookmarks bar ── */
    .bookmarks-bar { background:var(--hbg);padding:2px 6px;display:flex;gap:3px;align-items:center;overflow-x:auto;flex-shrink:0;border-bottom:1px solid var(--hborder); }
    .bookmarks-bar::-webkit-scrollbar { display:none; }
    .bookmarks-bar.hidden { display:none; }
    .bm-item { padding:2px 8px;background:var(--hbg2);border:1px solid var(--hborder);border-radius:5px;font-size:10px;font-weight:600;color:var(--htext);cursor:pointer;white-space:nowrap;transition:background .12s;display:flex;align-items:center;gap:4px;position:relative; }
    .bm-item:hover { background:var(--hbg3); }
    .bm-del { display:none;position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;background:#f85149;color:#fff;font-size:8px;align-items:center;justify-content:center;cursor:pointer; }
    .bm-item:hover .bm-del { display:flex; }
    .bm-add { padding:2px 8px;background:transparent;border:none;color:var(--htext);opacity:.4;cursor:pointer;font-size:13px;flex-shrink:0; }
    .bm-add:hover { opacity:.8; }

    /* ── Find bar ── */
    .find-bar { background:var(--hbg);border-bottom:1px solid var(--hborder);padding:5px 8px;display:none;align-items:center;gap:6px;flex-shrink:0; }
    .find-bar.open { display:flex; }
    .find-input { flex:1;padding:4px 10px;border:1px solid var(--hborder);border-radius:6px;background:var(--hbg2);color:var(--htext);font-family:'Oxanium',sans-serif;font-size:11px;outline:none; }
    .find-input:focus { border-color:var(--accent); }
    .find-count { font-size:10px;color:var(--htext);opacity:.4;min-width:40px; }
    .find-btn { padding:3px 8px;background:var(--hbg2);border:1px solid var(--hborder);border-radius:5px;color:var(--htext);cursor:pointer;font-size:11px;font-family:'Oxanium',sans-serif; }
    .find-btn:hover { background:var(--hbg3); }

    /* ── Loading bar ── */
    .loading-bar { height:2px;background:transparent;flex-shrink:0;position:relative;overflow:hidden; }
    .loading-bar.active::after { content:'';position:absolute;left:-50%;width:50%;height:100%;background:var(--accent);animation:load 1.2s ease-in-out infinite; }
    @keyframes load { 0%{left:-50%}100%{left:110%} }

    /* ── Header wrapper (for collapse) ── */
    .header { display:flex;flex-direction:column;flex-shrink:0; }
    .header.collapsed .toolbar,
    .header.collapsed .bookmarks-bar,
    .header.collapsed .find-bar { display:none!important; }
    .header.collapsed .tab-bar { border-bottom:none; }

    /* ── Frames ── */
    .frames { flex:1;position:relative;overflow:hidden; }
    .browser-frame { position:absolute;inset:0;width:100%;height:100%;border:none;display:none; }
    .browser-frame.active { display:block; }

    /* ── Dropdown ── */
    .dropdown { position:fixed;background:var(--hbg);border:1px solid var(--hborder);border-radius:10px;z-index:99999;display:none;box-shadow:0 10px 28px rgba(0,0,0,.25);min-width:200px; }
    .dropdown.open { display:block;animation:ddIn .1s ease; }
    @keyframes ddIn { from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)} }
    .dd-item { padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--htext);border-radius:6px;margin:2px;transition:background .1s; }
    .dd-item:hover { background:var(--hbg2); }
    .dd-item.danger { color:#f85149; }
    .dd-sep { height:1px;background:var(--hborder);margin:3px 8px; }
    .dd-label { padding:5px 14px 2px;font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--htext);opacity:.4; }

    /* ── Toast ── */
    .toast { position:fixed;bottom:12px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--hbg);border:1px solid var(--hborder);border-radius:10px;padding:8px 16px;font-size:11px;color:var(--htext);display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:99999;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.34,1.56,.64,1); }
    .toast.show { opacity:1;transform:translateX(-50%) translateY(0); }

    /* ── Zoom badge ── */
    .zoom-badge { position:fixed;bottom:12px;right:12px;background:var(--hbg);border:1px solid var(--hborder);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--htext);opacity:0;transition:opacity .3s;pointer-events:none;z-index:99998; }
    .zoom-badge.show { opacity:1; }

    /* ── Settings page ── */
    .settings-page { position:absolute;inset:0;background:var(--hbg);color:var(--htext);overflow-y:auto; }
    .settings-inner { max-width:580px;margin:0 auto;padding:24px 20px; }
    .s-title { font-size:18px;font-weight:800;margin-bottom:20px; }
    .s-sec { font-size:9px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--htext);opacity:.4;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--hborder); }
    .s-card { background:var(--hbg2);border:1px solid var(--hborder);border-radius:10px;overflow:hidden;margin-bottom:16px; }
    .s-row { display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--hborder);gap:12px; }
    .s-row:last-child { border-bottom:none; }
    .s-row-info { flex:1; }
    .s-row-label { font-size:12px;font-weight:600;color:var(--htext);margin-bottom:1px; }
    .s-row-desc { font-size:10px;color:var(--htext);opacity:.45;line-height:1.4; }
    .s-input { padding:6px 10px;border:1px solid var(--hborder);border-radius:7px;background:var(--hbg);color:var(--htext);font-family:'Oxanium',sans-serif;font-size:11px;outline:none;min-width:180px; }
    .s-input:focus { border-color:var(--accent); }
    .s-select { padding:6px 10px;border:1px solid var(--hborder);border-radius:7px;background:var(--hbg);color:var(--htext);font-family:'Oxanium',sans-serif;font-size:11px;outline:none;cursor:pointer; }
    .s-btn { padding:6px 12px;border-radius:7px;border:none;cursor:pointer;font-family:'Oxanium',sans-serif;font-size:11px;font-weight:700;transition:all .15s; }
    .s-btn-primary { background:var(--accent);color:#fff; }
    .s-btn-primary:hover { opacity:.88; }
    .s-btn-ghost { background:var(--hbg3);color:var(--htext);border:1px solid var(--hborder); }
    .s-btn-ghost:hover { background:var(--hborder); }
    .s-btn-danger { background:rgba(248,81,73,.1);color:#f85149;border:1px solid rgba(248,81,73,.25); }
    .s-btn-danger:hover { background:rgba(248,81,73,.2); }
    .s-toggle { position:relative;width:36px;height:20px;flex-shrink:0;cursor:pointer; }
    .s-toggle input { opacity:0;width:0;height:0; }
    .s-toggle-track { position:absolute;inset:0;border-radius:10px;background:var(--hborder);transition:background .2s; }
    .s-toggle input:checked + .s-toggle-track { background:var(--accent); }
    .s-toggle-thumb { position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.2); }
    .s-toggle input:checked ~ .s-toggle-thumb { left:18px; }

    /* ── History page ── */
    .history-page { position:absolute;inset:0;background:var(--hbg);color:var(--htext);overflow-y:auto; }

    /* scrollbar */
    ::-webkit-scrollbar { width:4px;height:4px; }
    ::-webkit-scrollbar-thumb { background:var(--hborder);border-radius:2px; }
  </style>
</head>
<body>
<script>
(function() {
  var t = localStorage.getItem('serverplex_theme') || 'white';
  if (['black','aurora','tokyo','forest','space','sunset','synth'].includes(t)) document.body.classList.add('spx-dark');
  else if (t === 'grey') document.body.classList.add('spx-grey');
  else document.body.classList.add('spx-light');
  var acc = localStorage.getItem('serverplex_accent');
  if (acc) document.documentElement.style.setProperty('--accent', acc);
})();
</script>

<div class="header" id="header">
  <!-- Tab bar -->
  <div class="tab-bar" id="tabBar">
    <button class="new-tab-btn" id="newTabBtn" title="New Tab (Ctrl+T)">+</button>
    <button class="collapse-btn" onclick="toggleCollapse()" title="Toggle toolbar">
      <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
    </button>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="tb-btn disabled" id="backBtn" title="Back (Alt+←)" onclick="frameNav('back')">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <button class="tb-btn disabled" id="fwdBtn" title="Forward (Alt+→)" onclick="frameNav('forward')">
      <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
    </button>
    <button class="tb-btn" title="Reload (Ctrl+R)" onclick="frameNav('reload')">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
    <button class="tb-btn" title="Home" onclick="frameNav('home')">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </button>
    <div class="url-wrap">
      <div class="url-bar">
        <span class="sec-icon" id="secIcon">🌐</span>
        <input class="url-input" id="urlInput" placeholder="Search or enter address…" autocomplete="off" spellcheck="false">
      </div>
      <div class="suggestions" id="suggestions"></div>
    </div>
    <button class="tb-btn" title="Bookmark (Ctrl+D)" onclick="addBookmark()">
      <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
    </button>
    <button class="tb-btn" id="menuBtn" title="Menu">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
  </div>

  <!-- Bookmarks bar -->
  <div class="bookmarks-bar" id="bookmarksBar"></div>

  <!-- Find bar -->
  <div class="find-bar" id="findBar">
    <span style="font-size:11px;opacity:.4">🔍</span>
    <input class="find-input" id="findInput" placeholder="Find in page…">
    <span class="find-count" id="findCount"></span>
    <button class="find-btn" id="findPrev">↑</button>
    <button class="find-btn" id="findNext">↓</button>
    <button class="find-btn" onclick="closeFindBar()">✕</button>
  </div>

  <!-- Loading bar -->
  <div class="loading-bar" id="loadingBar"></div>
</div>

<!-- Dropdown menu -->
<div class="dropdown" id="menuDropdown"></div>

<!-- Frames -->
<div class="frames" id="frames"></div>

<!-- Toast -->
<div class="toast" id="toast"><span id="toastMsg"></span></div>

<!-- Zoom badge -->
<div class="zoom-badge" id="zoomBadge">100%</div>

<script src="BrowserFiles/content-filter.js"></script>
<script>
const SJ = 'https://sj-engine-serverplex.pages.dev';

// ── State ─────────────────────────────────────────────────────
let tabs = [], activeId = null, counter = 0, zoomLevel = 100;
let isCollapsed = false;
let globalHistory = JSON.parse(localStorage.getItem('bw_history') || '[]');
let bookmarks     = JSON.parse(localStorage.getItem('bw_bookmarks') || JSON.stringify([
  { id:1, title:'🔍 Google',    url:'https://google.com' },
  { id:2, title:'📖 Wikipedia', url:'https://wikipedia.org' },
  { id:3, title:'💻 GitHub',    url:'https://github.com' },
  { id:4, title:'▶️ YouTube',  url:'https://youtube.com' },
]));
let defaultEngine = localStorage.getItem('bw_engine') || 'google';
let showBmBar     = localStorage.getItem('bw_bm_bar') !== 'false';
let suggestIdx    = -1, suggestTimer = null;

const ENGINES = {
  google: q => 'https://www.google.com/search?q=' + encodeURIComponent(q),
  ddg:    q => 'https://duckduckgo.com/?q='       + encodeURIComponent(q),
  brave:  q => 'https://search.brave.com/search?q='+ encodeURIComponent(q),
  bing:   q => 'https://www.bing.com/search?q='   + encodeURIComponent(q),
};

const $ = id => document.getElementById(id);

// ── Helpers ───────────────────────────────────────────────────
function saveBookmarks() { localStorage.setItem('bw_bookmarks', JSON.stringify(bookmarks)); }
function saveHistory()   { localStorage.setItem('bw_history',   JSON.stringify(globalHistory)); }

function addHistory(url, title) {
  globalHistory = [{ url, title: title||url, time: Date.now() },
    ...globalHistory.filter(h => h.url !== url)].slice(0, 500);
  saveHistory();
}

function showBlocked(reason) {
  var t = activeTab(); if (!t) return;
  var frame = t.frame;
  if (frame.tagName === 'IFRAME') {
    // Replace iframe temporarily with a block page div
    var blocker = document.createElement('div');
    blocker.style.cssText = 'position:absolute;inset:0;background:var(--hbg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:40px;';
    blocker.innerHTML =
      '<div style="font-size:52px">🚫</div>' +
      '<div style="font-size:18px;font-weight:800;color:var(--htext)">Page Blocked</div>' +
      '<div style="font-size:13px;color:var(--htext);opacity:.55;max-width:360px;line-height:1.6">' + (reason||'This page has been blocked by the content filter.') + '</div>' +
      '<button onclick="this.closest('div').remove()" style="padding:8px 20px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-family:Oxanium,sans-serif;font-size:13px;font-weight:700;cursor:pointer">Go Back</button>';
    frame.parentNode.style.position = 'relative';
    frame.parentNode.appendChild(blocker);
  }
}

function showToast(msg) {
  $('toastMsg').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => $('toast').classList.remove('show'), 2500);
}

function activeTab() { return tabs.find(t => t.id === activeId); }

// ── Tabs ──────────────────────────────────────────────────────
function newTab(url) {
  var id = ++counter;

  // Frame
  var frame = document.createElement('iframe');
  frame.className = 'browser-frame';
  frame.src = url || SJ;
  frame.allow = 'autoplay; fullscreen; clipboard-read; clipboard-write; storage-access';
  frame.allowFullscreen = true;
  $('frames').appendChild(frame);

  // Tab el — insert before + button
  var tabEl = document.createElement('div');
  tabEl.className = 'tab';
  tabEl.dataset.id = id;
  tabEl.innerHTML =
    '<span class="tab-favicon" id="fav-'+id+'">🌐</span>' +
    '<span class="tab-title"  id="ttl-'+id+'">' + (url ? urlHost(url) : 'New Tab') + '</span>' +
    '<span class="tab-close"  onclick="event.stopPropagation();closeTab('+id+')">✕</span>';
  tabEl.addEventListener('click', () => switchTab(id));
  tabEl.addEventListener('contextmenu', e => { e.preventDefault(); showTabCtx(e, id); });
  $('tabBar').insertBefore(tabEl, $('newTabBtn'));

  var tab = { id, frame, tabEl, url: url||SJ, title:'New Tab', pinned:false };
  tabs.push(tab);

  // Title update on load
  frame.addEventListener('load', () => {
    $('loadingBar').classList.remove('active');
    try {
      var doc = frame.contentDocument;
      if (doc && doc.title) {
        tab.title = doc.title;
        var ttl = $('ttl-'+id);
        if (ttl) ttl.textContent = doc.title.slice(0, 22);
      }
    } catch(e) {}
    if (activeId === id) updateUrlBar();
  });

  frame.addEventListener('error', () => $('loadingBar').classList.remove('active'));

  switchTab(id);
  return tab;
}

function switchTab(id) {
  activeId = id;
  tabs.forEach(t => {
    t.frame.classList.toggle('active', t.id === id);
    t.tabEl.classList.toggle('active', t.id === id);
  });
  updateUrlBar();
  updateNavBtns();
}

function closeTab(id) {
  if (tabs.length === 1) { newTab(); }
  var idx = tabs.findIndex(t => t.id === id);
  tabs[idx].frame.remove();
  tabs[idx].tabEl.remove();
  tabs.splice(idx, 1);
  if (activeId === id && tabs.length) switchTab(tabs[Math.max(0,idx-1)].id);
  saveSess();
}

function pinTab(id) {
  var t = tabs.find(x => x.id === id); if (!t) return;
  t.pinned = !t.pinned;
  t.tabEl.classList.toggle('pinned', t.pinned);
}

function duplicateTab(id) {
  var t = tabs.find(x => x.id === id); if (!t) return;
  newTab(t.frame.src);
}

function closeOthers(id) {
  tabs.filter(t => t.id !== id).forEach(t => closeTab(t.id));
}

function showTabCtx(e, id) {
  var t = tabs.find(x => x.id === id); if (!t) return;
  var menu = $('menuDropdown');
  menu.innerHTML =
    '<div class="dd-label">Tab</div>' +
    '<div class="dd-item" onclick="pinTab('+id+');closeMenu()">📌 '+(t.pinned?'Unpin':'Pin')+' Tab</div>' +
    '<div class="dd-item" onclick="duplicateTab('+id+');closeMenu()">⧉ Duplicate</div>' +
    '<div class="dd-item" onclick="closeOthers('+id+');closeMenu()">✕ Close Others</div>' +
    '<div class="dd-sep"></div>' +
    '<div class="dd-item danger" onclick="closeTab('+id+');closeMenu()">✕ Close Tab</div>';
  positionMenu(e.clientX, e.clientY);
}

// ── URL bar ───────────────────────────────────────────────────
function updateUrlBar() {
  var t = activeTab(); if (!t) return;
  var inp = $('urlInput');
  try {
    var loc = t.frame.contentWindow.location.href;
    if (loc && loc !== 'about:blank' && !loc.startsWith(SJ)) {
      inp.value = loc;
      $('secIcon').textContent = loc.startsWith('https') ? '🔒' : '🔓';
      return;
    }
  } catch(e) {}
  inp.value = t.url === SJ ? '' : t.url;
  $('secIcon').textContent = '🌐';
}

function updateNavBtns() {
  // We can't read history from cross-origin frame so just keep enabled
  $('backBtn').classList.remove('disabled');
  $('fwdBtn').classList.remove('disabled');
}

// ── Navigation ────────────────────────────────────────────────
function navigate(raw) {
  var url = raw.trim();
  if (!url) return;
  // Search query or URL?
  if (!url.includes('.') || url.includes(' ')) {
    url = ENGINES[defaultEngine](url);
  } else if (!/^https?:\/\//i.test(url)) {
    url = 'https://' + url;
  }
  // ── Content filter ──
  var check = typeof ContentFilter !== 'undefined' ? ContentFilter.check(url) : { blocked: false };
  if (check.blocked) {
    showBlocked(check.reason);
    return;
  }
  var t = activeTab(); if (!t) return;
  $('loadingBar').classList.add('active');
  t.url = url;
  t.frame.src = url;
  addHistory(url, urlHost(url));
  $('suggestions').classList.remove('open');
  updateUrlBar();
}

function frameNav(action) {
  var t = activeTab(); if (!t) return;
  try {
    if (action === 'back')    t.frame.contentWindow.history.back();
    if (action === 'forward') t.frame.contentWindow.history.forward();
    if (action === 'reload')  { $('loadingBar').classList.add('active'); t.frame.contentWindow.location.reload(); }
    if (action === 'home')    { t.frame.src = SJ; t.url = SJ; }
  } catch(e) {
    if (action === 'reload') { $('loadingBar').classList.add('active'); t.frame.src = t.frame.src; }
    if (action === 'home')   { t.frame.src = SJ; t.url = SJ; }
  }
}

function urlHost(url) {
  try { return new URL(url).hostname.replace('www.',''); } catch(e) { return url.slice(0,30); }
}

// ── Suggestions ───────────────────────────────────────────────
function showSuggestions(q) {
  var box = $('suggestions');
  if (!q) { box.classList.remove('open'); return; }
  var ql = q.toLowerCase();
  var bm = bookmarks.filter(b => b.url.toLowerCase().includes(ql) || b.title.toLowerCase().includes(ql)).slice(0,3);
  var hi = globalHistory.filter(h => h.url.toLowerCase().includes(ql) || (h.title||'').toLowerCase().includes(ql)).slice(0,5);
  var html = '';
  bm.forEach(b => { html += '<div class="sug-item" onclick="navigate(\''+b.url.replace(/'/g,"\\'")+'\')">'+'<span class="sug-icon">🔖</span><span class="sug-text">'+b.title+'</span><span class="sug-type">bookmark</span></div>'; });
  hi.forEach(h => { html += '<div class="sug-item" onclick="navigate(\''+h.url.replace(/'/g,"\\'")+'\')">'+'<span class="sug-icon">🕐</span><span class="sug-text">'+(h.title||h.url)+'</span><span class="sug-type">history</span></div>'; });
  if (!html) { box.classList.remove('open'); return; }
  box.innerHTML = html;
  box.classList.add('open');
  suggestIdx = -1;
}
function hideSuggestions() { setTimeout(() => $('suggestions').classList.remove('open'), 150); }

// ── Bookmarks ─────────────────────────────────────────────────
function renderBookmarksBar() {
  var bar = $('bookmarksBar');
  bar.classList.toggle('hidden', !showBmBar);
  if (!showBmBar) return;
  bar.innerHTML = '';
  bookmarks.forEach(bm => {
    var el = document.createElement('div');
    el.className = 'bm-item';
    el.title = bm.url;
    el.innerHTML = bm.title + '<span class="bm-del" onclick="event.stopPropagation();removeBm('+bm.id+')">×</span>';
    el.addEventListener('click', () => navigate(bm.url));
    bar.appendChild(el);
  });
  var add = document.createElement('button');
  add.className = 'bm-add'; add.title = 'Bookmark page'; add.textContent = '+';
  add.onclick = addBookmark;
  bar.appendChild(add);
}

function addBookmark() {
  var t = activeTab(); if (!t) return;
  var url = t.url || SJ;
  if (url === SJ) { showToast('No page to bookmark'); return; }
  if (bookmarks.find(b => b.url === url)) { showToast('Already bookmarked'); return; }
  bookmarks.push({ id: Date.now(), title: (t.title || urlHost(url)).slice(0,24), url });
  saveBookmarks(); renderBookmarksBar(); showToast('Bookmarked!');
}

function removeBm(id) {
  bookmarks = bookmarks.filter(b => b.id !== id);
  saveBookmarks(); renderBookmarksBar();
}

// ── Find bar ──────────────────────────────────────────────────
function toggleFind() {
  var bar = $('findBar');
  bar.classList.toggle('open');
  if (bar.classList.contains('open')) { $('findInput').focus(); $('findInput').select(); }
}
function closeFindBar() { $('findBar').classList.remove('open'); }

// ── Zoom ──────────────────────────────────────────────────────
function applyZoom() {
  var t = activeTab(); if (!t) return;
  try { t.frame.style.transform = 'scale('+zoomLevel/100+')'; t.frame.style.transformOrigin = '0 0'; t.frame.style.width = (100/(zoomLevel/100))+'%'; t.frame.style.height = (100/(zoomLevel/100))+'%'; } catch(e) {}
  $('zoomBadge').textContent = zoomLevel + '%';
  $('zoomBadge').classList.add('show');
  clearTimeout(window._zoomT);
  window._zoomT = setTimeout(() => $('zoomBadge').classList.remove('show'), 1500);
}
function zoomIn()    { zoomLevel = Math.min(zoomLevel+10,200); applyZoom(); }
function zoomOut()   { zoomLevel = Math.max(zoomLevel-10,50);  applyZoom(); }
function zoomReset() { zoomLevel = 100; applyZoom(); }

// ── Collapse ──────────────────────────────────────────────────
function toggleCollapse() {
  isCollapsed = !isCollapsed;
  $('header').classList.toggle('collapsed', isCollapsed);
}

// ── Menu ──────────────────────────────────────────────────────
function openMenu() {
  var t = activeTab();
  var isBm = t && bookmarks.find(b => b.url === t.url);
  $('menuDropdown').innerHTML =
    '<div class="dd-item" onclick="addBookmark();closeMenu()">'+(isBm?'✅ Bookmarked':'🔖 Bookmark page')+'</div>' +
    '<div class="dd-item" onclick="showHistoryTab();closeMenu()">🕐 History</div>' +
    '<div class="dd-item" onclick="openSettings();closeMenu()">⚙️ Settings</div>' +
    '<div class="dd-sep"></div>' +
    '<div class="dd-label">View</div>' +
    '<div class="dd-item" onclick="zoomIn();closeMenu()">🔍 Zoom In ('+zoomLevel+'%)</div>' +
    '<div class="dd-item" onclick="zoomOut();closeMenu()">🔎 Zoom Out</div>' +
    '<div class="dd-item" onclick="zoomReset();closeMenu()">⊙ Reset Zoom</div>' +
    '<div class="dd-item" onclick="toggleFind();closeMenu()">🔍 Find in Page</div>';
  positionMenu(window.innerWidth - 220, 80);
}

function positionMenu(x, y) {
  var menu = $('menuDropdown');
  menu.style.left = Math.min(x, window.innerWidth - 220) + 'px';
  menu.style.top  = Math.min(y, window.innerHeight - 280) + 'px';
  menu.classList.add('open');
}
function closeMenu() { $('menuDropdown').classList.remove('open'); }

// ── Settings tab ──────────────────────────────────────────────
function openSettings() {
  var existing = tabs.find(t => t._settings);
  if (existing) { switchTab(existing.id); return; }
  var id = ++counter;
  var frame = document.createElement('div');
  frame.className = 'browser-frame settings-page';
  frame.innerHTML = buildSettings();
  $('frames').appendChild(frame);

  var tabEl = document.createElement('div');
  tabEl.className = 'tab';
  tabEl.dataset.id = id;
  tabEl.innerHTML = '<span class="tab-title">⚙️ Settings</span><span class="tab-close" onclick="event.stopPropagation();closeTab('+id+')">✕</span>';
  tabEl.addEventListener('click', () => switchTab(id));
  $('tabBar').insertBefore(tabEl, $('newTabBtn'));

  var tab = { id, frame, tabEl, url:'browser://settings', title:'Settings', _settings:true };
  tabs.push(tab);
  switchTab(id);
}

function buildSettings() {
  var eng = defaultEngine;
  return '<div class="settings-inner">' +
    '<div class="s-title">⚙️ Browser Settings</div>' +
    '<div class="s-sec">Search</div>' +
    '<div class="s-card"><div class="s-row">' +
    '<div class="s-row-info"><div class="s-row-label">Default Search Engine</div><div class="s-row-desc">Used when you type in the URL bar</div></div>' +
    '<select class="s-select" id="s-engine" onchange="defaultEngine=this.value;localStorage.setItem(\'bw_engine\',this.value)">' +
    '<option value="google"'+(eng==='google'?' selected':'')+'>Google</option>' +
    '<option value="ddg"'+(eng==='ddg'?' selected':'')+'>DuckDuckGo</option>' +
    '<option value="brave"'+(eng==='brave'?' selected':'')+'>Brave Search</option>' +
    '<option value="bing"'+(eng==='bing'?' selected':'')+'>Bing</option>' +
    '</select></div></div>' +
    '<div class="s-sec">Appearance</div>' +
    '<div class="s-card"><div class="s-row">' +
    '<div class="s-row-info"><div class="s-row-label">Bookmarks Bar</div><div class="s-row-desc">Show bookmarks below the toolbar</div></div>' +
    '<label class="s-toggle"><input type="checkbox" id="s-bm"'+(showBmBar?' checked':'')+' onchange="showBmBar=this.checked;localStorage.setItem(\'bw_bm_bar\',this.checked);renderBookmarksBar()"><span class="s-toggle-track"></span><span class="s-toggle-thumb"></span></label>' +
    '</div></div>' +
    '<div class="s-sec">Proxy</div>' +
    '<div class="s-card"><div class="s-row">' +
    '<div class="s-row-info"><div class="s-row-label">ScramJet URL</div><div class="s-row-desc">Your ScramJet deployment</div></div>' +
    '<div style="display:flex;gap:6px"><input class="s-input" id="s-sj" value="'+SJ+'" readonly><button class="s-btn s-btn-ghost" onclick="window.open(\'https://github.com/MercuryWorkshop/scramjet-app\',\'_blank\')">Docs</button></div>' +
    '</div></div>' +
    '<div class="s-sec">Data</div>' +
    '<div class="s-card">' +
    '<div class="s-row"><div class="s-row-info"><div class="s-row-label">Export Data</div><div class="s-row-desc">Download bookmarks and history</div></div><button class="s-btn s-btn-primary" onclick="exportData()">📥 Export</button></div>' +
    '<div class="s-row"><div class="s-row-info"><div class="s-row-label">Import Data</div><div class="s-row-desc">Restore from backup</div></div><button class="s-btn s-btn-ghost" onclick="importData()">📤 Import</button></div>' +
    '<div class="s-row"><div class="s-row-info"><div class="s-row-label">Clear History</div><div class="s-row-desc">'+globalHistory.length+' entries</div></div><button class="s-btn s-btn-danger" onclick="globalHistory=[];saveHistory();showToast(\'History cleared\')">Clear</button></div>' +
    '<div class="s-row"><div class="s-row-info"><div class="s-row-label">Clear Bookmarks</div><div class="s-row-desc">'+bookmarks.length+' saved</div></div><button class="s-btn s-btn-danger" onclick="if(confirm(\'Delete all bookmarks?\')){bookmarks=[];saveBookmarks();renderBookmarksBar();showToast(\'Bookmarks cleared\')}">Clear</button></div>' +
    '</div></div>';
}

// ── History tab ───────────────────────────────────────────────
function showHistoryTab() {
  var id = ++counter;
  var frame = document.createElement('div');
  frame.className = 'browser-frame history-page';
  frame.style.background = 'var(--hbg)';
  frame.style.color = 'var(--htext)';
  frame.style.overflowY = 'auto';
  frame.style.padding = '24px 20px';
  frame.style.fontFamily = 'Oxanium,sans-serif';

  var groups = {};
  globalHistory.forEach(h => {
    var d = new Date(h.time).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    if (!groups[d]) groups[d] = [];
    groups[d].push(h);
  });

  var html = '<div style="max-width:580px;margin:0 auto">' +
    '<div style="font-size:18px;font-weight:800;margin-bottom:16px">🕐 History</div>' +
    '<button onclick="globalHistory=[];saveHistory();this.closest(\'.browser-frame\').innerHTML=\'<div style=padding:40px;opacity:.5>No history</div>\'" style="padding:6px 12px;background:rgba(248,81,73,.1);color:#f85149;border:1px solid rgba(248,81,73,.25);border-radius:7px;cursor:pointer;font-family:Oxanium,sans-serif;font-size:11px;font-weight:700;margin-bottom:16px">Clear All</button>';

  if (!globalHistory.length) {
    html += '<p style="opacity:.4;font-size:13px">No history yet.</p>';
  } else {
    Object.keys(groups).forEach(d => {
      html += '<div style="font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.4;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--hborder)">' + d + '</div>';
      html += '<div style="background:var(--hbg2);border:1px solid var(--hborder);border-radius:10px;overflow:hidden;margin-bottom:12px">';
      groups[d].forEach(h => {
        html += '<div onclick="navigate(\''+h.url.replace(/'/g,"\\'")+'\');closeTab('+id+')" style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--hborder);cursor:pointer;transition:background .1s" onmouseover="this.style.background=\'var(--hbg3)\'" onmouseout="this.style.background=\'\'">' +
          '<div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(h.title||h.url)+'</div>' +
          '<div style="font-size:10px;opacity:.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+h.url+'</div></div>' +
          '<div style="font-size:10px;opacity:.35;flex-shrink:0">'+new Date(h.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</div></div>';
      });
      html += '</div>';
    });
  }
  html += '</div>';
  frame.innerHTML = html;
  $('frames').appendChild(frame);

  var tabEl = document.createElement('div');
  tabEl.className = 'tab';
  tabEl.dataset.id = id;
  tabEl.innerHTML = '<span class="tab-title">🕐 History</span><span class="tab-close" onclick="event.stopPropagation();closeTab('+id+')">✕</span>';
  tabEl.addEventListener('click', () => switchTab(id));
  $('tabBar').insertBefore(tabEl, $('newTabBtn'));

  tabs.push({ id, frame, tabEl, url:'browser://history', title:'History', _history:true });
  switchTab(id);
}

// ── Session save/restore ──────────────────────────────────────
function saveSess() {
  var data = tabs.filter(t => !t._settings && !t._history).map(t => ({ url: t.url, title: t.title, pinned: t.pinned }));
  sessionStorage.setItem('bw_sess', JSON.stringify(data));
  sessionStorage.setItem('bw_active_url', activeTab() ? activeTab().url : '');
}

function restoreSess() {
  try {
    var saved = JSON.parse(sessionStorage.getItem('bw_sess') || '[]');
    if (!saved.length) return false;
    saved.forEach(s => { var t = newTab(s.url); if (s.pinned) pinTab(t.id); });
    return true;
  } catch(e) { return false; }
}

// ── Data export/import ────────────────────────────────────────
function exportData() {
  var data = { exported: new Date().toISOString(), bookmarks, history: globalHistory.slice(0,200), engine: defaultEngine };
  var a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),
    download: 'serverplex-browser-backup.json'
  });
  a.click(); URL.revokeObjectURL(a.href); showToast('Exported!');
}

function importData() {
  var inp = Object.assign(document.createElement('input'), { type:'file', accept:'.json' });
  inp.onchange = e => {
    var fr = new FileReader();
    fr.onload = ev => {
      try {
        var d = JSON.parse(ev.target.result);
        if (d.bookmarks) { bookmarks = d.bookmarks; saveBookmarks(); renderBookmarksBar(); }
        if (d.history)   { globalHistory = d.history; saveHistory(); }
        if (d.engine)    { defaultEngine = d.engine; localStorage.setItem('bw_engine', d.engine); }
        showToast('Imported!');
      } catch(e) { showToast('Invalid backup file'); }
    };
    fr.readAsText(e.target.files[0]);
  };
  inp.click();
}

// ── Events ────────────────────────────────────────────────────
$('newTabBtn').addEventListener('click', () => newTab());
$('menuBtn').addEventListener('click', e => { e.stopPropagation(); $('menuDropdown').classList.contains('open') ? closeMenu() : openMenu(); });

var urlInput = $('urlInput');
urlInput.addEventListener('click', () => urlInput.select());
urlInput.addEventListener('input', () => {
  clearTimeout(suggestTimer);
  suggestTimer = setTimeout(() => showSuggestions(urlInput.value), 100);
});
urlInput.addEventListener('blur', hideSuggestions);
urlInput.addEventListener('keydown', e => {
  var sugs = $('suggestions').querySelectorAll('.sug-item');
  if (e.key === 'ArrowDown')  { suggestIdx = Math.min(suggestIdx+1, sugs.length-1); sugs.forEach((s,i) => s.classList.toggle('hi', i===suggestIdx)); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { suggestIdx = Math.max(suggestIdx-1, 0); sugs.forEach((s,i) => s.classList.toggle('hi', i===suggestIdx)); e.preventDefault(); }
  else if (e.key === 'Enter') {
    var hi = $('suggestions').querySelector('.hi');
    navigate(hi ? hi.querySelector('.sug-text').textContent : urlInput.value);
  } else if (e.key === 'Escape') { $('suggestions').classList.remove('open'); urlInput.blur(); }
});

document.addEventListener('click', e => {
  if (!e.target.closest('#menuBtn') && !e.target.closest('#menuDropdown')) closeMenu();
});

document.addEventListener('keydown', e => {
  var mod = e.ctrlKey || e.metaKey;
  if (mod && e.key === 't') { e.preventDefault(); newTab(); }
  if (mod && e.key === 'w') { e.preventDefault(); if (activeId) closeTab(activeId); }
  if (mod && e.key === 'r') { e.preventDefault(); frameNav('reload'); }
  if (mod && e.key === 'l') { e.preventDefault(); urlInput.focus(); urlInput.select(); }
  if (mod && e.key === 'd') { e.preventDefault(); addBookmark(); }
  if (mod && e.key === 'f') { e.preventDefault(); toggleFind(); }
  if (mod && e.key === 'h') { e.preventDefault(); showHistoryTab(); }
  if (mod && e.key === ',') { e.preventDefault(); openSettings(); }
  if (mod && (e.key === '+' || e.key === '=')) { e.preventDefault(); zoomIn(); }
  if (mod && e.key === '-') { e.preventDefault(); zoomOut(); }
  if (mod && e.key === '0') { e.preventDefault(); zoomReset(); }
  if (e.altKey && e.key === 'ArrowLeft')  { e.preventDefault(); frameNav('back'); }
  if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); frameNav('forward'); }
  if (mod && e.key >= '1' && e.key <= '9') {
    var idx = parseInt(e.key) - 1;
    if (tabs[idx]) { e.preventDefault(); switchTab(tabs[idx].id); }
  }
});

// ── Init ──────────────────────────────────────────────────────
renderBookmarksBar();
if (!restoreSess()) newTab();
setInterval(saveSess, 5000);
</script>
</body>
</html>
