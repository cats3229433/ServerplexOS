<script>
// ── PROXY SYSTEM ──
var PROXY_PRESETS = {
  uv: [
    { label:'Titanium Network', url:'https://uv.titaniumnetwork.org' },
    { label:'Holy Unblocker',   url:'https://holyubofficial.net' },
    { label:'Incognito',        url:'https://incognito.school' },
  ],
  sj: [
    { label:'SJ Engine',    url:'https://sj-engine-serverplex.pages.dev' },
    { label:'Rammerhead',   url:'https://rammerhead.org' },
  ]
};

var PROXY_INFO = {
  uv:  '🔷 <b>Ultraviolet</b> — Encode URL as <code>/service/</code> + encoded path. Works with most sites. <a href="https://github.com/titaniumnetwork-dev/Ultraviolet" target="_blank">Deploy your own →</a>',
  sj:  '⚡ <b>ScramJet</b> — Faster next-gen proxy using WASM. Some sites work better here. <a href="https://github.com/MercuryWorkshop/scramjet" target="_blank">Deploy your own →</a>',
  off: '🚫 <b>No Proxy</b> — Direct iframe. Many sites block embedding with X-Frame-Options. Use a proxy if sites show a blank page.'
};

var proxyConfig = { type:'off', url:'' };
try { proxyConfig = JSON.parse(localStorage.getItem('bw_proxy') || '{"type":"off","url":""}'); } catch(e) {}

function saveProxyConfig() { try { localStorage.setItem('bw_proxy', JSON.stringify(proxyConfig)); } catch(e) {} }

function buildProxyUrl(rawUrl) {
  if (proxyConfig.type === 'off' || !proxyConfig.url) return rawUrl;
  var base = proxyConfig.url.replace(/\/$/, '');
  if (proxyConfig.type === 'uv') {
    try { return base + '/service/' + encodeURIComponent(rawUrl); } catch(e) { return rawUrl; }
  }
  if (proxyConfig.type === 'sj') {
    try { return base + '/scramjet/' + encodeURIComponent(rawUrl); } catch(e) { return rawUrl; }
  }
  return rawUrl;
}

function isProxyOn() { return proxyConfig.type !== 'off' && !!proxyConfig.url; }

function updateProxyUI() {
  var btn  = document.getElementById('proxyBtn');
  var pill = document.getElementById('proxyPill');
  if (!btn || !pill) return;
  var on = isProxyOn();
  btn.classList.toggle('proxy-on', on);
  btn.title = on ? ('Proxy ON: ' + proxyConfig.type.toUpperCase() + ' — Click to configure') : 'Enable Proxy (Ctrl+Shift+P)';
  pill.classList.toggle('show', on);
  pill.textContent = on ? proxyConfig.type.toUpperCase() : '';
}

var selectedProxyType = proxyConfig.type || 'off';

function openProxyModal() {
  selectedProxyType = proxyConfig.type || 'off';
  document.getElementById('proxyUrlInput').value = proxyConfig.url || '';
  updateProxyTypeUI(selectedProxyType);
  renderProxyPresets(selectedProxyType);
  updateProxyInfoText(selectedProxyType);
  document.getElementById('proxyOverlay').classList.add('open');
}

function closeProxyModal() { document.getElementById('proxyOverlay').classList.remove('open'); }

function updateProxyTypeUI(type) {
  ['uv','sj','off'].forEach(function(t) {
    var btn = document.getElementById('ptype-' + t);
    if (btn) btn.classList.toggle('active', t === type);
  });
  var fi = document.getElementById('proxyUrlInput').parentElement;
  var presetsEl = document.getElementById('proxyPresets').parentElement;
  fi.style.display = type === 'off' ? 'none' : '';
  presetsEl.style.display = type === 'off' ? 'none' : '';
}

function renderProxyPresets(type) {
  var el = document.getElementById('proxyPresets'); if (!el) return;
  var presets = PROXY_PRESETS[type] || [];
  el.innerHTML = '';
  presets.forEach(function(p) {
    var btn = document.createElement('div');
    btn.className = 'proxy-preset';
    btn.textContent = p.label;
    btn.onclick = function() { document.getElementById('proxyUrlInput').value = p.url; };
    el.appendChild(btn);
  });
}

function updateProxyInfoText(type) {
  var el = document.getElementById('proxyInfo');
  if (el) el.innerHTML = PROXY_INFO[type] || '';
}

['uv','sj','off'].forEach(function(type) {
  var btn = document.getElementById('ptype-' + type); if (!btn) return;
  btn.addEventListener('click', function() {
    selectedProxyType = type;
    updateProxyTypeUI(type);
    renderProxyPresets(type);
    updateProxyInfoText(type);
  });
});

document.getElementById('proxySave').addEventListener('click', function() {
  proxyConfig.type = selectedProxyType;
  proxyConfig.url  = (document.getElementById('proxyUrlInput').value || '').trim().replace(/\/$/, '');
  if (proxyConfig.type !== 'off' && !proxyConfig.url) { showToast('⚠️ Enter a proxy URL first'); return; }
  saveProxyConfig();
  updateProxyUI();
  closeProxyModal();
  showToast(isProxyOn() ? ('✓ Proxy enabled: ' + proxyConfig.type.toUpperCase()) : '✓ Proxy disabled');
});

document.getElementById('proxyClose').addEventListener('click', closeProxyModal);
document.getElementById('proxyCancel').addEventListener('click', closeProxyModal);
document.getElementById('proxyOverlay').addEventListener('click', function(e) {
  if (e.target === document.getElementById('proxyOverlay')) closeProxyModal();
});

document.getElementById('proxyBtn').addEventListener('click', openProxyModal);

document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'P') { e.preventDefault(); openProxyModal(); }
});

updateProxyUI();

// ── Patch navigate() to use proxy ──
var _originalNavigate = navigate;
navigate = function(raw) {
  var url = (raw || '').trim();
  if (!url) return;
  if (!url.includes('.') || url.includes(' ')) { url = ENGINES[defaultEngine](url); }
  else if (!/^https?:\/\//i.test(url)) { url = 'https://' + url; }
  var check = ContentFilter.check(url);
  if (check.blocked) { showBlockedPage(check.reason); return; }
  var finalUrl = isProxyOn() ? buildProxyUrl(url) : url;
  var t = activeTab();
  if (!t) { _loadUrl(finalUrl, url); return; }
  if (t.isNew) {
    t.frameEl.remove();
    var frame = document.createElement('iframe');
    frame.className = 'browser-frame active';
    frame.src = finalUrl;
    frame.allow = 'autoplay; fullscreen; clipboard-read; clipboard-write; storage-access';
    frame.allowFullscreen = true;
    frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-modals allow-downloads allow-storage-access-by-user-activation');
    document.getElementById('pane1').appendChild(frame);
    t.frameEl = frame; t.isNew = false; t.url = url;
    frame.addEventListener('load', function() {
      document.getElementById('loadingBar').classList.remove('active');
      try { var doc = frame.contentDocument; if (doc && doc.title) { t.title = doc.title; var ttl = document.getElementById('ttl-' + t.id); if (ttl) ttl.textContent = doc.title.slice(0, 22); } } catch(e) {}
      updateUrlBar();
    });
    frame.addEventListener('error', function() {
      document.getElementById('loadingBar').classList.remove('active');
      if (!isProxyOn()) showToast('⚠️ Site blocked iframe — try enabling Proxy');
    });
  } else { t.url = url; t.frameEl.src = finalUrl; }
  document.getElementById('loadingBar').classList.add('active');
  addHistory(url, urlHost(url));
  document.getElementById('suggestions').classList.remove('open');
  updateUrlBar(); updateNavBtns();
  var ttl = document.getElementById('ttl-' + t.id); if (ttl) ttl.textContent = urlHost(url);
};

function _loadUrl(finalUrl, originalUrl) { var t = newTab(finalUrl); t.isNew = false; t.url = originalUrl || finalUrl; }

// Override updateUrlBar to always show real URL not proxy URL
updateUrlBar = function() {
  var t = activeTab(); if (!t) return;
  var inp = document.getElementById('urlInput');
  if (t.isNew) { inp.value = ''; document.getElementById('secIcon').textContent = '🌐'; return; }
  inp.value = t.url || '';
  document.getElementById('secIcon').textContent = (t.url||'').startsWith('https') ? '🔒' : '🔓';
};

// ══════════════════════════════════════════════
//  SPLIT VIEW
// ══════════════════════════════════════════════

var splitActive = false;
var splitTabId  = null;   // tab id shown in pane2
var splitTabs   = [];     // tabs living in pane2
var splitCounter = 0;

function toggleSplitView() {
  if (splitActive) { closeSplitView(); return; }
  openSplitView();
}

function openSplitView() {
  var pane2 = document.getElementById('pane2');
  var divider = document.getElementById('splitDivider');
  pane2.classList.remove('hidden');
  divider.style.display = 'block';
  splitActive = true;
  document.getElementById('splitBtn').classList.add('split-on');
  // Open a new tab in pane2
  newSplitTab();
  initSplitDrag();
}

function closeSplitView() {
  // Move any pane2 tabs back to pane1 and close them
  splitTabs.forEach(function(t) {
    var rf = document.getElementById('srf-' + t.id);
    if (rf) rf.remove();
    if (t.tabEl) t.tabEl.remove();
  });
  splitTabs = [];
  splitTabId = null;
  var pane2Frames = document.getElementById('pane2Frames');
  if (pane2Frames) pane2Frames.innerHTML = '';
  document.getElementById('pane2').classList.add('hidden');
  document.getElementById('splitDivider').style.display = 'none';
  document.getElementById('framesWrap').style.setProperty('--pane1-width', '');
  document.getElementById('pane1').style.flex = '';
  splitActive = false;
  document.getElementById('splitBtn').classList.remove('split-on');
}

function newSplitTab(url) {
  var id = 's' + (++splitCounter);
  var isNew = !url;
  var pane2Frames = document.getElementById('pane2Frames');

  var frameEl;
  if (isNew) {
    frameEl = buildSplitNewTab(id);
  } else {
    frameEl = document.createElement('iframe');
    frameEl.className = 'browser-frame active';
    frameEl.src = url;
    frameEl.allow = 'autoplay; fullscreen; clipboard-read; clipboard-write; storage-access';
    frameEl.allowFullscreen = true;
    frameEl.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-modals allow-downloads allow-storage-access-by-user-activation');
    frameEl.style.position = 'absolute';
    frameEl.style.inset = '0';
    frameEl.style.width = '100%';
    frameEl.style.height = '100%';
    frameEl.style.border = 'none';
  }
  frameEl.id = 'srf-' + id;
  pane2Frames.appendChild(frameEl);

  // Hide previous pane2 frame
  if (splitTabId) {
    var prev = document.getElementById('srf-' + splitTabId);
    if (prev) { prev.style.display = 'none'; prev.classList.remove('active'); }
  }

  splitTabId = id;
  var tab = { id: id, frameEl: frameEl, url: url || 'newtab', title: isNew ? 'New Tab' : urlHost(url), isNew: isNew };
  splitTabs.push(tab);
  updatePane2Bar(tab);
  return tab;
}

function buildSplitNewTab(id) {
  var div = document.createElement('div');
  div.style.cssText = 'position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--app-bg);overflow-y:auto;padding:20px';

  var icon = document.createElement('div');
  icon.style.fontSize = '36px'; icon.textContent = '🌐';

  var label = document.createElement('div');
  label.style.cssText = 'font-size:16px;font-weight:800;color:var(--app-text)';
  label.textContent = 'Split View';

  var wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative;width:100%;max-width:400px';

  var inp = document.createElement('input');
  inp.placeholder = 'Search or enter address…';
  inp.style.cssText = 'width:100%;padding:10px 44px 10px 16px;background:var(--app-surface);border:1.5px solid var(--app-border);border-radius:24px;font-family:Oxanium,sans-serif;font-size:13px;color:var(--app-text);outline:none';

  var goBtn = document.createElement('button');
  goBtn.textContent = '→';
  goBtn.style.cssText = 'position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--app-accent);border:none;cursor:pointer;font-size:14px;color:#fff';
  goBtn.onclick = function() { splitNavigate(inp.value); };

  inp.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') splitNavigate(inp.value);
  });

  wrap.appendChild(inp);
  wrap.appendChild(goBtn);
  div.appendChild(icon);
  div.appendChild(label);
  div.appendChild(wrap);

  setTimeout(function() { inp.focus(); }, 60);
  return div;
}

function updatePane2Bar(tab) {
  var title = document.getElementById('pane2Title');
  if (title) title.textContent = tab.title || 'New Tab';
}

function splitNavigate(raw) {
  var url = (raw || '').trim();
  if (!url) return;
  if (!url.includes('.') || url.includes(' ')) url = ENGINES[defaultEngine](url);
  else if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

  var finalUrl = isProxyOn() ? buildProxyUrl(url) : url;

  var t = splitTabs.find(function(x){ return x.id === splitTabId; });
  if (!t) { newSplitTab(url); return; }

  if (t.isNew) {
    t.frameEl.remove();
    var frame = document.createElement('iframe');
    frame.id = 'srf-' + t.id;
    frame.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:none;display:block';
    frame.src = finalUrl;
    frame.allow = 'autoplay; fullscreen; clipboard-read; clipboard-write; storage-access';
    frame.allowFullscreen = true;
    frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-modals allow-downloads allow-storage-access-by-user-activation');
    document.getElementById('pane2Frames').appendChild(frame);
    t.frameEl = frame; t.isNew = false; t.url = url;
    frame.addEventListener('load', function() {
      try { var doc = frame.contentDocument; if (doc && doc.title) { t.title = doc.title; updatePane2Bar(t); } } catch(e){}
    });
  } else {
    t.url = url;
    t.frameEl.src = finalUrl;
    t.title = urlHost(url);
    updatePane2Bar(t);
  }
}

// ── Drag to resize ──
function initSplitDrag() {
  var divider = document.getElementById('splitDivider');
  if (divider._draggable) return;
  divider._draggable = true;
  var dragging = false, startX, startW;

  divider.addEventListener('mousedown', function(e) {
    dragging = true; startX = e.clientX;
    startW = document.getElementById('pane1').getBoundingClientRect().width;
    divider.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var wrap = document.getElementById('framesWrap');
    var total = wrap.getBoundingClientRect().width;
    var newW = Math.max(200, Math.min(total - 200, startW + (e.clientX - startX)));
    var pct = (newW / total * 100).toFixed(2);
    document.getElementById('pane1').style.flex = '0 0 ' + pct + '%';
    document.getElementById('pane2').style.flex = '1';
  });
  document.addEventListener('mouseup', function() {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
}

// pane2 nav helper
function splitNav(action) {
  var t = splitTabs.find(function(x){ return x.id === splitTabId; });
  var inp = document.getElementById('pane2Url');
  if (action === 'go' && inp) { splitNavigate(inp.value); return; }
  if (!t || t.isNew || !t.frameEl || t.frameEl.tagName !== 'IFRAME') return;
  try {
    if (action === 'back')    t.frameEl.contentWindow.history.back();
    if (action === 'forward') t.frameEl.contentWindow.history.forward();
    if (action === 'reload')  t.frameEl.contentWindow.location.reload();
  } catch(e) {
    if (action === 'reload') t.frameEl.src = t.frameEl.src;
  }
}

// Keep pane2 url bar in sync
function updatePane2Bar(tab) {
  var title = document.getElementById('pane2Title');
  var urlInp = document.getElementById('pane2Url');
  if (title) title.textContent = tab.title || 'New Tab';
  if (urlInp && tab.url && tab.url !== 'newtab') urlInp.value = tab.url;
  else if (urlInp) urlInp.value = '';
}

// Wire split button
document.getElementById('splitBtn').addEventListener('click', toggleSplitView);

// pane2 URL bar enter key
setTimeout(function() {
  var p2url = document.getElementById('pane2Url');
  if (p2url) {
    p2url.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') splitNav('go');
      if (e.key === 'Escape') e.target.blur();
    });
  }
}, 100);

document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey||e.metaKey) && e.shiftKey && e.key === '\\') { e.preventDefault(); toggleSplitView(); }
});

</script>
