<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
  <title>ServerplexOS Browser</title>
  <style>
    :root {
      --accent: #0078d4;
      --accent-glow: rgba(0,120,212,0.35);
      --bg: #07090f;
      --surface: #0e1420;
      --surface2: #141c2e;
      --surface3: #1a2238;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.13);
      --text: #e8edf5;
      --text2: #8b97b0;
      --text3: #4a5568;
      --red: #ef4444;
      --green: #22c55e;
      --yellow: #f59e0b;
      --hh: 88px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; font-family:'Oxanium',sans-serif; overflow:hidden; background:var(--bg); color:var(--text); }
    body { display:flex; flex-direction:column; }

    /* ══ SCROLLBARS ══ */
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

    /* ══ HEADER ══ */
    .header {
      background: rgba(14,20,32,0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      flex-shrink:0;
      position:relative;
      z-index:1000;
      transition: transform 0.3s ease, margin 0.3s ease;
    }
    .header.collapsed { transform:translateY(-100%); margin-bottom:calc(-1 * var(--hh)); }

    /* Tab bar */
    .tab-bar {
      display:flex; align-items:flex-end; gap:3px;
      padding:10px 44px 0 10px;
      overflow-x:auto; scrollbar-width:none;
      min-height:42px;
    }
    .tab-bar::-webkit-scrollbar { display:none; }

    .tab {
      display:flex; align-items:center; gap:7px;
      padding:7px 12px 7px 10px;
      background: var(--surface2);
      border:1px solid var(--border);
      border-bottom:none;
      border-radius:10px 10px 0 0;
      cursor:pointer;
      min-width:130px; max-width:200px;
      color:var(--text2);
      font-size:12px; font-weight:600;
      transition:all 0.18s ease;
      position:relative;
      user-select:none;
      flex-shrink:0;
    }
    .tab:hover { background:var(--surface3); color:var(--text); }
    .tab.active {
      background:var(--surface);
      border-color:var(--border2);
      color:var(--text);
      box-shadow:0 -2px 0 var(--accent) inset;
    }
    .tab.pinned { min-width:40px; max-width:44px; justify-content:center; padding:7px 10px; }
    .tab.pinned .tab-title, .tab.pinned .tab-close { display:none; }
    .tab-favicon { width:14px; height:14px; flex-shrink:0; font-size:13px; line-height:1; }
    .tab-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tab-close {
      width:16px; height:16px; border-radius:4px;
      display:flex; align-items:center; justify-content:center;
      font-size:12px; opacity:0; transition:all 0.15s; flex-shrink:0;
      color:var(--text2);
    }
    .tab:hover .tab-close { opacity:1; }
    .tab-close:hover { background:rgba(239,68,68,0.25); color:#fca5a5; opacity:1 !important; }
    .tab.settings-tab .tab-favicon { font-size:14px; }

    .new-tab-btn {
      width:28px; height:28px; border-radius:8px;
      background:rgba(255,255,255,0.05); border:1px solid var(--border);
      color:var(--text2); font-size:18px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:all 0.2s; flex-shrink:0; margin-bottom:2px;
    }
    .new-tab-btn:hover { background:rgba(255,255,255,0.1); color:var(--text); transform:scale(1.1); }

    /* Top row */
    .top-row {
      display:flex; align-items:center; gap:7px;
      padding:7px 50px 7px 10px;
    }
    .nav-btn {
      width:30px; height:30px; border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:all 0.15s; flex-shrink:0;
      color:var(--text2); font-size:16px;
      border:1px solid transparent;
    }
    .nav-btn:hover { background:var(--surface2); border-color:var(--border); color:var(--text); }
    .nav-btn:active { transform:scale(0.93); }
    .nav-btn.disabled { opacity:0.3; pointer-events:none; }

    .url-bar {
      flex:1; display:flex; align-items:center; gap:8px;
      background:var(--surface2); border:1px solid var(--border);
      border-radius:12px; padding:7px 14px;
      transition:all 0.2s;
    }
    .url-bar:focus-within {
      border-color:rgba(0,120,212,0.5);
      background:rgba(0,120,212,0.06);
      box-shadow:0 0 0 3px var(--accent-glow);
    }
    .url-security { font-size:14px; flex-shrink:0; color:var(--text3); }
    .url-input {
      flex:1; border:none; background:transparent;
      font-family:'Oxanium',sans-serif; font-size:13px;
      color:var(--text); outline:none; letter-spacing:0.2px;
    }
    .url-input::placeholder { color:var(--text3); }
    .url-input::selection { background:rgba(0,120,212,0.3); }
    .url-badge {
      font-size:9px; font-weight:800; letter-spacing:1px;
      padding:2px 8px; border-radius:20px; flex-shrink:0; text-transform:uppercase;
    }
    .url-badge.direct { background:rgba(34,197,94,0.15); color:#4ade80; border:1px solid rgba(34,197,94,0.25); }
    .url-badge.proxied { background:rgba(0,120,212,0.15); color:#60a5fa; border:1px solid rgba(0,120,212,0.3); }
    .url-badge.blocked { background:rgba(239,68,68,0.15); color:#fca5a5; border:1px solid rgba(239,68,68,0.25); }

    /* Ad block badge */
    .adblocker-btn {
      width:28px; height:28px; border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      font-size:15px; cursor:pointer; flex-shrink:0;
      border:1px solid transparent; transition:all 0.2s;
      position:relative;
    }
    .adblocker-btn:hover { background:var(--surface2); border-color:var(--border); }
    .adblocker-btn.enabled { color:#4ade80; }
    .adblocker-btn.disabled-state { color:var(--text3); }
    .adblocker-count {
      position:absolute; top:-4px; right:-4px;
      background:var(--accent); color:#fff;
      font-size:8px; font-weight:800; min-width:15px; height:15px;
      border-radius:10px; display:flex; align-items:center; justify-content:center;
      padding:0 3px; pointer-events:none;
    }

    .toggle-btn {
      position:fixed; top:8px; right:10px;
      width:36px; height:36px; border-radius:9px;
      background:var(--surface2); border:1px solid var(--border2);
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      z-index:99999; box-shadow:0 4px 16px rgba(0,0,0,0.4);
      color:var(--text2); font-size:16px; transition:all 0.2s;
    }
    .toggle-btn:hover { background:var(--surface3); color:var(--text); }
    .toggle-btn.collapsed { transform:rotate(180deg); }

    .loading-bar { height:2px; background:transparent; position:relative; overflow:hidden; }
    .loading-bar.active::after {
      content:''; position:absolute; left:-40%; width:40%; height:100%;
      background:linear-gradient(90deg,transparent,var(--accent),transparent);
      animation:load 1.1s ease-in-out infinite;
    }
    @keyframes load { to { left:110%; } }

    /* Bookmarks bar */
    .bookmarks-bar {
      background:rgba(14,20,32,0.9);
      border-bottom:1px solid var(--border);
      padding:4px 10px;
      display:flex; gap:4px; align-items:center;
      overflow-x:auto; scrollbar-width:none; flex-shrink:0;
    }
    .bookmarks-bar::-webkit-scrollbar { display:none; }
    .bm-item {
      padding:3px 10px; background:var(--surface2);
      border:1px solid var(--border); border-radius:6px;
      font-size:11px; font-weight:600; color:var(--text2);
      cursor:pointer; white-space:nowrap;
      transition:all 0.15s; display:flex; align-items:center; gap:4px;
    }
    .bm-item:hover { background:var(--surface3); color:var(--text); border-color:var(--border2); }

    /* ══ DROPDOWNS ══ */
    .dropdown {
      position:fixed; background:var(--surface);
      border:1px solid var(--border2); border-radius:12px;
      z-index:99999; display:none;
      box-shadow:0 16px 48px rgba(0,0,0,0.6);
      min-width:220px; max-height:420px; overflow-y:auto;
      animation:ddIn 0.15s ease;
    }
    .dropdown.open { display:block; }
    @keyframes ddIn { from{opacity:0;transform:translateY(-6px) scale(0.97)} to{opacity:1;transform:translateY(0) scale(1)} }
    .dd-header {
      padding:10px 14px 6px;
      font-size:9px; font-weight:800; letter-spacing:3px; text-transform:uppercase;
      color:var(--text3); border-bottom:1px solid var(--border);
    }
    .dd-item {
      padding:10px 14px; cursor:pointer;
      display:flex; align-items:center; gap:10px;
      font-size:13px; color:var(--text2);
      transition:all 0.1s;
    }
    .dd-item:hover { background:var(--surface2); color:var(--text); }
    .dd-item .dd-sub { font-size:10px; color:var(--text3); margin-top:1px; }
    .dd-sep { height:1px; background:var(--border); margin:3px 0; }
    .dd-item.danger:hover { background:rgba(239,68,68,0.1); color:#fca5a5; }
    .dd-item.success-item { color:#4ade80; }
    .dd-item.success-item:hover { background:rgba(34,197,94,0.1); }

    /* ══ CONTENT ══ */
    .content { flex:1; position:relative; overflow:hidden; }
    .page { position:absolute; inset:0; }
    .page.hidden { display:none; }

    /* ══ NEW TAB PAGE ══ */
    .ntp {
      position:absolute; inset:0;
      background:radial-gradient(ellipse 70% 60% at 30% 30%, rgba(0,120,212,0.08) 0%, transparent 65%), var(--bg);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:0; overflow-y:auto; padding:40px 20px;
    }
    .ntp-greeting {
      font-size:13px; font-weight:600; letter-spacing:3px; text-transform:uppercase;
      color:var(--text3); margin-bottom:6px;
    }
    .ntp-time {
      font-size:64px; font-weight:800; letter-spacing:-2px;
      color:var(--text); line-height:1;
      text-shadow:0 0 60px rgba(0,120,212,0.3);
      margin-bottom:4px;
    }
    .ntp-date {
      font-size:13px; color:var(--text2); letter-spacing:1px;
      margin-bottom:36px;
    }
    .ntp-search-wrap {
      display:flex; width:520px; max-width:90vw;
      background:var(--surface); border:1px solid var(--border2);
      border-radius:16px; overflow:hidden;
      box-shadow:0 8px 32px rgba(0,0,0,0.4);
      transition:all 0.2s;
      margin-bottom:32px;
    }
    .ntp-search-wrap:focus-within {
      border-color:rgba(0,120,212,0.5);
      box-shadow:0 8px 32px rgba(0,0,0,0.4), 0 0 0 3px var(--accent-glow);
    }
    .ntp-engine {
      padding:0 14px; background:var(--surface2);
      border:none; border-right:1px solid var(--border);
      color:var(--text2); font-family:'Oxanium',sans-serif;
      font-size:12px; cursor:pointer; outline:none;
    }
    .ntp-engine option { background:var(--surface); }
    .ntp-input {
      flex:1; padding:14px 16px;
      background:transparent; border:none;
      color:var(--text); font-family:'Oxanium',sans-serif;
      font-size:14px; outline:none;
    }
    .ntp-input::placeholder { color:var(--text3); }
    .ntp-go {
      padding:0 20px; background:var(--accent);
      border:none; color:#fff; font-family:'Oxanium',sans-serif;
      font-size:14px; font-weight:700; cursor:pointer; transition:background 0.2s;
    }
    .ntp-go:hover { background:#0090ff; }

    /* Quick tiles */
    .ntp-tiles-label {
      font-size:9px; font-weight:800; letter-spacing:3px;
      text-transform:uppercase; color:var(--text3); margin-bottom:12px; align-self:flex-start;
      width:520px; max-width:90vw;
    }
    .ntp-tiles {
      display:grid; grid-template-columns:repeat(5,1fr);
      gap:10px; width:520px; max-width:90vw; margin-bottom:28px;
    }
    .ntp-tile {
      background:var(--surface); border:1px solid var(--border);
      border-radius:14px; padding:14px 8px;
      display:flex; flex-direction:column; align-items:center; gap:7px;
      cursor:pointer; transition:all 0.2s; font-size:11px;
      font-weight:600; color:var(--text2); text-align:center;
    }
    .ntp-tile:hover { background:var(--surface2); border-color:var(--border2); color:var(--text); transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,0.3); }
    .ntp-tile-icon { font-size:22px; }

    /* Recent history */
    .ntp-hist-label {
      font-size:9px; font-weight:800; letter-spacing:3px;
      text-transform:uppercase; color:var(--text3); margin-bottom:10px; align-self:flex-start;
      width:520px; max-width:90vw;
    }
    .ntp-hist-row { display:flex; flex-direction:column; gap:4px; width:520px; max-width:90vw; }
    .ntp-hist-item {
      display:flex; align-items:center; gap:10px;
      padding:8px 12px; background:var(--surface);
      border:1px solid var(--border); border-radius:10px;
      cursor:pointer; transition:all 0.15s; font-size:12px; color:var(--text2);
    }
    .ntp-hist-item:hover { background:var(--surface2); color:var(--text); border-color:var(--border2); }
    .ntp-hist-item-url { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .ntp-hist-item-time { font-size:10px; color:var(--text3); flex-shrink:0; }

    /* ══ DIRECT IFRAME ══ */
    .direct-iframe { position:absolute; inset:0; width:100%; height:100%; border:none; opacity:0; transition:opacity 0.3s; }
    .direct-iframe.loaded { opacity:1; }

    /* ══ SETTINGS PAGE ══ */
    .settings-page {
      position:absolute; inset:0;
      background:var(--bg); overflow-y:auto;
    }
    .settings-inner { max-width:640px; margin:0 auto; padding:32px 24px 60px; }
    .settings-hero {
      display:flex; align-items:center; gap:14px; margin-bottom:32px;
    }
    .settings-hero-icon {
      width:48px; height:48px; background:linear-gradient(135deg,var(--accent),#7c3aed);
      border-radius:14px; display:flex; align-items:center; justify-content:center;
      font-size:24px; box-shadow:0 4px 20px var(--accent-glow);
    }
    .settings-hero-title { font-size:22px; font-weight:800; }
    .settings-hero-sub { font-size:12px; color:var(--text3); margin-top:2px; letter-spacing:0.5px; }

    .settings-tabs {
      display:flex; gap:4px; margin-bottom:24px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:12px; padding:4px;
    }
    .settings-tab {
      flex:1; padding:9px 12px; border-radius:9px;
      font-size:12px; font-weight:700; cursor:pointer;
      text-align:center; transition:all 0.2s; color:var(--text3);
      border:none; background:transparent; font-family:'Oxanium',sans-serif;
      letter-spacing:0.3px;
    }
    .settings-tab:hover { color:var(--text2); }
    .settings-tab.active {
      background:var(--accent); color:#fff;
      box-shadow:0 2px 12px var(--accent-glow);
    }

    .settings-panel { display:none; }
    .settings-panel.active { display:block; animation:panelIn 0.2s ease; }
    @keyframes panelIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    .s-section { margin-bottom:24px; }
    .s-section-label {
      font-size:9px; font-weight:800; letter-spacing:3px; text-transform:uppercase;
      color:var(--text3); margin-bottom:10px; padding-left:2px;
    }
    .s-row {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px; background:var(--surface);
      border:1px solid var(--border); border-radius:12px; margin-bottom:6px;
    }
    .s-row-info { flex:1; min-width:0; }
    .s-row-label { font-size:13px; font-weight:600; }
    .s-row-sub { font-size:11px; color:var(--text3); margin-top:2px; line-height:1.5; }
    .s-input {
      padding:8px 12px; background:var(--surface2);
      border:1px solid var(--border2); border-radius:8px;
      color:var(--text); font-family:'Oxanium',sans-serif; font-size:13px; outline:none;
      transition:all 0.2s; width:240px;
    }
    .s-input:focus { border-color:rgba(0,120,212,0.6); background:rgba(0,120,212,0.06); }
    .s-input::placeholder { color:var(--text3); }
    .s-select {
      padding:8px 12px; background:var(--surface2);
      border:1px solid var(--border2); border-radius:8px;
      color:var(--text); font-family:'Oxanium',sans-serif; font-size:12px;
      outline:none; cursor:pointer;
    }
    .s-select option { background:var(--surface); }
    .s-btn {
      padding:8px 18px; border-radius:9px;
      font-family:'Oxanium',sans-serif; font-size:12px; font-weight:700;
      cursor:pointer; transition:all 0.2s; border:1px solid var(--border2);
      background:var(--surface2); color:var(--text2); letter-spacing:0.3px;
    }
    .s-btn:hover { background:var(--surface3); color:var(--text); }
    .s-btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 4px 14px var(--accent-glow); }
    .s-btn.primary:hover { background:#0090ff; }
    .s-btn.danger { background:rgba(239,68,68,0.1); border-color:rgba(239,68,68,0.3); color:#fca5a5; }
    .s-btn.danger:hover { background:rgba(239,68,68,0.2); }
    .s-toggle {
      width:44px; height:24px; border-radius:12px;
      position:relative; cursor:pointer; transition:background 0.25s; flex-shrink:0;
      background:rgba(255,255,255,0.12); border:none;
    }
    .s-toggle.on { background:var(--accent); }
    .s-toggle::after {
      content:''; position:absolute; top:3px; left:3px;
      width:18px; height:18px; border-radius:50%;
      background:#fff; transition:left 0.25s; box-shadow:0 1px 6px rgba(0,0,0,0.4);
    }
    .s-toggle.on::after { left:23px; }
    .s-blocklist-textarea {
      width:100%; height:140px; padding:10px 12px;
      background:var(--surface2); border:1px solid var(--border2);
      border-radius:8px; color:var(--text); font-family:monospace;
      font-size:11px; outline:none; resize:vertical;
      line-height:1.6; letter-spacing:0.3px;
    }
    .s-blocklist-textarea:focus { border-color:rgba(0,120,212,0.5); }
    .s-full { width:100%; margin-top:8px; }
    .s-row.vertical { flex-direction:column; align-items:flex-start; gap:10px; }
    .s-shortcuts-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:6px;
    }
    .s-shortcut {
      display:flex; align-items:center; justify-content:space-between;
      padding:8px 12px; background:var(--surface2);
      border:1px solid var(--border); border-radius:8px; font-size:12px;
    }
    .s-shortcut-desc { color:var(--text2); }
    .s-shortcut-key {
      background:var(--surface3); border:1px solid var(--border2);
      border-radius:5px; padding:2px 8px; font-size:11px;
      color:var(--text); font-family:monospace; letter-spacing:0.5px;
    }

    /* ══ KEYBOARD SHORTCUTS MODAL ══ */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.7);
      backdrop-filter:blur(10px); z-index:99998;
      display:none; align-items:center; justify-content:center; padding:20px;
    }
    .modal-overlay.open { display:flex; animation:modalIn 0.2s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes modalIn { from{opacity:0;transform:scale(0.94)} to{opacity:1;transform:scale(1)} }
    .modal-box {
      background:var(--surface); border:1px solid var(--border2);
      border-radius:20px; width:100%; max-width:560px;
      max-height:80vh; overflow:hidden; display:flex; flex-direction:column;
      box-shadow:0 32px 80px rgba(0,0,0,0.7);
    }
    .modal-header {
      padding:20px 24px 16px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; gap:12px;
    }
    .modal-title { font-size:17px; font-weight:800; flex:1; }
    .modal-close-btn {
      width:30px; height:30px; border-radius:8px;
      background:var(--surface2); border:1px solid var(--border);
      color:var(--text2); cursor:pointer; font-size:16px;
      display:flex; align-items:center; justify-content:center; transition:all 0.15s;
    }
    .modal-close-btn:hover { background:var(--surface3); color:var(--text); }
    .modal-search {
      padding:12px 20px; border-bottom:1px solid var(--border);
    }
    .modal-search input {
      width:100%; padding:9px 14px; background:var(--surface2);
      border:1px solid var(--border2); border-radius:10px;
      color:var(--text); font-family:'Oxanium',sans-serif; font-size:13px; outline:none;
    }
    .modal-search input:focus { border-color:rgba(0,120,212,0.5); }
    .modal-search input::placeholder { color:var(--text3); }
    .modal-body { overflow-y:auto; padding:16px 20px 24px; }
    .shortcut-group { margin-bottom:20px; }
    .shortcut-group-title {
      font-size:9px; font-weight:800; letter-spacing:3px; text-transform:uppercase;
      color:var(--text3); margin-bottom:10px;
    }
    .shortcut-row {
      display:flex; align-items:center; justify-content:space-between;
      padding:9px 12px; border-radius:9px; font-size:13px; color:var(--text2);
      transition:background 0.1s;
    }
    .shortcut-row:hover { background:var(--surface2); color:var(--text); }
    .shortcut-keys { display:flex; gap:4px; }
    .key-chip {
      background:var(--surface3); border:1px solid var(--border2);
      border-radius:5px; padding:2px 8px;
      font-size:11px; font-family:monospace; color:var(--text); letter-spacing:0.5px;
    }

    /* ══ AD BLOCKER TOAST ══ */
    .block-toast {
      position:fixed; bottom:16px; left:50%;
      transform:translateX(-50%) translateY(60px);
      background:var(--surface); border:1px solid var(--border2);
      padding:10px 18px; border-radius:12px;
      font-size:13px; font-weight:600; display:flex; align-items:center; gap:10px;
      box-shadow:0 8px 32px rgba(0,0,0,0.5); z-index:99999;
      opacity:0; pointer-events:none;
      transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .block-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .block-toast-dot { width:8px; height:8px; border-radius:50%; background:var(--green); }

    /* ══ MENU DROPDOWN ══ */
    #menuDropdown { right:12px; min-width:240px; }

    /* ══ EXT PAGE ══ */
    .ext-page {
      position:absolute; inset:0;
      background:var(--bg);
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      gap:14px; color:var(--text); text-align:center; padding:40px;
    }
    .ext-icon { font-size:52px; }
    .ext-title { font-size:18px; font-weight:700; }
    .ext-url { font-size:11px; color:var(--text3); word-break:break-all; max-width:480px; }
    .ext-note { font-size:13px; color:var(--text2); line-height:1.65; max-width:400px; }
    .ext-open {
      padding:10px 24px; background:var(--accent); border:none;
      border-radius:10px; color:#fff; font-family:'Oxanium',sans-serif;
      font-size:13px; font-weight:700; cursor:pointer; transition:all 0.2s;
      box-shadow:0 4px 16px var(--accent-glow);
    }
    .ext-open:hover { background:#0090ff; transform:translateY(-2px); }
  </style>
</head>
<body>

  <!-- Toggle header button -->
  <button class="toggle-btn" id="toggleBtn" title="Toggle browser bar (Alt+H)">▲</button>

  <!-- Header -->
  <div class="header" id="header">
    <div class="tab-bar" id="tabBar">
      <button class="new-tab-btn" id="newTabBtn" title="New Tab (Ctrl+T)">+</button>
    </div>
    <div class="top-row">
      <div class="nav-btn disabled" id="backBtn" title="Back (Alt+←)">◀</div>
      <div class="nav-btn disabled" id="fwdBtn" title="Forward (Alt+→)">▶</div>
      <div class="nav-btn" id="homeBtn" title="Home (Alt+Home)">⌂</div>
      <div class="nav-btn" id="refreshBtn" title="Reload (Ctrl+R)">↻</div>
      <div class="url-bar">
        <span class="url-security" id="urlSecurity">🔒</span>
        <input class="url-input" id="urlInput" type="text" placeholder="Search or enter URL…" spellcheck="false" autocomplete="off">
        <span class="url-badge" id="urlBadge" style="display:none"></span>
      </div>
      <div class="adblocker-btn enabled" id="adBlockBtn" title="Ad Blocker (Ctrl+Shift+A)">🛡️<span class="adblocker-count" id="blockCount" style="display:none">0</span></div>
      <div class="nav-btn" id="menuBtn" title="Menu (Alt+M)" style="font-size:18px; position:relative;">⋮
        <div class="dropdown" id="menuDropdown">
          <div class="dd-header">ServerplexOS Browser</div>
          <div class="dd-item" id="ddBookmark">🔖 <div><div>Bookmark this page</div></div></div>
          <div class="dd-item" id="ddBookmarks">📚 <div><div>Bookmarks</div></div></div>
          <div class="dd-item" id="ddHistory">🕐 <div><div>History</div></div></div>
          <div class="dd-sep"></div>
          <div class="dd-item" id="ddPinTab">📌 <div><div>Pin Tab</div></div></div>
          <div class="dd-item" id="ddDuplicate">⧉ <div><div>Duplicate Tab</div></div></div>
          <div class="dd-item" id="ddCloseOthers">✕ <div><div>Close Other Tabs</div></div></div>
          <div class="dd-sep"></div>
          <div class="dd-item" id="ddShortcuts">⌨️ <div><div>Keyboard Shortcuts</div><div class="dd-sub">Press ? anytime</div></div></div>
          <div class="dd-item" id="ddSettings">⚙️ <div><div>Settings</div></div></div>
        </div>
      </div>
    </div>
    <div class="loading-bar" id="loadingBar"></div>
  </div>

  <!-- Bookmarks bar -->
  <div class="bookmarks-bar" id="bookmarksBar">
    <span class="bm-item" onclick="navigate('https://google.com')">🔍 Google</span>
    <span class="bm-item" onclick="navigate('https://wikipedia.org')">📖 Wikipedia</span>
    <span class="bm-item" onclick="navigate('https://github.com')">💻 GitHub</span>
    <span class="bm-item" onclick="navigate('https://youtube.com')">▶️ YouTube</span>
    <span class="bm-item" onclick="navigate('https://reddit.com')">🤖 Reddit</span>
  </div>

  <!-- Dropdowns (outside header to avoid clipping) -->
  <div class="dropdown" id="bookmarksDropdown"></div>
  <div class="dropdown" id="historyDropdown"></div>

  <!-- Content area -->
  <div class="content" id="content"></div>

  <!-- Keyboard shortcuts modal -->
  <div class="modal-overlay" id="shortcutsModal">
    <div class="modal-box">
      <div class="modal-header">
        <span style="font-size:20px">⌨️</span>
        <div class="modal-title">Keyboard Shortcuts</div>
        <button class="modal-close-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-search">
        <input type="text" id="shortcutSearch" placeholder="Search shortcuts…" oninput="filterShortcuts()">
      </div>
      <div class="modal-body" id="shortcutsList"></div>
    </div>
  </div>

  <!-- Ad block toast -->
  <div class="block-toast" id="blockToast">
    <div class="block-toast-dot"></div>
    <span id="blockToastMsg">Ad blocked</span>
  </div>

<script>
'use strict';

// ════════════════════════════════════════════════════
//  AD BLOCKER LISTS
// ════════════════════════════════════════════════════
const DEFAULT_BLOCKLIST = [
  'doubleclick.net','googlesyndication.com','googletagmanager.com','googletagservices.com',
  'googleadservices.com','adnxs.com','adsrvr.org','casalemedia.com','rubiconproject.com',
  'pubmatic.com','openx.net','criteo.com','taboola.com','outbrain.com','revcontent.com',
  'advertising.com','adfox.ru','moatads.com','scorecardresearch.com','quantserve.com',
  'chartbeat.com','hotjar.com','optimizely.com','mouseflow.com','fullstory.com',
  'analytics.google.com','facebook.net','connect.facebook.net','amazon-adsystem.com',
  'ads.yahoo.com','syndication.twitter.com','static.ads-twitter.com','ads.linkedin.com',
  'bat.bing.com','t.co','pixel.quantserve.com','ib.adnxs.com','ads.pubmatic.com',
  'prebid.org','yieldmo.com','appnexus.com','adroll.com','bluekai.com','mathtag.com',
  'demdex.net','exelator.com','adsymptotic.com','adzerk.net','bidswitch.net',
];

let adBlockEnabled = localStorage.getItem('spl_adb_enabled') !== 'false';
let adBlockList    = JSON.parse(localStorage.getItem('spl_adb_list') || 'null') || DEFAULT_BLOCKLIST;
let blockedCount   = 0;
let sessionBlockCount = 0;

function isBlocked(url) {
  if (!adBlockEnabled) return false;
  try {
    const host = new URL(url).hostname.toLowerCase().replace(/^www\./, '');
    return adBlockList.some(d => host === d || host.endsWith('.' + d));
  } catch(e) { return false; }
}

function updateBlockBadge() {
  const el = document.getElementById('blockCount');
  const btn = document.getElementById('adBlockBtn');
  btn.className = 'adblocker-btn ' + (adBlockEnabled ? 'enabled' : 'disabled-state');
  if (adBlockEnabled && sessionBlockCount > 0) {
    el.style.display = '';
    el.textContent = sessionBlockCount > 99 ? '99+' : sessionBlockCount;
  } else {
    el.style.display = 'none';
  }
}

function showBlockToast(domain) {
  const el = document.getElementById('blockToast');
  document.getElementById('blockToastMsg').textContent = 'Blocked: ' + domain;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

document.getElementById('adBlockBtn').onclick = (e) => {
  e.stopPropagation();
  adBlockEnabled = !adBlockEnabled;
  localStorage.setItem('spl_adb_enabled', adBlockEnabled);
  sessionBlockCount = 0;
  updateBlockBadge();
};

// ════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════
// Only use a user-configured ScramJet URL — no public fallbacks (they block iframing)
function getSjUrl() { return (localStorage.getItem('spl_sj_app') || '').trim().replace(/\/$/, ''); }
let sjUrlIndex = 0;

let tabs        = [];
let activeId    = 0;
let tabCounter  = 0;
let isCollapsed = false;
let settingsPage = null;
let globalHistory = JSON.parse(sessionStorage.getItem('spl_hist') || '[]');

const $ = id => document.getElementById(id);
const header     = $('header');
const tabBar     = $('tabBar');
const content    = $('content');
const urlInput   = $('urlInput');
const loadingBar = $('loadingBar');
const backBtn    = $('backBtn');
const fwdBtn     = $('fwdBtn');
const menuDD     = $('menuDropdown');
const bmDD       = $('bookmarksDropdown');
const histDD     = $('historyDropdown');

function getTab(id) { return tabs.find(t => t.id === id); }
function activeTab() { return getTab(activeId); }

// ════════════════════════════════════════════════════
//  HEADER TOGGLE
// ════════════════════════════════════════════════════
$('toggleBtn').onclick = toggleHeader;
function toggleHeader() {
  isCollapsed = !isCollapsed;
  header.classList.toggle('collapsed', isCollapsed);
  $('toggleBtn').textContent = isCollapsed ? '▼' : '▲';
  $('toggleBtn').classList.toggle('collapsed', isCollapsed);
  if (isCollapsed) {
    header.style.marginBottom = '-' + header.offsetHeight + 'px';
  } else {
    header.style.marginBottom = '0';
  }
}

// ════════════════════════════════════════════════════
//  PAGES
// ════════════════════════════════════════════════════
function showPage(id) {
  content.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  const p = content.querySelector('[data-page="' + id + '"]');
  if (p) p.classList.remove('hidden');
}

function ensureSettingsPage() {
  if (settingsPage) return settingsPage;
  const div = document.createElement('div');
  div.className = 'page settings-page';
  div.setAttribute('data-page', 'settings');
  div.innerHTML = buildSettingsHTML();
  content.appendChild(div);
  settingsPage = div;
  initSettingsListeners(div);
  return div;
}

// ════════════════════════════════════════════════════
//  TAB MANAGEMENT
// ════════════════════════════════════════════════════
function updateNavBtns() {
  const t = activeTab();
  const canBack = t && t.type === 'direct' && t.histIdx > 0;
  const canFwd  = t && t.type === 'direct' && t.histIdx < (t.history||[]).length - 1;
  backBtn.classList.toggle('disabled', !canBack);
  fwdBtn.classList.toggle('disabled',  !canFwd);
}

function updateUrlBar() {
  const t = activeTab();
  const badge    = $('urlBadge');
  const security = $('urlSecurity');

  if (!t || t.type === 'ntp') {
    urlInput.value = '';
    badge.style.display = 'none';
    security.textContent = '🌐';
    return;
  }
  if (t.type === 'settings') {
    urlInput.value = 'serverplex://settings';
    badge.style.display = 'none';
    security.textContent = '⚙️';
    return;
  }

  urlInput.value = t.url || '';

  // Security icon
  if (t.url && t.url.startsWith('https://')) {
    security.textContent = '🔒';
    security.title = 'Secure (HTTPS)';
  } else if (t.url && t.url.startsWith('http://')) {
    security.textContent = '⚠️';
    security.title = 'Not secure (HTTP)';
  } else {
    security.textContent = '🌐';
    security.title = '';
  }

  if (t.type === 'direct') {
    badge.className = 'url-badge direct'; badge.textContent = 'DIRECT'; badge.style.display = '';
  } else if (t.type === 'scramjet') {
    badge.className = 'url-badge proxied'; badge.textContent = 'PROXY'; badge.style.display = '';
  } else {
    badge.style.display = 'none';
  }
}

function saveTabs() {
  try {
    sessionStorage.setItem('spl_tabs', JSON.stringify(tabs.map(t => ({
      id:t.id, type:t.type, url:t.url, title:t.title,
      history:t.history||[], histIdx:t.histIdx||0, pinned:!!t.pinned
    }))));
    sessionStorage.setItem('spl_active', activeId);
    sessionStorage.setItem('spl_ctr', tabCounter);
  } catch(e) {}
}

function renderTabs() {
  tabBar.querySelectorAll('.tab').forEach(el => el.remove());
  tabs.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tab' + (t.id === activeId ? ' active' : '') + (t.pinned ? ' pinned' : '') + (t.type === 'settings' ? ' settings-tab' : '');
    el.dataset.id = t.id;
    const icon = t.type === 'settings' ? '⚙️' : t.type === 'ntp' ? '🏠' : '🌐';
    const titleText = t.pinned ? '' : (t.title || 'New Tab');
    el.innerHTML = `<span class="tab-favicon">${icon}</span>
      <span class="tab-title" title="${t.title||''}">${titleText}</span>
      ${!t.pinned ? '<span class="tab-close" title="Close (Ctrl+W)">✕</span>' : ''}`;
    el.querySelector('.tab-close')?.addEventListener('click', e => { e.stopPropagation(); closeTab(t.id); });
    el.addEventListener('click', e => { if (!e.target.classList.contains('tab-close')) switchTab(t.id); });
    // Middle-click to close
    el.addEventListener('auxclick', e => { if (e.button === 2) closeTab(t.id); });
    tabBar.insertBefore(el, $('newTabBtn'));
  });
  saveTabs();
}

function switchTab(id) {
  activeId = id;
  const t = activeTab();
  if (!t) return;
  if (t.type === 'settings') {
    ensureSettingsPage();
    showPage('settings');
  } else {
    showPage('tab-' + id);
  }
  updateNavBtns();
  updateUrlBar();
  renderTabs();
}

function createTab(url) {
  const id = tabCounter++;
  const t = { id, type:'ntp', url:'', title:'New Tab', history:[], histIdx:-1, pinned:false };
  tabs.push(t);
  activeId = id;
  const div = document.createElement('div');
  div.className = 'page';
  div.setAttribute('data-page', 'tab-' + id);
  content.appendChild(div);
  renderTabs();
  if (url) { loadUrl(url); }
  else { showNTP(div, t); switchTab(id); }
  return t;
}

function closeTab(id) {
  if (tabs.length === 1) { createTab(); }
  const idx = tabs.findIndex(t => t.id === id);
  const page = content.querySelector('[data-page="tab-' + id + '"]');
  if (page) page.remove();
  tabs.splice(idx, 1);
  if (tabs.length === 0) { createTab(); return; }
  if (activeId === id) {
    activeId = tabs[Math.max(0, idx - 1)].id;
    switchTab(activeId);
  } else renderTabs();
}

function pinTab(id) {
  const t = getTab(id || activeId);
  if (!t) return;
  t.pinned = !t.pinned;
  // Move pinned tabs to front
  tabs.sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0));
  renderTabs();
}

function duplicateTab(id) {
  const t = getTab(id || activeId);
  if (!t || !t.url) { createTab(); return; }
  createTab(t.url);
}

function closeOtherTabs(id) {
  const keep = id || activeId;
  [...tabs].forEach(t => { if (t.id !== keep) closeTab(t.id); });
}

// ════════════════════════════════════════════════════
//  NEW TAB PAGE
// ════════════════════════════════════════════════════
const QUICK_TILES = [
  {icon:'🔍', label:'Google',    url:'https://google.com'},
  {icon:'▶️', label:'YouTube',   url:'https://youtube.com'},
  {icon:'💻', label:'GitHub',    url:'https://github.com'},
  {icon:'📖', label:'Wikipedia', url:'https://wikipedia.org'},
  {icon:'🤖', label:'Reddit',    url:'https://reddit.com'},
];

function getGreeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  return 'Good evening';
}

function showNTP(container, t) {
  t.type = 'ntp'; t.url = ''; t.title = 'New Tab';
  const userName = localStorage.getItem('eclipseos_username') || localStorage.getItem('serverplex_username') || '';

  const recentHist = globalHistory.slice(0, 4);
  const histHTML = recentHist.length ? recentHist.map(h => {
    const ago = h.ts ? timeAgo(h.ts) : '';
    return `<div class="ntp-hist-item" onclick="navigate('${h.url.replace(/'/g,"\\'")}')">
      🕐 <span class="ntp-hist-item-url">${h.url}</span>
      ${ago ? `<span class="ntp-hist-item-time">${ago}</span>` : ''}
    </div>`;
  }).join('') : '<div style="font-size:12px;color:var(--text3);padding:8px 12px;">No recent history</div>';

  container.innerHTML = `<div class="ntp">
    <div class="ntp-greeting">${getGreeting()}${userName ? ', ' + userName : ''}</div>
    <div class="ntp-time" id="ntpClock">--:--</div>
    <div class="ntp-date" id="ntpDate"></div>
    <div class="ntp-search-wrap">
      <select class="ntp-engine" id="ntpEngine">
        <option value="https://google.com/search?q=" ${(localStorage.getItem('spl_engine')||'google')==='google'?'selected':''}>Google</option>
        <option value="https://duckduckgo.com/?q=" ${(localStorage.getItem('spl_engine')||'')==='ddg'?'selected':''}>DuckDuckGo</option>
        <option value="https://www.bing.com/search?q=" ${(localStorage.getItem('spl_engine')||'')==='bing'?'selected':''}>Bing</option>
        <option value="https://search.brave.com/search?q=" ${(localStorage.getItem('spl_engine')||'')==='brave'?'selected':''}>Brave</option>
      </select>
      <input class="ntp-input" id="ntpQ" placeholder="Search the web or enter a URL…" autocomplete="off" spellcheck="false">
      <button class="ntp-go" id="ntpGo">Go →</button>
    </div>
    <div class="ntp-tiles-label">Quick Access</div>
    <div class="ntp-tiles">
      ${QUICK_TILES.map(tile => `
        <div class="ntp-tile" onclick="navigate('${tile.url}')">
          <div class="ntp-tile-icon">${tile.icon}</div>
          <div>${tile.label}</div>
        </div>`).join('')}
    </div>
    <div class="ntp-hist-label">Recent History</div>
    <div class="ntp-hist-row">${histHTML}</div>
  </div>`;

  // Clock
  function tickNTP() {
    const now  = new Date();
    const fmt  = localStorage.getItem('spl_clock_fmt') || localStorage.getItem('eclipseos_clock_format') || '12';
    let h = now.getHours(), m = String(now.getMinutes()).padStart(2,'0'), timeStr;
    if (fmt === '24') {
      timeStr = String(h).padStart(2,'0') + ':' + m;
    } else {
      const ap = h >= 12 ? 'PM' : 'AM'; h = h%12||12;
      timeStr = h + ':' + m + ' ' + ap;
    }
    const cl = container.querySelector('#ntpClock');
    const dl = container.querySelector('#ntpDate');
    if (cl) cl.textContent = timeStr;
    if (dl) {
      const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      dl.textContent = days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate() + ' ' + now.getFullYear();
    }
  }
  tickNTP();
  const ntpTick = setInterval(() => {
    if (!document.contains(container)) { clearInterval(ntpTick); return; }
    tickNTP();
  }, 1000);

  const ntpQ = container.querySelector('#ntpQ');
  const ntpEngine = container.querySelector('#ntpEngine');
  container.querySelector('#ntpGo').onclick = () => doNTPSearch();
  ntpQ.onkeydown = e => { if (e.key === 'Enter') doNTPSearch(); };
  ntpEngine.onchange = () => {
    const map = {
      'https://google.com/search?q=':'google',
      'https://duckduckgo.com/?q=':'ddg',
      'https://www.bing.com/search?q=':'bing',
      'https://search.brave.com/search?q=':'brave',
    };
    localStorage.setItem('spl_engine', map[ntpEngine.value] || 'google');
  };
  function doNTPSearch() {
    const q = ntpQ.value.trim();
    if (!q) return;
    if (q.includes('.') && !q.includes(' ') && !q.startsWith('http')) {
      navigate('https://' + q);
    } else if (/^https?:\/\//.test(q)) {
      navigate(q);
    } else {
      navigate(ntpEngine.value + encodeURIComponent(q));
    }
  }
  setTimeout(() => ntpQ.focus(), 100);
  updateUrlBar();
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000)   return 'just now';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
  if (diff < 86400000)return Math.floor(diff/3600000) + 'h ago';
  return Math.floor(diff/86400000) + 'd ago';
}

// ════════════════════════════════════════════════════
//  NAVIGATE
// ════════════════════════════════════════════════════
function navigate(raw) {
  if (!raw) return;
  let url = raw.trim();
  if (!url.includes('.') || url.includes(' ')) {
    const eng = localStorage.getItem('spl_engine') || 'google';
    const engines = {
      google:'https://google.com/search?q=', ddg:'https://duckduckgo.com/?q=',
      bing:'https://www.bing.com/search?q=', brave:'https://search.brave.com/search?q=',
    };
    url = (engines[eng]||engines.google) + encodeURIComponent(url);
  } else if (!/^https?:\/\//i.test(url)) {
    url = 'https://' + url;
  }
  loadUrl(url);
}

function loadUrl(url) {
  const t = activeTab(); if (!t) return;
  if (isBlocked(url)) {
    try {
      const host = new URL(url).hostname;
      sessionBlockCount++;
      updateBlockBadge();
      showBlockToast(host);
    } catch(e) {}
    return;
  }

  t.url = url;
  t.history = (t.history || []).slice(0, (t.histIdx||0) + 1);
  t.history.push(url);
  t.histIdx = t.history.length - 1;

  // History entry
  try {
    const hostname = new URL(url).hostname.replace('www.','');
    globalHistory.unshift({ url, title: hostname, ts: Date.now() });
    if (globalHistory.length > 500) globalHistory.pop();
    sessionStorage.setItem('spl_hist', JSON.stringify(globalHistory));
  } catch(e) {}

  try { t.title = new URL(url).hostname.replace('www.','') || url; } catch(e) { t.title = url; }

  const container = content.querySelector('[data-page="tab-' + t.id + '"]');
  if (!container) return;

  const isLocal = /^(os-apps|browser|settings\/|\.\/|serverplex-)/.test(url);
  if (isLocal) {
    t.type = 'direct';
    loadDirectIframe(container, t, url);
  } else {
    const sjUrl = getSjUrl();
    if (sjUrl) {
      t.type = 'scramjet';
      loadScramjetFrame(container, t, url);
    } else {
      // No proxy configured — show helpful setup screen
      t.type = 'noproxy';
      showNoProxyScreen(container, url);
    }
  }

  showPage('tab-' + t.id);
  updateNavBtns();
  updateUrlBar();
  renderTabs();
}

function loadDirectIframe(container, t, url) {
  loadingBar.classList.add('active');
  container.innerHTML = '';
  const iframe = document.createElement('iframe');
  iframe.className = 'direct-iframe';
  iframe.src = url;
  if (!/^(os-apps|browser|settings\/)/.test(url)) {
    iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-forms allow-modals allow-presentation allow-downloads allow-top-navigation-by-user-activation');
    iframe.setAttribute('allow', 'autoplay; fullscreen');
  }
  iframe.onload = () => {
    iframe.classList.add('loaded');
    loadingBar.classList.remove('active');
    try {
      iframe.contentWindow.open = (u) => { if(u) createTab(u); return null; };
    } catch(e) {}
  };
  iframe.onerror = () => loadingBar.classList.remove('active');
  container.appendChild(iframe);
  setTimeout(() => loadingBar.classList.remove('active'), 8000);
}

function showNoProxyScreen(container, originalUrl) {
  loadingBar.classList.remove('active');
  container.innerHTML = `<div class="ext-page">
    <div class="ext-icon">🔒</div>

    <div class="ext-url">${originalUrl}</div>

function openSettings() {
  const existing = tabs.find(t => t.type === 'settings');
  if (existing) { switchTab(existing.id); return; }
  const id = tabCounter++;
  const t = { id, type:'settings', url:'serverplex://settings', title:'Settings', history:[], histIdx:-1, pinned:false };
  tabs.push(t);
  activeId = id;
  ensureSettingsPage();
  renderTabs();
  switchTab(id);
}

function loadScramjetFrame(container, t, originalUrl) {
  const sjBase = getSjUrl();
  if (!sjBase) { showNoProxyScreen(container, originalUrl); return; }
  loadingBar.classList.add('active');
  container.innerHTML = '';
  const iframe = document.createElement('iframe');
  iframe.className = 'direct-iframe';
  iframe.setAttribute('allow', 'autoplay; fullscreen; clipboard-read; clipboard-write');
  iframe.src = sjBase + '/?url=' + encodeURIComponent(originalUrl);
  iframe.onload = () => { iframe.classList.add('loaded'); loadingBar.classList.remove('active'); };
  iframe.onerror = () => {
    loadingBar.classList.remove('active');
    showNoProxyScreen(container, originalUrl);
  };
  container.appendChild(iframe);
  // If it doesn't load in 10s, assume blocked
  setTimeout(() => {
    if (!iframe.classList.contains('loaded')) {
      loadingBar.classList.remove('active');
    }
  }, 10000);
}

function showNTPCurrent() {
  const t = activeTab(); if (!t) return;
  const container = content.querySelector('[data-page="tab-' + t.id + '"]');
  if (container) showNTP(container, t);
  switchTab(t.id);
}

function getBookmarks() { return JSON.parse(localStorage.getItem('spl_bookmarks') || '[]'); }
function saveBookmarks(bm) { localStorage.setItem('spl_bookmarks', JSON.stringify(bm)); }

function addBookmark() {
  const t = activeTab();
  if (!t || !t.url) return;
  const bm = getBookmarks();
  if (bm.find(b => b.url === t.url)) { showBlockToast('Already bookmarked!'); return; }
  bm.unshift({ id:Date.now(), url:t.url, title:t.title||t.url });
  saveBookmarks(bm);
  showBlockToast('Bookmarked!');
  refreshBookmarksBar();
}

function refreshBookmarksBar() {
  const bar = $('bookmarksBar');
  const bm = getBookmarks();
  // Keep static ones + user bookmarks
  const statics = bar.querySelectorAll('[data-static]');
  bar.querySelectorAll('[data-bm]').forEach(el => el.remove());
  bm.slice(0,8).forEach(b => {
    const el = document.createElement('span');
    el.className = 'bm-item'; el.dataset.bm = b.id;
    el.title = b.url;
    el.textContent = '🔖 ' + (b.title || b.url).slice(0,20);
    el.onclick = () => navigate(b.url);
    bar.appendChild(el);
  });
}

function positionDropdown(el, refEl) {
  const r = refEl ? refEl.getBoundingClientRect() : header.getBoundingClientRect();
  el.style.top  = (r.bottom + 4) + 'px';
  el.style.left = '10px';
  el.style.right = '10px';
  el.style.maxWidth = '400px';
}

function showBookmarksDD() {
  closeAllDD();
  positionDropdown(bmDD);
  const bm = getBookmarks();
  bmDD.innerHTML = '<div class="dd-header">Bookmarks</div>' + (bm.length
    ? bm.map(b => `<div class="dd-item" data-url="${b.url}">🔖 <div style="flex:1;min-width:0"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${b.title}</div><div class="dd-sub" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${b.url}</div></div><span style="color:var(--red);padding:2px 6px;flex-shrink:0;border-radius:4px" data-del="${b.id}">✕</span></div>`).join('')
    : '<div class="dd-item" style="pointer-events:none;color:var(--text3)">No bookmarks yet</div>');
  bmDD.classList.add('open');
  bmDD.onclick = e => {
    const del = e.target.closest('[data-del]');
    if (del) { saveBookmarks(getBookmarks().filter(b=>b.id!=del.dataset.del)); showBookmarksDD(); return; }
    const item = e.target.closest('[data-url]');
    if (item) { navigate(item.dataset.url); closeAllDD(); }
  };
}

function showHistoryDD() {
  closeAllDD();
  positionDropdown(histDD);
  histDD.innerHTML = globalHistory.length
    ? `<div class="dd-header" style="display:flex;align-items:center;justify-content:space-between">History<span style="cursor:pointer;color:var(--red);font-weight:700" onclick="clearHistory()">Clear All</span></div>` +
      globalHistory.slice(0,40).map(h => `<div class="dd-item" data-url="${h.url}">🕐 <div style="flex:1;min-width:0"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.title||h.url}</div><div class="dd-sub" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.url}</div></div>${h.ts?`<span class="dd-sub" style="flex-shrink:0">${timeAgo(h.ts)}</span>`:''}</div>`).join('')
    : '<div class="dd-item" style="pointer-events:none;color:var(--text3)">No history yet</div>';
  histDD.classList.add('open');
  histDD.onclick = e => {
    const item = e.target.closest('[data-url]');
    if (item) { navigate(item.dataset.url); closeAllDD(); }
  };
}

function clearHistory() {
  globalHistory = []; sessionStorage.removeItem('spl_hist'); closeAllDD();
  showBlockToast('History cleared');
}

function closeAllDD() {
  [menuDD, bmDD, histDD].forEach(d => d.classList.remove('open'));
}

function switchSettingsTab(btn, panel) {

}

function initSettingsListeners(div) {}

function toggleSetting(toggleId, storageKey, cb) {
  const btn = document.getElementById(toggleId);
  const on  = !btn.classList.contains('on');
  btn.classList.toggle('on', on);
  localStorage.setItem(storageKey, on);
  if (cb) cb();
}
function saveEngine() { localStorage.setItem('spl_engine', document.getElementById('s-engine').value); }
function saveClockFmt() { localStorage.setItem('spl_clock_fmt', document.getElementById('s-clockfmt').value); }

function resetBlockList() {

function clearHistorySettings() {

function clearBookmarks() {

function resetAll() {
  if (!confirm('Reset all browser settings to defaults?')) return;
  ['spl_engine','spl_clock_fmt','spl_bkbar','spl_dnt','spl_clearonclose','spl_sj_app','spl_proxy_mode','spl_adb_enabled','spl_adb_list'].forEach(k=>localStorage.removeItem(k));
  showBlockToast('Settings reset — reload to apply');

function exportData() {
  const data = {
    exported: new Date().toISOString(), version:2, browser:'ServerplexOS',
    settings: { engine: localStorage.getItem('spl_engine'), sj_app: localStorage.getItem('spl_sj_app'), proxy_mode: localStorage.getItem('spl_proxy_mode') },
    bookmarks: getBookmarks(), history: globalHistory,
  };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:'serverplex-browser-data.json'});
  a.click(); URL.revokeObjectURL(a.href);
}
function importData() {
  const input = Object.assign(document.createElement('input'),{type:'file',accept:'.json'});
  input.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if (d.settings) {
          if (d.settings.engine)     localStorage.setItem('spl_engine', d.settings.engine);
          if (d.settings.sj_app)     localStorage.setItem('spl_sj_app', d.settings.sj_app);
          if (d.settings.proxy_mode) localStorage.setItem('spl_proxy_mode', d.settings.proxy_mode);
        }
        if (d.bookmarks) saveBookmarks(d.bookmarks);
        if (d.history)   { globalHistory = d.history; sessionStorage.setItem('spl_hist', JSON.stringify(globalHistory)); }
        showBlockToast('Data imported successfully');
      } catch(e) { alert('Invalid file — could not import.'); }
    };
    r.readAsText(file);
  };
  input.click();
}

// ════════════════════════════════════════════════════
//  EVENTS
// ════════════════════════════════════════════════════
$('newTabBtn').onclick = () => createTab();
$('homeBtn').onclick   = () => showNTPCurrent();

$('refreshBtn').onclick = () => {
  const t = activeTab();
  if (!t || !t.url) return;
  const c = content.querySelector('[data-page="tab-' + t.id + '"]');
  if (c) loadDirectIframe(c, t, t.url);
};

backBtn.onclick = () => {
  const t = activeTab();
  if (!t || t.histIdx <= 0) return;
  t.histIdx--;
  const url = t.history[t.histIdx]; t.url = url;
  const c = content.querySelector('[data-page="tab-' + t.id + '"]');
  if (c) loadDirectIframe(c, t, url);
  updateNavBtns(); updateUrlBar();
};

fwdBtn.onclick = () => {
  const t = activeTab();
  if (!t || t.histIdx >= (t.history||[]).length - 1) return;
  t.histIdx++;
  const url = t.history[t.histIdx]; t.url = url;
  const c = content.querySelector('[data-page="tab-' + t.id + '"]');
  if (c) loadDirectIframe(c, t, url);
  updateNavBtns(); updateUrlBar();
};

urlInput.onkeydown = e => {
  if (e.key === 'Enter') { navigate(urlInput.value.trim()); closeAllDD(); urlInput.blur(); }
  if (e.key === 'Escape') { urlInput.blur(); updateUrlBar(); }
};
urlInput.onfocus = () => { urlInput.select(); };

$('menuBtn').onclick = e => {
  e.stopPropagation();
  const open = menuDD.classList.contains('open');
  closeAllDD();
  if (!open) menuDD.classList.add('open');
};

$('ddBookmark').onclick  = () => { addBookmark(); closeAllDD(); };
$('ddBookmarks').onclick = () => showBookmarksDD();
$('ddHistory').onclick   = () => showHistoryDD();
$('ddShortcuts').onclick = () => { closeAllDD(); openShortcutsModal(); };
$('ddPinTab').onclick    = () => { pinTab(activeId); closeAllDD(); };
$('ddDuplicate').onclick = () => { duplicateTab(activeId); closeAllDD(); };
$('ddCloseOthers').onclick = () => { closeOtherTabs(activeId); closeAllDD(); };

$('ddSettings').onclick  = () => {
  closeAllDD();
  const existing = tabs.find(t => t.type === 'settings');
  if (existing) { switchTab(existing.id); return; }
  const id = tabCounter++;
  const t = { id, type:'settings', url:'serverplex://settings', title:'Settings', history:[], histIdx:-1, pinned:false };
  tabs.push(t);
  activeId = id;
  ensureSettingsPage();
  renderTabs();
  switchTab(id);
};

$('shortcutsModal').onclick = e => { if (e.target === $('shortcutsModal')) closeModal(); };

document.addEventListener('click', e => {
  if (!e.target.closest('#menuBtn') && !e.target.closest('#bookmarksDropdown') && !e.target.closest('#historyDropdown')) closeAllDD();
});

// ════════════════════════════════════════════════════
//  KEYBOARD SHORTCUTS
// ════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;
  const inInput = tag === 'INPUT' || tag === 'TEXTAREA';

  if (e.key === '?' && !inInput) { openShortcutsModal(); return; }
  if (e.key === 'Escape') { closeModal(); closeAllDD(); return; }

  if (e.ctrlKey) {
    switch(e.key.toLowerCase()) {
      case 't': e.preventDefault(); createTab(); break;
      case 'w': e.preventDefault(); closeTab(activeId); break;
      case 'r': e.preventDefault();
        const t = activeTab();
        if (t && t.url) { const c = content.querySelector('[data-page="tab-'+t.id+'"]'); if(c) loadDirectIframe(c,t,t.url); }
        break;
      case 'l': e.preventDefault(); urlInput.focus(); urlInput.select(); break;
      case 'd': e.preventDefault(); addBookmark(); break;
      case 'h': e.preventDefault(); showHistoryDD(); break;
    }
    if (e.shiftKey) {
      switch(e.key.toLowerCase()) {
        case 'a': e.preventDefault(); adBlockEnabled=!adBlockEnabled; localStorage.setItem('spl_adb_enabled',adBlockEnabled); sessionBlockCount=0; updateBlockBadge(); break;
        case 's': e.preventDefault(); $('ddSettings').onclick(); break;
        case 'd': e.preventDefault(); duplicateTab(activeId); break;
      }
    }
  }
  if (e.altKey) {
    switch(e.key) {
      case 'h': case 'H': e.preventDefault(); toggleHeader(); break;
      case 'ArrowLeft':   e.preventDefault(); backBtn.onclick(); break;
      case 'ArrowRight':  e.preventDefault(); fwdBtn.onclick(); break;
      case 'Home':        e.preventDefault(); showNTPCurrent(); break;
      case 'm': case 'M': e.preventDefault(); menuDD.classList.toggle('open'); break;
    }
  }
});

// ════════════════════════════════════════════════════
//  RESTORE / INIT
// ════════════════════════════════════════════════════
function restoreTabs() {
  try {
    const saved = JSON.parse(sessionStorage.getItem('spl_tabs') || '[]');
    if (!saved.length) return false;
    tabCounter = parseInt(sessionStorage.getItem('spl_ctr') || '0');
    activeId   = parseInt(sessionStorage.getItem('spl_active') || '0');
    saved.forEach(t => {
      tabs.push({ ...t });
      if (t.type !== 'settings') {
        const div = document.createElement('div');
        div.className = 'page hidden';
        div.setAttribute('data-page', 'tab-' + t.id);
        if (t.type === 'direct' && t.url) {
          loadDirectIframe(div, t, t.url);
        } else if ((t.type === 'scramjet' || t.type === 'noproxy') && t.url) {
          const sjUrl = getSjUrl();
          if (sjUrl) { loadScramjetFrame(div, t, t.url); }
          else { showNoProxyScreen(div, t.url); }
        } else {
          showNTP(div, t);
        }
        content.appendChild(div);
      }
    });
    renderTabs(); switchTab(activeId);
    return true;
  } catch(e) { return false; }
}

// Apply bookmarks bar visibility
if (localStorage.getItem('spl_bkbar') === 'false') {
  document.querySelector('.bookmarks-bar').style.display = 'none';
}

// Clear on close if set
window.addEventListener('beforeunload', () => {
  if (localStorage.getItem('spl_clearonclose') === 'true') {
    globalHistory = []; sessionStorage.removeItem('spl_hist');
  }
});

updateBlockBadge();
if (!restoreTabs()) createTab();
</script>
</body>
