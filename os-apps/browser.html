<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>ServerplexOS Browser — Maintenance</title>
	<style>
		body {
			margin: 0;
			background: #000;
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			font-family: "Segoe UI", sans-serif;
			color: #e5e5e5;
			overflow: hidden;
		}

		.panel {
			width: 600px;
			padding: 40px;
			background: rgba(0, 0, 0, 0.65);
			border: 1px solid rgba(0, 150, 255, 0.25);
			border-radius: 18px;
			backdrop-filter: blur(18px);
			text-align: center;
			box-shadow: 0 0 40px rgba(0, 150, 255, 0.25);
		}

		.title {
			font-size: 34px;
			font-weight: 600;
			color: #4da3ff;
			text-shadow: 0 0 12px rgba(77, 163, 255, 0.6);
			margin-bottom: 12px;
		}

		.text {
			font-size: 18px;
			opacity: 0.85;
			line-height: 1.6;
		}

		.footer {
			margin-top: 30px;
			opacity: 0.45;
			font-size: 14px;
		}
	</style>
</head>

<body>

	<div class="panel">
		<div class="title">ServerplexOS Browser</div>
		<div class="text">
			This system component is currently undergoing maintenance.<br>
    Some features may be temporarily unavailable.
  </div>
			<div class="footer">Thank you for your patience.</div>
		</div>

</body>

</html>
