<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Oxanium',sans-serif;background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.calc{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.mode-row{display:flex;gap:6px;margin-bottom:14px}
.mode-btn{flex:1;padding:7px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;color:var(--text3);font-family:'Oxanium',sans-serif;font-size:12px;cursor:pointer;transition:all 0.2s}
.mode-btn.active{background:var(--accent);color:white;border-color:var(--accent)}
.display{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;min-height:90px;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:4px}
.display-expr{font-size:13px;color:var(--text3);min-height:18px;word-break:break-all;text-align:right}
.display-val{font-size:36px;font-weight:700;color:var(--text);word-break:break-all;text-align:right}
.history-btn{font-size:11px;color:var(--text3);cursor:pointer;text-align:right;margin-bottom:8px}
.history-btn:hover{color:#4db8ff}
.history-panel{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:10px;max-height:100px;overflow-y:auto;display:none}
.history-item{font-size:12px;color:var(--text3);padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer}
.history-item:hover{color:var(--text)}
.history-item:last-child{border-bottom:none}
.sci-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn{padding:0;height:56px;border:none;border-radius:10px;font-family:'Oxanium',sans-serif;font-size:16px;font-weight:600;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center}
.btn:active{transform:scale(0.94)}
.btn-num{background:var(--bg2);color:var(--text)}
.btn-num:hover{background:var(--bg2)}
.btn-op{background:var(--accent);color:white}
.btn-op:hover{background:var(--accent-bright, #0090ff)}
.btn-eq{background:#238636;color:white}
.btn-eq:hover{background:#2ea043}
.btn-clear{background:#da3633;color:white}
.btn-clear:hover{background:#f85149}
.btn-fn{background:var(--surface);color:#79c0ff;border:1px solid var(--border);font-size:12px}
.btn-fn:hover{background:var(--bg2)}
.btn-span2{grid-column:span 2}
.sci-panel{display:none}
.sci-panel.show{display:block}

/* ── ServerplexOS Theme System ── */
:root { --accent: #0078d4; }
body {
  --bg:      #f0f2f5;
  --bg2:     #e4e7ed;
  --surface: #ffffff;
  --surface2:#f0f2f5;
  --text:    #0d0f14;
  --text2:   #55606e;
  --text3:   #8a95a3;
  --border:  rgba(0,0,0,0.09);
  --border2: rgba(0,0,0,0.14);
  --shadow:  0 4px 20px rgba(0,0,0,.10);
}
body.dark {
  --bg:      #060811;
  --bg2:     #111420;
  --surface: #12151f;
  --surface2:#1a1e2e;
  --text:    var(--text);
  --text2:   #8b97b0;
  --text3:   #5a6478;
  --border:  var(--border);
  --border2: var(--border2);
  --shadow:  0 4px 20px rgba(0,0,0,.5);
}
body.grey {
  --bg:      #3a3e4a;
  --bg2:     #4e535e;
  --surface: #484c57;
  --surface2:#545862;
  --text:    #eef0f4;
  --text2:   #b8bec8;
  --text3:   #858ea0;
  --border:  rgba(255,255,255,0.10);
  --border2: rgba(255,255,255,0.18);
  --shadow:  0 4px 20px rgba(0,0,0,.35);
}
</style>
</head>
<body>
<script>
(function(){
  var t=localStorage.getItem('serverplex_theme')||'white';
  if(t==='black')document.body.classList.add('dark');
  else if(t==='grey')document.body.classList.add('grey');
  var acc=localStorage.getItem('serverplex_accent');
  if(acc)document.documentElement.style.setProperty('--accent',acc);
})();
</script>

<div class="calc">
  <div class="mode-row">
    <button class="mode-btn active" onclick="setMode('standard')">Standard</button>
    <button class="mode-btn" onclick="setMode('scientific')">Scientific</button>
  </div>
  <div class="display">
    <div class="display-expr" id="expr"></div>
    <div class="display-val" id="val">0</div>
  </div>
  <div class="history-btn" onclick="toggleHistory()">History ▾</div>
  <div class="history-panel" id="historyPanel"></div>
  <div class="sci-panel" id="sciPanel">
    <div class="sci-grid">
      <button class="btn btn-fn" onclick="sci('sin')">sin</button>
      <button class="btn btn-fn" onclick="sci('cos')">cos</button>
      <button class="btn btn-fn" onclick="sci('tan')">tan</button>
      <button class="btn btn-fn" onclick="sci('log')">log</button>
      <button class="btn btn-fn" onclick="sci('asin')">sin⁻¹</button>
      <button class="btn btn-fn" onclick="sci('acos')">cos⁻¹</button>
      <button class="btn btn-fn" onclick="sci('atan')">tan⁻¹</button>
      <button class="btn btn-fn" onclick="sci('ln')">ln</button>
      <button class="btn btn-fn" onclick="sci('sqrt')">√x</button>
      <button class="btn btn-fn" onclick="sci('pow2')">x²</button>
      <button class="btn btn-fn" onclick="pushOp('^')">xʸ</button>
      <button class="btn btn-fn" onclick="sci('inv')">1/x</button>
      <button class="btn btn-fn" onclick="pushNum('3.14159265')">π</button>
      <button class="btn btn-fn" onclick="pushNum('2.71828182')">e</button>
      <button class="btn btn-fn" onclick="sci('abs')">|x|</button>
      <button class="btn btn-fn" onclick="sci('fact')">n!</button>
    </div>
  </div>
  <div class="grid">
    <button class="btn btn-clear" onclick="clear()">C</button>
    <button class="btn btn-fn" onclick="backspace()">⌫</button>
    <button class="btn btn-fn" onclick="toggleSign()">±</button>
    <button class="btn btn-op" onclick="pushOp('/')">÷</button>
    <button class="btn btn-num" onclick="pushNum('7')">7</button>
    <button class="btn btn-num" onclick="pushNum('8')">8</button>
    <button class="btn btn-num" onclick="pushNum('9')">9</button>
    <button class="btn btn-op" onclick="pushOp('*')">×</button>
    <button class="btn btn-num" onclick="pushNum('4')">4</button>
    <button class="btn btn-num" onclick="pushNum('5')">5</button>
    <button class="btn btn-num" onclick="pushNum('6')">6</button>
    <button class="btn btn-op" onclick="pushOp('-')">−</button>
    <button class="btn btn-num" onclick="pushNum('1')">1</button>
    <button class="btn btn-num" onclick="pushNum('2')">2</button>
    <button class="btn btn-num" onclick="pushNum('3')">3</button>
    <button class="btn btn-op" onclick="pushOp('+')">+</button>
    <button class="btn btn-num btn-span2" onclick="pushNum('0')">0</button>
    <button class="btn btn-num" onclick="pushNum('.')">.</button>
    <button class="btn btn-eq" onclick="calculate()">=</button>
  </div>
</div>
<script>
let cur='0',op=null,prev=null,waiting=false,expr='';
let history=JSON.parse(localStorage.getItem('serverplex_calc_history')||'[]');
let mode='standard';

function upd(){
  document.getElementById('val').textContent=cur.length>14?parseFloat(cur).toExponential(6):cur;
  document.getElementById('expr').textContent=expr;
}
function setMode(m){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach((b,i)=>b.classList.toggle('active',i===(m==='standard'?0:1)));
  document.getElementById('sciPanel').classList.toggle('show',m==='scientific');
}
function pushNum(n){
  if(waiting){cur=n==='.'?'0.':n;waiting=false;}
  else if(n==='.'&&cur.includes('.'))return;
  else cur=cur==='0'&&n!=='.'?n:cur+n;
  upd();
}
function pushOp(o){
  if(op&&!waiting)calculate(true);
  prev=cur;op=o;waiting=true;
  expr=prev+' '+(o==='/'?'÷':o==='*'?'×':o)+' ';
  upd();
}
function calculate(chain=false){
  if(!op||!prev)return;
  const a=parseFloat(prev),b=parseFloat(cur);
  let r;
  switch(op){
    case'+':r=a+b;break;case'-':r=a-b;break;
    case'*':r=a*b;break;case'/':r=b!==0?a/b:'Error';break;
    case'^':r=Math.pow(a,b);break;
  }
  const entry=`${prev} ${op==='/'?'÷':op==='*'?'×':op} ${cur} = ${r}`;
  if(!chain){addHistory(entry);expr=entry;}
  cur=typeof r==='number'?parseFloat(r.toFixed(10)).toString():'Error';
  op=null;prev=null;waiting=!chain;
  upd();
}
function sci(fn){
  const v=parseFloat(cur);let r;
  switch(fn){
    case'sin':r=Math.sin(v*Math.PI/180);break;
    case'cos':r=Math.cos(v*Math.PI/180);break;
    case'tan':r=Math.tan(v*Math.PI/180);break;
    case'asin':r=Math.asin(v)*180/Math.PI;break;
    case'acos':r=Math.acos(v)*180/Math.PI;break;
    case'atan':r=Math.atan(v)*180/Math.PI;break;
    case'ln':r=Math.log(v);break;
    case'log':r=Math.log10(v);break;
    case'sqrt':r=Math.sqrt(v);break;
    case'pow2':r=Math.pow(v,2);break;
    case'inv':r=1/v;break;
    case'abs':r=Math.abs(v);break;
    case'fact':r=factorial(v);break;
  }
  addHistory(`${fn}(${cur}) = ${r}`);
  cur=parseFloat(r.toFixed(10)).toString();waiting=true;upd();
}
function factorial(n){if(n<0)return NaN;if(n===0||n===1)return 1;let r=1;for(let i=2;i<=n;i++)r*=i;return r;}
function toggleSign(){cur=(parseFloat(cur)*-1).toString();upd();}
function backspace(){cur=cur.length>1?cur.slice(0,-1):'0';upd();}
function clear(){cur='0';op=null;prev=null;waiting=false;expr='';upd();}
function addHistory(e){history.unshift(e);if(history.length>50)history.pop();localStorage.setItem('serverplex_calc_history',JSON.stringify(history));}
function toggleHistory(){
  const p=document.getElementById('historyPanel');
  const show=p.style.display==='block';p.style.display=show?'none':'block';
  if(!show){p.innerHTML=history.length?history.map(h=>`<div class="history-item" onclick="useHistory('${h}')">${h}</div>`).join(''):'<div style="color:#8b949e;font-size:12px;padding:4px">No history yet</div>';}
}
function useHistory(h){const m=h.match(/= (.+)$/);if(m){cur=m[1];upd();}}
document.addEventListener('keydown',e=>{
  if(e.key>='0'&&e.key<='9')pushNum(e.key);
  if(e.key==='.')pushNum('.');
  if(e.key==='+'||e.key==='-'||e.key==='*'||e.key==='/')pushOp(e.key);
  if(e.key==='Enter'||e.key==='=')calculate();
  if(e.key==='Backspace')backspace();
  if(e.key==='Escape')clear();
});
upd();
</script>
</body>
</html>
