<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <script src="../CoreFiles/app-theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; }
    body {
      margin:0; min-width:280px; height:100vh; padding:16px;
      display:flex; align-items:center; justify-content:center;
      background:var(--app-bg); color:var(--app-text);
      font-family:'Oxanium',sans-serif;
    }
    .calculator {
      width:min(100%,360px); padding:16px;
      border:1px solid var(--app-border); border-radius:18px;
      background:var(--app-surface); box-shadow:0 18px 44px rgba(0,0,0,.24);
    }
    .display {
      height:112px; margin-bottom:14px; padding:14px;
      display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-end;
      overflow:hidden; border-radius:12px; background:var(--app-surface2);
    }
    .expression {
      width:100%; min-height:20px; color:var(--app-text2);
      font-size:13px; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .value {
      width:100%; color:var(--app-text); font-size:clamp(30px,9vw,44px);
      line-height:1.15; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      font-variant-numeric:tabular-nums;
    }
    .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    button {
      min-height:56px; border:1px solid var(--app-border); border-radius:11px;
      background:var(--app-bg); color:var(--app-text); cursor:pointer;
      font:700 18px 'Oxanium',sans-serif; transition:transform .1s,background .12s,border-color .12s;
      -webkit-tap-highlight-color:transparent;
    }
    button:hover { background:var(--app-surface2); border-color:var(--app-accent); }
    button:active { transform:scale(.96); }
    button.utility { color:var(--app-text2); font-size:15px; }
    button.operator { color:var(--app-accent); background:color-mix(in srgb,var(--app-accent) 10%,var(--app-bg)); }
    button.equals { color:#fff; background:var(--app-accent); border-color:var(--app-accent); }
    button.zero { grid-column:span 2; }
    button:focus-visible { outline:2px solid var(--app-accent); outline-offset:2px; }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <div class="display" aria-live="polite">
      <div class="expression" id="expression"></div>
      <div class="value" id="display">0</div>
    </div>
    <div class="keys">
      <button class="utility" data-action="clear" aria-label="Clear">AC</button>
      <button class="utility" data-action="sign" aria-label="Change sign">±</button>
      <button class="utility" data-action="percent" aria-label="Percent">%</button>
      <button class="operator" data-op="÷" aria-label="Divide">÷</button>
      <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button>
      <button class="operator" data-op="×" aria-label="Multiply">×</button>
      <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button>
      <button class="operator" data-op="−" aria-label="Subtract">−</button>
      <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button>
      <button class="operator" data-op="+" aria-label="Add">+</button>
      <button class="utility zero" data-action="zero">0</button><button data-action="decimal">.</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>
  <script>
    (function() {
      var display = document.getElementById('display');
      var expression = document.getElementById('expression');
      var current = '0';
      var previous = null;
      var operator = null;
      var replaceCurrent = false;
      var justEvaluated = false;

      function render() {
        display.textContent = current;
        expression.textContent = operator && previous !== null ? previous + ' ' + operator : '';
      }
      function normalize(n) {
        if (!Number.isFinite(n)) throw new Error('Invalid result');
        if (Object.is(n, -0)) n = 0;
        return String(Number(n.toPrecision(12)));
      }
      function apply(a, b, op) {
        if (op === '+') return a + b;
        if (op === '−') return a - b;
        if (op === '×') return a * b;
        if (op === '÷') {
          if (b === 0) throw new Error('Cannot divide by zero');
          return a / b;
        }
        return b;
      }
      function inputDigit(digit) {
        if (replaceCurrent || justEvaluated) {
          current = digit;
          replaceCurrent = false;
          justEvaluated = false;
        } else if (current === '0') current = digit;
        else if (current.replace('-', '').length < 14) current += digit;
        render();
      }
      function chooseOperator(next) {
        var value = Number(current);
        try {
          if (operator && !replaceCurrent) value = apply(previous, value, operator);
          current = normalize(value);
          previous = Number(current);
          operator = next;
          replaceCurrent = true;
          justEvaluated = false;
          render();
        } catch (err) {
          current = 'Error';
          previous = null;
          operator = null;
          replaceCurrent = true;
          expression.textContent = err.message;
          display.textContent = current;
        }
      }
      function equals() {
        if (!operator || previous === null) return;
        var right = Number(current);
        var left = previous;
        var op = operator;
        try {
          current = normalize(apply(left, right, op));
          expression.textContent = left + ' ' + op + ' ' + right + ' =';
          previous = null;
          operator = null;
          replaceCurrent = true;
          justEvaluated = true;
          display.textContent = current;
        } catch (err) {
          current = 'Error';
          previous = null;
          operator = null;
          replaceCurrent = true;
          expression.textContent = err.message;
          display.textContent = current;
        }
      }
      function clear() {
        current = '0'; previous = null; operator = null;
        replaceCurrent = false; justEvaluated = false;
        render();
      }
      function action(name) {
        if (name === 'clear') return clear();
        if (name === 'zero') return inputDigit('0');
        if (name === 'equals') return equals();
        if (name === 'decimal') {
          if (replaceCurrent || justEvaluated) { current = '0'; replaceCurrent = false; justEvaluated = false; }
          if (!current.includes('.')) current += '.';
          return render();
        }
        if (name === 'sign' && current !== '0' && current !== 'Error') {
          current = current.charAt(0) === '-' ? current.slice(1) : '-' + current;
          return render();
        }
        if (name === 'percent' && current !== 'Error') {
          current = normalize(Number(current) / 100);
          replaceCurrent = true;
          return render();
        }
      }

      document.querySelector('.keys').addEventListener('click', function(event) {
        var button = event.target.closest('button');
        if (!button) return;
        if (button.dataset.digit !== undefined) inputDigit(button.dataset.digit);
        else if (button.dataset.op) chooseOperator(button.dataset.op);
        else action(button.dataset.action);
      });
      document.addEventListener('keydown', function(event) {
        if (/^\d$/.test(event.key)) { inputDigit(event.key); return; }
        if (event.key === '.') { action('decimal'); return; }
        if (event.key === 'Enter' || event.key === '=') { event.preventDefault(); equals(); return; }
        if (event.key === 'Escape') { clear(); return; }
        if (event.key === 'Backspace') {
          if (!replaceCurrent && current !== 'Error') current = current.length > 1 ? current.slice(0,-1) : '0';
          render(); return;
        }
        var ops = {'+':'+','-':'−','*':'×','/':'÷'};
        if (ops[event.key]) { event.preventDefault(); chooseOperator(ops[event.key]); }
      });
      render();
    })();
  </script>
</body>
</html>
