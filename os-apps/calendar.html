<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Oxanium',sans-serif;background:#0d1117;color:#e6edf3;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{padding:16px 20px;background:#161b22;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:12px;flex-shrink:0}
.nav-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#e6edf3;padding:6px 14px;cursor:pointer;font-family:'Oxanium',sans-serif;font-size:13px;transition:all 0.2s}
.nav-btn:hover{background:rgba(255,255,255,0.12)}
.month-title{font-size:20px;font-weight:700;flex:1;text-align:center}
.today-btn{background:#0078d4;border:none;border-radius:8px;color:white;padding:6px 14px;cursor:pointer;font-family:'Oxanium',sans-serif;font-size:13px}
.view-btns{display:flex;gap:4px}
.view-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:#8b949e;padding:5px 10px;cursor:pointer;font-family:'Oxanium',sans-serif;font-size:11px}
.view-btn.active{background:#0078d4;color:white;border-color:#0078d4}
.main{flex:1;display:flex;overflow:hidden}
.cal-wrap{flex:1;padding:16px;overflow-y:auto}
.day-headers{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.day-header{text-align:center;font-size:11px;font-weight:700;letter-spacing:1px;color:#8b949e;padding:8px 0;text-transform:uppercase}
.day-header.weekend{color:#58a6ff}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day-cell{min-height:90px;background:#161b22;border:1px solid rgba(255,255,255,0.04);border-radius:8px;padding:8px;cursor:pointer;transition:all 0.15s;display:flex;flex-direction:column;gap:3px}
.day-cell:hover{background:#1f2937;border-color:rgba(255,255,255,0.12)}
.day-cell.other{opacity:0.3}
.day-cell.today{border-color:#0078d4;background:#0d2137}
.day-num{font-size:13px;font-weight:600;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.day-cell.today .day-num{background:#0078d4;color:white}
.event-dot{font-size:10px;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar{width:260px;background:#161b22;border-left:1px solid rgba(255,255,255,0.08);padding:16px;overflow-y:auto;flex-shrink:0}
.sidebar h3{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#8b949e;margin-bottom:12px}
.add-event{width:100%;padding:10px;background:#0078d4;border:none;border-radius:8px;color:white;font-family:'Oxanium',sans-serif;font-size:13px;cursor:pointer;margin-bottom:16px}
.add-event:hover{background:#0090ff}
.event-form{background:#0d1117;border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:12px;margin-bottom:16px;display:none}
.event-form input,.event-form select{width:100%;padding:7px 10px;background:#161b22;border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:#e6edf3;font-family:'Oxanium',sans-serif;font-size:12px;outline:none;margin-bottom:8px}
.event-form input::placeholder{color:#8b949e}
.form-btns{display:flex;gap:6px}
.form-btn{flex:1;padding:7px;border:none;border-radius:6px;font-family:'Oxanium',sans-serif;font-size:12px;cursor:pointer}
.form-save{background:#238636;color:white}
.form-cancel{background:#3e3e42;color:#ccc}
.upcoming-event{padding:8px;background:#0d1117;border-left:3px solid #0078d4;border-radius:0 6px 6px 0;margin-bottom:6px;font-size:12px}
.ue-title{font-weight:600;color:#e6edf3}
.ue-date{color:#8b949e;font-size:11px;margin-top:2px}
.ev-colors{display:flex;gap:6px;margin-bottom:8px}
.ev-color{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.ev-color.selected{border-color:white}
.no-events{color:#8b949e;font-size:12px;padding:8px 0}
</style>
</head>
<body>
<div class="header">
  <button class="nav-btn" onclick="changeMonth(-1)">←</button>
  <div class="month-title" id="monthTitle"></div>
  <button class="nav-btn" onclick="changeMonth(1)">→</button>
  <button class="today-btn" onclick="goToday()">Today</button>
</div>
<div class="main">
  <div class="cal-wrap">
    <div class="day-headers">
      <div class="day-header weekend">Sun</div>
      <div class="day-header">Mon</div>
      <div class="day-header">Tue</div>
      <div class="day-header">Wed</div>
      <div class="day-header">Thu</div>
      <div class="day-header">Fri</div>
      <div class="day-header weekend">Sat</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
  <div class="sidebar">
    <h3>Events</h3>
    <button class="add-event" onclick="toggleForm()">+ Add Event</button>
    <div class="event-form" id="eventForm">
      <input type="text" id="evTitle" placeholder="Event title">
      <input type="date" id="evDate">
      <input type="time" id="evTime" placeholder="Time (optional)">
      <input type="text" id="evNote" placeholder="Notes (optional)">
      <div class="ev-colors" id="evColors"></div>
      <div class="form-btns">
        <button class="form-btn form-save" onclick="saveEvent()">Save</button>
        <button class="form-btn form-cancel" onclick="toggleForm()">Cancel</button>
      </div>
    </div>
    <h3>Upcoming</h3>
    <div id="upcomingList"></div>
  </div>
</div>
<script>
const COLORS=['#0078d4','#238636','#da3633','#e3b341','#8957e5','#f78166'];
let events=JSON.parse(localStorage.getItem('eclipseos_calendar_events')||'[]');
let cur=new Date(),selColor=COLORS[0];
const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
const today=new Date();

function save(){localStorage.setItem('eclipseos_calendar_events',JSON.stringify(events));}
function dateStr(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function render(){
  document.getElementById('monthTitle').textContent=`${months[cur.getMonth()]} ${cur.getFullYear()}`;
  const grid=document.getElementById('calGrid');
  grid.innerHTML='';
  const y=cur.getFullYear(),m=cur.getMonth();
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  for(let i=first-1;i>=0;i--){
    const cell=document.createElement('div');
    cell.className='day-cell other';
    cell.innerHTML=`<div class="day-num">${prevDays-i}</div>`;
    grid.appendChild(cell);
  }
  for(let d=1;d<=days;d++){
    const dateS=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=d===today.getDate()&&m===today.getMonth()&&y===today.getFullYear();
    const cell=document.createElement('div');
    cell.className='day-cell'+(isToday?' today':'');
    const dayEvs=events.filter(e=>e.date===dateS);
    cell.innerHTML=`<div class="day-num">${d}</div>${dayEvs.map(e=>`<div class="event-dot" style="background:${e.color}22;color:${e.color};border-left:2px solid ${e.color}">${e.time?e.time+' ':''} ${e.title}</div>`).join('')}`;
    cell.onclick=()=>clickDay(dateS);
    grid.appendChild(cell);
  }
  renderUpcoming();
}

function renderUpcoming(){
  const list=document.getElementById('upcomingList');
  const todayS=dateStr(today);
  const upcoming=events.filter(e=>e.date>=todayS).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,10);
  list.innerHTML=upcoming.length?upcoming.map(e=>`<div class="upcoming-event" style="border-color:${e.color}"><div class="ue-title">${e.title}</div><div class="ue-date">${e.date}${e.time?' · '+e.time:''}</div></div>`).join(''):`<div class="no-events">No upcoming events</div>`;
}

function clickDay(date){
  document.getElementById('evDate').value=date;
  document.getElementById('eventForm').style.display='block';
  document.getElementById('evTitle').focus();
}

function toggleForm(){
  const f=document.getElementById('eventForm');
  f.style.display=f.style.display==='block'?'none':'block';
  if(f.style.display==='block'&&!document.getElementById('evDate').value){
    document.getElementById('evDate').value=dateStr(new Date());
  }
}

function saveEvent(){
  const title=document.getElementById('evTitle').value.trim();
  const date=document.getElementById('evDate').value;
  if(!title||!date)return;
  events.push({id:Date.now(),title,date,time:document.getElementById('evTime').value,note:document.getElementById('evNote').value,color:selColor});
  save();
  document.getElementById('evTitle').value='';
  document.getElementById('evTime').value='';
  document.getElementById('evNote').value='';
  document.getElementById('eventForm').style.display='none';
  render();
}

function changeMonth(d){cur.setMonth(cur.getMonth()+d);render();}
function goToday(){cur=new Date(today);render();}

// Color picker
const cp=document.getElementById('evColors');
COLORS.forEach(c=>{
  const d=document.createElement('div');
  d.className='ev-color'+(c===selColor?' selected':'');
  d.style.background=c;
  d.onclick=()=>{selColor=c;document.querySelectorAll('.ev-color').forEach(x=>x.classList.remove('selected'));d.classList.add('selected');};
  cp.appendChild(d);
});

render();
</script>
</body>
</html>
