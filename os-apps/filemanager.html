<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>File Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Oxanium',sans-serif;background:#0d1117;color:#e6edf3;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.toolbar{background:#161b22;border-bottom:1px solid rgba(255,255,255,0.08);padding:8px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.tb-btn{padding:6px 12px;border:1px solid rgba(255,255,255,0.08);border-radius:6px;background:rgba(255,255,255,0.04);color:#e6edf3;cursor:pointer;font-family:'Oxanium',sans-serif;font-size:12px;transition:all .15s}
.tb-btn:hover{background:rgba(255,255,255,0.1)}
.tb-btn:disabled{opacity:0.3;cursor:default}
.spacer{flex:1}
.breadcrumb{display:flex;align-items:center;gap:4px;font-size:13px;flex:1;overflow:hidden}
.bc-part{cursor:pointer;color:#58a6ff;padding:3px 6px;border-radius:4px}
.bc-part:hover{background:rgba(88,166,255,0.1)}
.bc-sep{color:#8b949e}
.view-toggle{display:flex;gap:2px}
.view-btn{padding:5px 8px;border:1px solid rgba(255,255,255,0.08);border-radius:5px;background:rgba(255,255,255,0.04);color:#8b949e;cursor:pointer;font-size:14px}
.view-btn.active{background:#0078d4;border-color:#0078d4;color:white}
.search-input{padding:6px 12px;background:#0d1117;border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#e6edf3;font-family:'Oxanium',sans-serif;font-size:12px;outline:none;width:180px}
.search-input::placeholder{color:#8b949e}
.main{flex:1;display:flex;overflow:hidden}
.sidebar{width:200px;background:#161b22;border-right:1px solid rgba(255,255,255,0.08);padding:10px 0;flex-shrink:0;overflow-y:auto}
.sidebar-section{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#8b949e;padding:8px 14px 4px}
.sidebar-item{padding:7px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;transition:background .15s;color:#e6edf3}
.sidebar-item:hover{background:rgba(255,255,255,0.05)}
.sidebar-item.active{background:rgba(0,120,212,0.15);color:#4db8ff}
.sidebar-item.connected{color:#22c55e}
.sidebar-item.connected::after{content:' ✓';font-size:10px}
.cloud-modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.cloud-modal.open{display:flex}
.cloud-box{background:#161b22;border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:24px;width:420px;box-shadow:0 24px 60px rgba(0,0,0,0.6)}
.cloud-box h3{font-size:18px;font-weight:700;margin-bottom:8px}
.cloud-box p{font-size:13px;color:#8b949e;margin-bottom:16px;line-height:1.6}
.cloud-input{width:100%;padding:9px 12px;background:#0d1117;border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#e6edf3;font-family:'Oxanium',sans-serif;font-size:13px;outline:none;margin-bottom:10px}
.cloud-input::placeholder{color:#8b949e}
.cloud-btns{display:flex;gap:8px}
.cloud-btn{flex:1;padding:10px;border:none;border-radius:8px;font-family:'Oxanium',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.cloud-btn-primary{background:#0078d4;color:white}
.cloud-btn-primary:hover{background:#0090ff}
.cloud-btn-secondary{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#8b949e}
.cloud-btn-secondary:hover{background:rgba(255,255,255,0.1)}
.content{flex:1;overflow:auto;padding:14px}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
/* Grid view */
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.file-card{padding:12px 8px;border-radius:10px;cursor:pointer;text-align:center;transition:all .15s;border:1px solid transparent;position:relative}
.file-card:hover{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.08)}
.file-card.selected{background:rgba(0,120,212,0.15);border-color:rgba(0,120,212,0.4)}
.file-card.dragging-over{background:rgba(0,120,212,0.2);border-color:#0078d4;border-style:dashed}
.file-icon{font-size:36px;margin-bottom:6px}
.file-name{font-size:11px;word-break:break-word;line-height:1.3;color:#e6edf3}
.file-meta{font-size:10px;color:#8b949e;margin-top:2px}
/* List view */
.file-list{display:flex;flex-direction:column;gap:1px}
.file-row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:6px;cursor:pointer;transition:background .1s}
.file-row:hover{background:rgba(255,255,255,0.05)}
.file-row.selected{background:rgba(0,120,212,0.12)}
.fr-icon{font-size:20px;flex-shrink:0;width:28px;text-align:center}
.fr-name{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr-size{font-size:11px;color:#8b949e;width:70px;text-align:right}
.fr-date{font-size:11px;color:#8b949e;width:120px;text-align:right}
.fr-type{font-size:11px;color:#8b949e;width:80px}
.list-header{display:flex;align-items:center;gap:12px;padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#8b949e;margin-bottom:4px}
/* Context menu */
.ctx-menu{position:fixed;background:#161b22;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:4px 0;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,0.5);z-index:9999;display:none}
.ctx-menu.open{display:block}
.ctx-item{padding:7px 16px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px}
.ctx-item:hover{background:rgba(255,255,255,0.06)}
.ctx-sep{height:1px;background:rgba(255,255,255,0.06);margin:3px 0}
/* Status bar */
.status-bar{background:#161b22;border-top:1px solid rgba(255,255,255,0.08);padding:4px 14px;display:flex;gap:16px;font-size:11px;color:#8b949e;flex-shrink:0}
/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:#8b949e;gap:10px}
.empty-state div{font-size:48px}
/* Drop zone */
.drop-zone-overlay{position:absolute;inset:0;background:rgba(0,120,212,0.15);border:3px dashed #0078d4;border-radius:10px;display:none;align-items:center;justify-content:center;font-size:18px;color:#4db8ff;z-index:100;pointer-events:none}
.drop-zone-overlay.active{display:flex}
</style>
</head>
<body>
<div class="toolbar">
  <button class="tb-btn" id="btnBack" onclick="goBack()" disabled>←</button>
  <button class="tb-btn" id="btnFwd"  onclick="goForward()" disabled>→</button>
  <button class="tb-btn" onclick="goUp()">↑ Up</button>
  <div class="breadcrumb" id="breadcrumb"></div>
  <input class="search-input" id="searchInput" placeholder="Search files…" oninput="renderContent()">
  <div class="view-toggle">
    <button class="view-btn active" id="gridBtn" onclick="setView('grid')" title="Grid">⊞</button>
    <button class="view-btn" id="listBtn" onclick="setView('list')" title="List">≡</button>
  </div>
  <button class="tb-btn" onclick="createFolder()">📁 New Folder</button>
  <button class="tb-btn" onclick="createFile()">📄 New File</button>
  <label class="tb-btn" for="uploadInput">⬆️ Upload</label>
  <input type="file" id="uploadInput" multiple style="display:none" onchange="uploadFiles(event)">
</div>
<div class="main">
  <div class="sidebar">
    <div class="sidebar-section">Quick Access</div>
    <div class="sidebar-item active" onclick="navigate('~')">🏠 Home</div>
    <div class="sidebar-item" onclick="navigate('~/Desktop')">🖥️ Desktop</div>
    <div class="sidebar-item" onclick="navigate('~/Documents')">📄 Documents</div>
    <div class="sidebar-item" onclick="navigate('~/Downloads')">⬇️ Downloads</div>
    <div class="sidebar-item" onclick="navigate('~/Pictures')">🖼️ Pictures</div>
    <div class="sidebar-item" onclick="navigate('~/Music')">🎵 Music</div>
    <div class="sidebar-section">Apps</div>
    <div class="sidebar-item" onclick="navigate('~/AppData')">📦 App Data</div>
    <div class="sidebar-section">Cloud</div>
    <div class="sidebar-item" id="gdrive-item" onclick="connectCloud('gdrive')">🟢 Google Drive</div>
    <div class="sidebar-item" id="onedrive-item" onclick="connectCloud('onedrive')">🔵 OneDrive</div>
    <div class="sidebar-item" id="dropbox-item" onclick="connectCloud('dropbox')">📦 Dropbox</div>
    <div class="sidebar-item" id="box-item" onclick="connectCloud('box')">📫 Box</div>
  </div>
  <div class="content" id="content" ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragleave="onDragLeave(event)" style="position:relative">
    <div class="drop-zone-overlay" id="dropOverlay">📂 Drop files to upload</div>
  </div>
</div>
<div class="status-bar">
  <span id="statusItems">0 items</span>
  <span id="statusSelected"></span>
  <span style="margin-left:auto" id="statusStorage"></span>
</div>
<div class="ctx-menu" id="ctxMenu"></div>
<div class="cloud-modal" id="cloudModal">
  <div class="cloud-box">
    <h3 id="cloudModalTitle">Connect Cloud</h3>
    <p id="cloudModalDesc"></p>
    <input class="cloud-input" id="cloudTokenInput" type="password" placeholder="Paste your API token or access key…">
    <div class="cloud-btns">
      <button class="cloud-btn cloud-btn-primary" onclick="saveCloudToken()">Connect</button>
      <button class="cloud-btn cloud-btn-secondary" onclick="closeCloudModal()">Cancel</button>
    </div>
    <p style="font-size:11px;color:#8b949e;margin-top:10px;line-height:1.5" id="cloudModalHelp"></p>
  </div>
</div>
<script>
// ── Virtual Filesystem ──
let fs = JSON.parse(localStorage.getItem('eclipseos_fs') || 'null');
if (!fs) {
  fs = {
    '~': { type:'dir', children:{ Desktop:{type:'dir',children:{}}, Documents:{type:'dir',children:{ 'readme.txt':{type:'file',content:'Welcome to EclipseOS File Manager!',size:38,modified:Date.now()} }}, Downloads:{type:'dir',children:{}}, Pictures:{type:'dir',children:{}}, Music:{type:'dir',children:{}}, AppData:{type:'dir',children:{}} } }
  };
  saveFs();
}
function saveFs(){ localStorage.setItem('eclipseos_fs', JSON.stringify(fs)); }

function getNode(path) {
  if (path === '~') return fs['~'];
  const parts = path.replace('~/', '').split('/').filter(Boolean);
  let node = fs['~'];
  for (const p of parts) { if (!node || !node.children || !node.children[p]) return null; node = node.children[p]; }
  return node;
}
function getParentNode(path) {
  const parts = path.split('/');
  parts.pop();
  return getNode(parts.join('/') || '~');
}
function getName(path) { return path.split('/').pop(); }
function getTypeIcon(name, type) {
  if (type === 'dir') return '📁';
  const ext = name.split('.').pop().toLowerCase();
  const m = {txt:'📄',md:'📝',js:'📜',ts:'📘',html:'🌐',css:'🎨',json:'📋',png:'🖼️',jpg:'🖼️',jpeg:'🖼️',gif:'🖼️',mp3:'🎵',mp4:'🎬',pdf:'📕',zip:'📦',py:'🐍',java:'☕',cpp:'⚙️',rs:'🦀',go:'🔵'};
  return m[ext] || '📄';
}
function fmtSize(b){ if(!b)return'—'; if(b<1024)return b+'B'; if(b<1048576)return(b/1024).toFixed(1)+'KB'; return(b/1048576).toFixed(1)+'MB'; }
function fmtDate(ts){ return new Date(ts).toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'}); }

// ── Navigation ──
let cwd = '~', history = ['~'], histIdx = 0, view = 'grid', selected = [];

function navigate(path) {
  cwd = path;
  if (histIdx < history.length - 1) history = history.slice(0, histIdx + 1);
  history.push(path); histIdx = history.length - 1;
  selected = [];
  document.getElementById('searchInput').value = '';
  renderAll();
}
function goBack()    { if (histIdx > 0) { histIdx--; cwd = history[histIdx]; selected=[]; renderAll(); } }
function goForward() { if (histIdx < history.length-1) { histIdx++; cwd = history[histIdx]; selected=[]; renderAll(); } }
function goUp()      { if (cwd !== '~') { const p = cwd.split('/'); p.pop(); navigate(p.join('/') || '~'); } }

function setView(v) { view = v; document.getElementById('gridBtn').classList.toggle('active', v==='grid'); document.getElementById('listBtn').classList.toggle('active', v==='list'); renderContent(); }

function renderAll() {
  renderBreadcrumb();
  renderContent();
  document.getElementById('btnBack').disabled = histIdx === 0;
  document.getElementById('btnFwd').disabled  = histIdx >= history.length - 1;
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  const paths = {'~':'🏠 Home','~/Desktop':'🖥️ Desktop','~/Documents':'📄 Documents','~/Downloads':'⬇️ Downloads','~/Pictures':'🖼️ Pictures','~/Music':'🎵 Music','~/AppData':'📦 App Data'};
  document.querySelectorAll('.sidebar-item').forEach(el => { if (Object.values(paths).some(t => el.textContent.trim() === t.trim()) && el.textContent.trim() === (paths[cwd]||'').trim()) el.classList.add('active'); });
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  const parts = cwd === '~' ? ['~'] : ['~', ...cwd.replace('~/','').split('/')];
  bc.innerHTML = parts.map((p, i) => {
    const path = i === 0 ? '~' : '~/' + parts.slice(1, i+1).join('/');
    const label = p === '~' ? '🏠 Home' : p;
    return `<span class="bc-part" onclick="navigate('${path}')">${label}</span>${i < parts.length-1 ? '<span class="bc-sep">/</span>' : ''}`;
  }).join('');
}

function renderContent() {
  const node = getNode(cwd);
  const content = document.getElementById('content');
  const q = document.getElementById('searchInput').value.toLowerCase();
  if (!node || node.type !== 'dir') { content.innerHTML = '<div class="empty-state"><div>❌</div><p>Folder not found</p></div>'; return; }
  const items = Object.entries(node.children || {})
    .filter(([name]) => !q || name.toLowerCase().includes(q))
    .sort(([an, av], [bn, bv]) => {
      if (av.type !== bv.type) return av.type === 'dir' ? -1 : 1;
      return an.localeCompare(bn);
    });
  const count = Object.keys(node.children || {}).length;
  document.getElementById('statusItems').textContent = count + ' item' + (count !== 1 ? 's' : '');
  document.getElementById('statusSelected').textContent = selected.length ? selected.length + ' selected' : '';
  let sz=0; for(let k in localStorage) sz+=localStorage[k].length;
  document.getElementById('statusStorage').textContent = 'Storage: ' + (sz/1024).toFixed(1) + ' KB used';
  if (!items.length) { content.innerHTML = '<div class="drop-zone-overlay" id="dropOverlay">📂 Drop files to upload</div><div class="empty-state"><div>📂</div><p>Empty folder</p></div>'; return; }
  if (view === 'grid') {
    content.innerHTML = '<div class="drop-zone-overlay" id="dropOverlay">📂 Drop files to upload</div><div class="file-grid">' +
      items.map(([name, f]) => `<div class="file-card ${selected.includes(name)?'selected':''}" ondblclick="open('${name}')" onclick="selectItem('${name}',event)" oncontextmenu="showCtx(event,'${name}')">
        <div class="file-icon">${getTypeIcon(name, f.type)}</div>
        <div class="file-name">${name}</div>
        ${f.type==='file'?`<div class="file-meta">${fmtSize(f.size||0)}</div>`:''}
      </div>`).join('') + '</div>';
  } else {
    content.innerHTML = '<div class="drop-zone-overlay" id="dropOverlay">📂 Drop files to upload</div>' +
      '<div class="list-header"><div style="width:28px"></div><div style="flex:1">Name</div><div style="width:80px">Type</div><div style="width:70px;text-align:right">Size</div><div style="width:120px;text-align:right">Modified</div></div>' +
      '<div class="file-list">' +
      items.map(([name, f]) => `<div class="file-row ${selected.includes(name)?'selected':''}" ondblclick="open('${name}')" onclick="selectItem('${name}',event)" oncontextmenu="showCtx(event,'${name}')">
        <div class="fr-icon">${getTypeIcon(name, f.type)}</div>
        <div class="fr-name">${name}</div>
        <div class="fr-type">${f.type==='dir'?'Folder':name.split('.').pop().toUpperCase()}</div>
        <div class="fr-size">${f.type==='file'?fmtSize(f.size||0):'—'}</div>
        <div class="fr-date">${f.modified?fmtDate(f.modified):'—'}</div>
      </div>`).join('') + '</div>';
  }
}

function selectItem(name, e) {
  if (e.ctrlKey || e.metaKey) { selected.includes(name) ? selected.splice(selected.indexOf(name),1) : selected.push(name); }
  else selected = [name];
  renderContent();
}

function open(name) {
  const node = getNode(cwd);
  const item = node.children[name];
  if (item.type === 'dir') { navigate(cwd + '/' + name); return; }
  // Open files in appropriate app via parent OS
  if (window.parent && window.parent.openApp) {
    const ext = name.split('.').pop().toLowerCase();
    const appMap = {txt:'notepad',md:'markdowneditor',js:'code',html:'code',css:'code',json:'code',py:'code',png:'imageviewer',jpg:'imageviewer',jpeg:'imageviewer',mp3:'musicplayer'};
    const app = appMap[ext] || 'notepad';
    window.parent.openApp(app);
  }
}

function createFolder() {
  const name = prompt('Folder name:'); if (!name) return;
  const node = getNode(cwd);
  if (node.children[name]) { alert('Already exists'); return; }
  node.children[name] = { type:'dir', children:{}, modified:Date.now() };
  saveFs(); renderContent();
}
function createFile() {
  const name = prompt('File name (e.g. note.txt):'); if (!name) return;
  const node = getNode(cwd);
  if (node.children[name]) { alert('Already exists'); return; }
  node.children[name] = { type:'file', content:'', size:0, modified:Date.now() };
  saveFs(); renderContent();
}
function renameItem(name) {
  const nw = prompt('Rename to:', name); if (!nw || nw === name) return;
  const node = getNode(cwd);
  node.children[nw] = node.children[name];
  delete node.children[name];
  saveFs(); renderContent();
}
function deleteItem(name) {
  if (!confirm('Delete "' + name + '"?')) return;
  const node = getNode(cwd);
  delete node.children[name];
  saveFs(); selected=[]; renderContent();
}
function deleteSelected() {
  if (!selected.length) return;
  if (!confirm('Delete ' + selected.length + ' item(s)?')) return;
  const node = getNode(cwd);
  selected.forEach(n => delete node.children[n]);
  saveFs(); selected=[]; renderContent();
}
function downloadFile(name) {
  const node = getNode(cwd);
  const f = node.children[name];
  if (!f || f.type !== 'file') return;
  const b = new Blob([f.content||''], {type:'text/plain'});
  const a = Object.assign(document.createElement('a'), {href:URL.createObjectURL(b), download:name});
  a.click(); URL.revokeObjectURL(a.href);
}

function uploadFiles(e) {
  const node = getNode(cwd);
  Array.from(e.target.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      node.children[file.name] = { type:'file', content:ev.target.result, size:file.size, modified:Date.now() };
      saveFs(); renderContent();
    };
    reader.readAsText(file);
  });
  e.target.value = '';
}

// Drag & drop upload
function onDragOver(e) { e.preventDefault(); document.getElementById('dropOverlay').classList.add('active'); }
function onDragLeave(e) { if (!e.currentTarget.contains(e.relatedTarget)) document.getElementById('dropOverlay').classList.remove('active'); }
function onDrop(e) {
  e.preventDefault();
  document.getElementById('dropOverlay').classList.remove('active');
  const node = getNode(cwd);
  Array.from(e.dataTransfer.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      node.children[file.name] = { type:'file', content:ev.target.result, size:file.size, modified:Date.now() };
      saveFs(); renderContent();
    };
    reader.readAsText(file);
  });
}

// Context menu
function showCtx(e, name) {
  e.preventDefault();
  const node = getNode(cwd);
  const item = node.children[name];
  const menu = document.getElementById('ctxMenu');
  menu.innerHTML = `
    <div class="ctx-item" onclick="open('${name}');closeCtx()">${item.type==='dir'?'📂 Open':'📄 Open'}</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" onclick="renameItem('${name}');closeCtx()">✏️ Rename</div>
    ${item.type==='file'?`<div class="ctx-item" onclick="downloadFile('${name}');closeCtx()">💾 Download</div>`:''}
    <div class="ctx-sep"></div>
    <div class="ctx-item" style="color:#f85149" onclick="deleteItem('${name}');closeCtx()">🗑️ Delete</div>`;
  menu.style.left = Math.min(e.clientX, window.innerWidth-200) + 'px';
  menu.style.top  = Math.min(e.clientY, window.innerHeight-200) + 'px';
  menu.classList.add('open');
}
function closeCtx() { document.getElementById('ctxMenu').classList.remove('open'); }
document.addEventListener('click', closeCtx);
document.addEventListener('keydown', e => { if(e.key==='Delete'&&selected.length)deleteSelected(); if(e.key==='Escape'){selected=[];renderContent();} });
renderAll();

// ── Cloud Connections ──
const CLOUD_META = {
  gdrive:   { name:'Google Drive',  icon:'🟢', help:'Get your token at console.cloud.google.com → Credentials → OAuth 2.0 Client ID' },
  onedrive: { name:'OneDrive',      icon:'🔵', help:'Get your token at portal.azure.com → App Registrations' },
  dropbox:  { name:'Dropbox',       icon:'📦', help:'Get your token at dropbox.com/developers → App Console → Generate access token' },
  box:      { name:'Box',           icon:'📫', help:'Get your token at developer.box.com → My Apps → Create New App' },
};
let activeCloudService = null;
let cloudTokens = JSON.parse(localStorage.getItem('eclipseos_cloud_tokens') || '{}');

function connectCloud(service) {
  const connected = cloudTokens[service];
  if (connected) {
    if (confirm('Disconnect ' + CLOUD_META[service].name + '?')) {
      delete cloudTokens[service];
      localStorage.setItem('eclipseos_cloud_tokens', JSON.stringify(cloudTokens));
      updateCloudItems();
    }
    return;
  }
  activeCloudService = service;
  const m = CLOUD_META[service];
  document.getElementById('cloudModalTitle').textContent = m.icon + ' Connect ' + m.name;
  document.getElementById('cloudModalDesc').textContent = 'Enter your ' + m.name + ' access token to enable cloud storage integration.';
  document.getElementById('cloudModalHelp').textContent = m.help;
  document.getElementById('cloudTokenInput').value = '';
  document.getElementById('cloudModal').classList.add('open');
}

function saveCloudToken() {
  const token = document.getElementById('cloudTokenInput').value.trim();
  if (!token) return;
  cloudTokens[activeCloudService] = token;
  localStorage.setItem('eclipseos_cloud_tokens', JSON.stringify(cloudTokens));
  closeCloudModal();
  updateCloudItems();
  alert('✅ ' + CLOUD_META[activeCloudService].name + ' connected! Cloud sync is saved.');
}

function closeCloudModal() {
  document.getElementById('cloudModal').classList.remove('open');
  activeCloudService = null;
}

function updateCloudItems() {
  Object.keys(CLOUD_META).forEach(service => {
    const el = document.getElementById(service + '-item');
    if (el) {
      el.classList.toggle('connected', !!cloudTokens[service]);
      el.title = cloudTokens[service] ? 'Click to disconnect' : 'Click to connect';
    }
  });
}

document.getElementById('cloudModal').addEventListener('click', e => {
  if (e.target === document.getElementById('cloudModal')) closeCloudModal();
});

updateCloudItems();

</script>
</body>
</html>
