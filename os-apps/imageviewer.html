<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Image Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #2a2a2a; height: 100vh; display: flex; flex-direction: column; }
        .toolbar { height: 50px; background: #1e1e1e; border-bottom: 1px solid #444; display: flex; align-items: center; padding: 0 12px; gap: 12px; }
        button { padding: 8px 16px; background: #0078d4; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background: #005a9e; }
        .viewer { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .placeholder { color: #999; font-size: 18px; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="toolbar">
        <button onclick="document.getElementById('fileInput').click()">📁 Open Image</button>
        <button onclick="rotateImage()">🔄 Rotate</button>
        <button onclick="clearImage()">✕ Close</button>
        <input type="file" id="fileInput" accept="image/*" onchange="loadImage(event)">
    </div>
    <div class="viewer" id="viewer">
        <div class="placeholder">No image loaded. Click "Open Image" to start.</div>
    </div>

    <script>
        let rotation = 0;
        let currentImage = null;

        function loadImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const viewer = document.getElementById('viewer');
                    viewer.innerHTML = `<img id="displayImage" src="${e.target.result}" style="transform: rotate(0deg);">`;
                    currentImage = e.target.result;
                    rotation = 0;
                };
                reader.readAsDataURL(file);
            }
        }

        function rotateImage() {
            const img = document.getElementById('displayImage');
            if (img) {
                rotation = (rotation + 90) % 360;
                img.style.transform = `rotate(${rotation}deg)`;
            }
        }

        function clearImage() {
            document.getElementById('viewer').innerHTML = '<div class="placeholder">No image loaded. Click "Open Image" to start.</div>';
            currentImage = null;
            rotation = 0;
        }
    </script>
</body>
</html>
