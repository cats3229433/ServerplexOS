<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Markdown Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Oxanium',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap}
.tb-btn{padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:rgba(255,255,255,0.04);color:var(--text);cursor:pointer;font-family:'Oxanium',sans-serif;font-size:12px;transition:all 0.15s}
.tb-btn:hover{background:rgba(255,255,255,0.1)}
.sep{width:1px;height:20px;background:rgba(255,255,255,0.1)}
.spacer{flex:1}
.view-toggle{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.view-btn{padding:5px 12px;background:none;border:none;color:var(--text3);cursor:pointer;font-family:'Oxanium',sans-serif;font-size:12px;transition:all 0.15s}
.view-btn:hover{background:var(--border)}
.view-btn.active{background:var(--accent);color:white}
.editor-wrap{flex:1;display:flex;overflow:hidden}
.pane{flex:1;display:flex;flex-direction:column;overflow:hidden}
.pane-title{background:var(--surface);padding:5px 14px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);flex-shrink:0}
.editor-ta{flex:1;width:100%;background:var(--bg);border:none;resize:none;outline:none;font-family:'Courier New',monospace;font-size:14px;line-height:1.7;color:var(--text);padding:20px;border-right:1px solid var(--border)}
.preview{flex:1;overflow-y:auto;padding:20px;background:var(--bg);font-family:'Oxanium',sans-serif;line-height:1.8;font-size:14px;border-left:1px solid var(--border)}
.preview h1,.preview h2,.preview h3,.preview h4{font-weight:700;margin:24px 0 12px;color:var(--text)}
.preview h1{font-size:28px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:12px}
.preview h2{font-size:22px;border-bottom:1px solid var(--border);padding-bottom:8px}
.preview h3{font-size:18px}
.preview p{margin-bottom:14px;color:var(--text2)}
.preview code{background:var(--surface);padding:2px 7px;border-radius:4px;font-family:'Courier New',monospace;font-size:13px;color:#f0883e;border:1px solid var(--border)}
.preview pre{background:var(--surface);padding:16px;border-radius:8px;overflow-x:auto;margin-bottom:16px;border:1px solid var(--border)}
.preview pre code{background:none;padding:0;border:none;color:var(--text)}
.preview blockquote{border-left:4px solid var(--accent);padding-left:16px;margin:16px 0;color:var(--text3)}
.preview ul,.preview ol{margin:0 0 14px 24px;color:var(--text2)}
.preview li{margin-bottom:4px}
.preview a{color:#58a6ff;text-decoration:none}
.preview a:hover{text-decoration:underline}
.preview table{width:100%;border-collapse:collapse;margin-bottom:16px}
.preview th,.preview td{padding:8px 12px;border:1px solid rgba(255,255,255,0.1)}
.preview th{background:var(--surface);font-weight:700}
.preview img{max-width:100%;border-radius:8px}
.preview hr{border:none;border-top:1px solid rgba(255,255,255,0.1);margin:20px 0}
.status-bar{background:var(--surface);border-top:1px solid var(--border);padding:4px 14px;display:flex;gap:16px;font-size:11px;color:var(--text3);flex-shrink:0}
.pane.hidden{display:none}
</style>
</head>
<body>
<script>
(function(){
  var t=localStorage.getItem('serverplex_theme')||'white';
  if(t==='black')document.body.classList.add('dark');
  else if(t==='grey')document.body.classList.add('grey');
  var acc=localStorage.getItem('serverplex_accent');
  if(acc)document.documentElement.style.setProperty('--accent',acc);
})();
</script>

<div class="toolbar">
  <button class="tb-btn" onclick="ins('**','**')" title="Bold"><b>B</b></button>
  <button class="tb-btn" onclick="ins('*','*')" title="Italic"><i>I</i></button>
  <button class="tb-btn" onclick="ins('~~','~~')" title="Strikethrough"><s>S</s></button>
  <button class="tb-btn" onclick="ins('`','`')" title="Inline code">` `</button>
  <div class="sep"></div>
  <button class="tb-btn" onclick="insLine('# ')">H1</button>
  <button class="tb-btn" onclick="insLine('## ')">H2</button>
  <button class="tb-btn" onclick="insLine('### ')">H3</button>
  <div class="sep"></div>
  <button class="tb-btn" onclick="insLine('- ')">• List</button>
  <button class="tb-btn" onclick="insLine('1. ')">1. List</button>
  <button class="tb-btn" onclick="insLine('> ')">❝ Quote</button>
  <button class="tb-btn" onclick="insBlock('```\n','\n```')">Code Block</button>
  <div class="sep"></div>
  <button class="tb-btn" onclick="insLine('---')">─ Rule</button>
  <button class="tb-btn" onclick="insLink()">🔗 Link</button>
  <button class="tb-btn" onclick="insTable()">📊 Table</button>
  <div class="sep"></div>
  <button class="tb-btn" onclick="saveDoc()">💾 Save</button>
  <button class="tb-btn" onclick="downloadMd()">⬇️ .md</button>
  <button class="tb-btn" onclick="downloadHtml()">⬇️ .html</button>
  <button class="tb-btn" onclick="clearDoc()">🗑️ Clear</button>
  <div class="spacer"></div>
  <div class="view-toggle">
    <button class="view-btn active" id="vBoth" onclick="setView('both')">Split</button>
    <button class="view-btn" id="vEdit" onclick="setView('edit')">Editor</button>
    <button class="view-btn" id="vPrev" onclick="setView('preview')">Preview</button>
  </div>
</div>
<div class="editor-wrap" id="editorWrap">
  <div class="pane" id="editPane">
    <div class="pane-title">✏️ Markdown</div>
    <textarea class="editor-ta" id="editor" placeholder="# Start writing markdown…&#10;&#10;Type your content here. The preview updates live."></textarea>
  </div>
  <div class="pane" id="prevPane">
    <div class="pane-title">👁️ Preview</div>
    <div class="preview" id="preview"></div>
  </div>
</div>
<div class="status-bar">
  <span id="statWords">Words: 0</span>
  <span id="statChars">Chars: 0</span>
  <span id="statLines">Lines: 0</span>
  <span id="saveStatus" style="margin-left:auto">Auto-saved</span>
</div>
<script>
const editor=document.getElementById('editor');
const preview=document.getElementById('preview');
let saveTimer;
editor.value=localStorage.getItem('serverplex_markdown')||'';
update();
editor.addEventListener('input',()=>{update();clearTimeout(saveTimer);saveTimer=setTimeout(()=>{localStorage.setItem('serverplex_markdown',editor.value);document.getElementById('saveStatus').textContent='Saved ✓';},600);});

function update(){
  preview.innerHTML=marked.parse(editor.value||'*Nothing to preview yet*');
  const text=editor.value;
  document.getElementById('statWords').textContent='Words: '+(text.trim()?text.trim().split(/\s+/).length:0);
  document.getElementById('statChars').textContent='Chars: '+text.length;
  document.getElementById('statLines').textContent='Lines: '+text.split('\n').length;
}
function ins(before,after){
  const s=editor.selectionStart,e=editor.selectionEnd;
  const sel=editor.value.substring(s,e)||'text';
  editor.value=editor.value.substring(0,s)+before+sel+after+editor.value.substring(e);
  editor.setSelectionRange(s+before.length,s+before.length+sel.length);
  editor.focus();update();
}
function insLine(prefix){
  const s=editor.selectionStart;
  const lineStart=editor.value.lastIndexOf('\n',s-1)+1;
  editor.value=editor.value.substring(0,lineStart)+prefix+editor.value.substring(lineStart);
  editor.setSelectionRange(lineStart+prefix.length,lineStart+prefix.length);
  editor.focus();update();
}
function insBlock(before,after){
  const s=editor.selectionStart,e=editor.selectionEnd;
  const sel=editor.value.substring(s,e);
  editor.value=editor.value.substring(0,s)+before+sel+after+editor.value.substring(e);
  editor.focus();update();
}
function insLink(){const url=prompt('URL:','https://');if(!url)return;const text=prompt('Link text:','Link');ins(`[${text}](`,'${url})'+'');const t=`[${text||'Link'}](${url})`;const s=editor.selectionStart;editor.value=editor.value.substring(0,s)+t+editor.value.substring(editor.selectionEnd);editor.focus();update();}
function insTable(){const rows=prompt('Rows:',3),cols=prompt('Cols:',3);if(!rows||!cols)return;let t='\n';const h=Array(parseInt(cols)).fill('Header').join(' | ');const sep=Array(parseInt(cols)).fill('---').join(' | ');t+=`| ${h} |\n| ${sep} |\n`;for(let i=0;i<parseInt(rows);i++)t+=`| ${Array(parseInt(cols)).fill('Cell').join(' | ')} |\n`;t+='\n';editor.value+=t;editor.focus();update();}
function setView(v){
  document.getElementById('editPane').classList.toggle('hidden',v==='preview');
  document.getElementById('prevPane').classList.toggle('hidden',v==='edit');
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(v==='both'?'vBoth':v==='edit'?'vEdit':'vPrev').classList.add('active');
}
function saveDoc(){localStorage.setItem('serverplex_markdown',editor.value);document.getElementById('saveStatus').textContent='Saved ✓';}
function clearDoc(){if(confirm('Clear all markdown?')){editor.value='';localStorage.removeItem('serverplex_markdown');update();}}
function downloadMd(){const b=new Blob([editor.value],{type:'text/markdown'});const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(b),download:`document-${Date.now()}.md`});a.click();}
function downloadHtml(){const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:sans-serif;max-width:800px;margin:40px auto;padding:0 20px;line-height:1.7;color: var(--text)}h1,h2,h3{color:#111}code{background:#f4f4f4;padding:2px 6px;border-radius:3px}pre{background:#f4f4f4;padding:16px;border-radius:6px;overflow-x:auto}blockquote{border-left:4px solid var(--accent);padding-left:16px;color:#666}
/* ── ServerplexOS Theme System ── */
:root { --accent: #0078d4; }
body {
  --bg:      #f0f2f5;
  --bg2:     #e4e7ed;
  --surface: #ffffff;
  --surface2:#f0f2f5;
  --text:    #0d0f14;
  --text2:   #55606e;
  --text3:   #8a95a3;
  --border:  rgba(0,0,0,0.09);
  --border2: rgba(0,0,0,0.14);
  --shadow:  0 4px 20px rgba(0,0,0,.10);
}
body.dark {
  --bg:      #060811;
  --bg2:     #111420;
  --surface: #12151f;
  --surface2:#1a1e2e;
  --text:    var(--text);
  --text2:   #8b97b0;
  --text3:   #5a6478;
  --border:  var(--border);
  --border2: var(--border2);
  --shadow:  0 4px 20px rgba(0,0,0,.5);
}
body.grey {
  --bg:      #3a3e4a;
  --bg2:     #4e535e;
  --surface: #484c57;
  --surface2:#545862;
  --text:    #eef0f4;
  --text2:   #b8bec8;
  --text3:   #858ea0;
  --border:  rgba(255,255,255,0.10);
  --border2: rgba(255,255,255,0.18);
  --shadow:  0 4px 20px rgba(0,0,0,.35);
}
</style></head><body>${preview.innerHTML}</body></html>`;const b=new Blob([html],{type:'text/html'});const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(b),download:`document-${Date.now()}.html`});a.click();}
</script>
</body>
</html>
