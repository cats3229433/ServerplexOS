<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Markdown Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .toolbar { height: 50px; background: #f0f0f0; border-bottom: 1px solid #ccc; display: flex; align-items: center; padding: 0 12px; gap: 8px; }
        button { padding: 8px 16px; background: #0078d4; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background: #005a9e; }
        .editor-container { flex: 1; display: flex; }
        .editor-pane { flex: 1; display: flex; flex-direction: column; }
        .editor-pane:first-child { border-right: 2px solid #ccc; }
        .pane-title { background: #f9f9f9; padding: 8px 16px; font-size: 13px; font-weight: 600; color: #666; border-bottom: 1px solid #ddd; }
        textarea { flex: 1; padding: 16px; border: none; font-family: 'Consolas', monospace; font-size: 14px; resize: none; outline: none; }
        .preview { flex: 1; padding: 16px; overflow-y: auto; background: #fff; }
        .preview h1, .preview h2, .preview h3 { margin-top: 16px; margin-bottom: 8px; }
        .preview p { margin-bottom: 12px; line-height: 1.6; }
        .preview code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; font-family: 'Consolas', monospace; }
        .preview pre { background: #f4f4f4; padding: 12px; border-radius: 6px; overflow-x: auto; margin-bottom: 12px; }
        .preview ul, .preview ol { margin-left: 24px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="toolbar">
        <button onclick="saveMarkdown()">💾 Save</button>
        <button onclick="clearMarkdown()">🗑️ Clear</button>
        <button onclick="downloadMarkdown()">📥 Download</button>
    </div>
    <div class="editor-container">
        <div class="editor-pane">
            <div class="pane-title">✏️ Markdown</div>
            <textarea id="markdown" placeholder="# Start writing markdown...

## Headings
Use # for headings

## Lists
- Item 1
- Item 2

## Code
`inline code`

```
code block
```

## Links
[Link text](https://example.com)"></textarea>
        </div>
        <div class="editor-pane">
            <div class="pane-title">👁️ Preview</div>
            <div class="preview" id="preview"></div>
        </div>
    </div>

    <script>
        const textarea = document.getElementById('markdown');
        const preview = document.getElementById('preview');
        
        // Load saved markdown
        textarea.value = localStorage.getItem('serverplexos_markdown') || '';
        updatePreview();
        
        textarea.addEventListener('input', () => {
            updatePreview();
            localStorage.setItem('serverplexos_markdown', textarea.value);
        });
        
        function updatePreview() {
            preview.innerHTML = marked.parse(textarea.value || '*No content yet...*');
        }
        
        function saveMarkdown() {
            localStorage.setItem('serverplexos_markdown', textarea.value);
            alert('Markdown saved!');
        }
        
        function clearMarkdown() {
            if (confirm('Clear all markdown?')) {
                textarea.value = '';
                localStorage.setItem('serverplexos_markdown', '');
                updatePreview();
            }
        }
        
        function downloadMarkdown() {
            const blob = new Blob([textarea.value], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `markdown-${Date.now()}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
