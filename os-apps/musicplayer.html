<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Music Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; justify-content: center; align-items: center; }
        .player { background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 400px; }
        h2 { text-align: center; margin-bottom: 30px; color: #333; }
        .album-art { width: 200px; height: 200px; margin: 0 auto 20px; background: #ddd; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 80px; }
        .track-info { text-align: center; margin-bottom: 20px; }
        .track-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .track-artist { font-size: 14px; color: #666; }
        .progress-bar { width: 100%; height: 6px; background: #ddd; border-radius: 3px; margin: 20px 0; cursor: pointer; }
        .progress { height: 100%; background: #667eea; border-radius: 3px; width: 0%; }
        .time { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-bottom: 20px; }
        .controls { display: flex; justify-content: center; gap: 16px; margin-bottom: 20px; }
        .control-btn { width: 50px; height: 50px; border-radius: 50%; border: none; background: #667eea; color: white; font-size: 20px; cursor: pointer; transition: all 0.3s; }
        .control-btn:hover { transform: scale(1.1); background: #764ba2; }
        .control-btn.play { width: 60px; height: 60px; font-size: 24px; }
        button.file-btn { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        button.file-btn:hover { background: #764ba2; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="player">
        <h2>🎵 Music Player</h2>
        <div class="album-art">🎵</div>
        <div class="track-info">
            <div class="track-name" id="trackName">No track loaded</div>
            <div class="track-artist" id="trackArtist">Select a file to play</div>
        </div>
        <div class="progress-bar" onclick="seek(event)">
            <div class="progress" id="progress"></div>
        </div>
        <div class="time">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>
        <div class="controls">
            <button class="control-btn" onclick="skipBackward()">⏮️</button>
            <button class="control-btn play" onclick="togglePlay()" id="playBtn">▶️</button>
            <button class="control-btn" onclick="skipForward()">⏭️</button>
        </div>
        <button class="file-btn" onclick="document.getElementById('audioFile').click()">📁 Load Music File</button>
        <input type="file" id="audioFile" accept="audio/*" onchange="loadAudio(event)">
        <audio id="audio"></audio>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        let isPlaying = false;

        function loadAudio(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                audio.src = url;
                document.getElementById('trackName').textContent = file.name;
                document.getElementById('trackArtist').textContent = 'Local file';
            }
        }

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                playBtn.textContent = '▶️';
            } else {
                audio.play();
                playBtn.textContent = '⏸️';
            }
            isPlaying = !isPlaying;
        }

        function skipBackward() {
            audio.currentTime = Math.max(0, audio.currentTime - 10);
        }

        function skipForward() {
            audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
        }

        function seek(event) {
            const bar = event.currentTarget;
            const clickX = event.offsetX;
            const width = bar.offsetWidth;
            const percentage = clickX / width;
            audio.currentTime = percentage * audio.duration;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        audio.addEventListener('timeupdate', () => {
            const progress = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progress').style.width = progress + '%';
            document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
        });

        audio.addEventListener('loadedmetadata', () => {
            document.getElementById('duration').textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            isPlaying = false;
            playBtn.textContent = '▶️';
        });
    </script>
</body>
</html>
