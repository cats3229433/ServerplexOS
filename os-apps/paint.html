<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Paint</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Oxanium',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.tool-group{display:flex;gap:4px;align-items:center}
.tb-sep{width:1px;height:24px;background:rgba(255,255,255,0.1)}
.tool-btn{padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:rgba(255,255,255,0.04);color:var(--text);cursor:pointer;font-size:16px;transition:all 0.15s;display:flex;align-items:center;justify-content:center;min-width:36px}
.tool-btn:hover{background:rgba(255,255,255,0.1)}
.tool-btn.active{background:var(--accent);border-color:var(--accent)}
.label{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
.size-slider{width:80px;accent-color:var(--accent)}
.color-swatch{width:28px;height:28px;border-radius:6px;cursor:pointer;border:2px solid rgba(255,255,255,0.2);position:relative;overflow:hidden;flex-shrink:0}
.color-swatch input[type=color]{position:absolute;inset:-4px;width:calc(100%+8px);height:calc(100%+8px);cursor:pointer;border:none;padding:0;opacity:0}
.color-swatch-bg{position:absolute;inset:0;border-radius:4px}
.palette{display:flex;gap:4px;flex-wrap:wrap;max-width:200px}
.pal-color{width:20px;height:20px;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:all 0.1s;flex-shrink:0}
.pal-color:hover{transform:scale(1.15)}
.pal-color.selected{border-color:white}
.opacity-slider{width:70px;accent-color:var(--accent)}
.canvas-wrap{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:#2a2a2a;padding:16px}
canvas{cursor:crosshair;background:white;box-shadow:0 4px 24px rgba(0,0,0,0.5)}
.status-bar{background:var(--surface);border-top:1px solid var(--border);padding:4px 14px;display:flex;gap:16px;font-size:11px;color:var(--text3);flex-shrink:0}

/* ── ServerplexOS Theme System ── */
:root { --accent: #0078d4; }
body {
  --bg:      #f0f2f5;
  --bg2:     #e4e7ed;
  --surface: #ffffff;
  --surface2:#f0f2f5;
  --text:    #0d0f14;
  --text2:   #55606e;
  --text3:   #8a95a3;
  --border:  rgba(0,0,0,0.09);
  --border2: rgba(0,0,0,0.14);
  --shadow:  0 4px 20px rgba(0,0,0,.10);
}
body.dark {
  --bg:      #060811;
  --bg2:     #111420;
  --surface: #12151f;
  --surface2:#1a1e2e;
  --text:    var(--text);
  --text2:   #8b97b0;
  --text3:   #5a6478;
  --border:  var(--border);
  --border2: var(--border2);
  --shadow:  0 4px 20px rgba(0,0,0,.5);
}
body.grey {
  --bg:      #3a3e4a;
  --bg2:     #4e535e;
  --surface: #484c57;
  --surface2:#545862;
  --text:    #eef0f4;
  --text2:   #b8bec8;
  --text3:   #858ea0;
  --border:  rgba(255,255,255,0.10);
  --border2: rgba(255,255,255,0.18);
  --shadow:  0 4px 20px rgba(0,0,0,.35);
}
</style>
</head>
<body>
<script>
(function(){
  var t=localStorage.getItem('serverplex_theme')||'white';
  if(t==='black')document.body.classList.add('dark');
  else if(t==='grey')document.body.classList.add('grey');
  var acc=localStorage.getItem('serverplex_accent');
  if(acc)document.documentElement.style.setProperty('--accent',acc);
})();
</script>

<div class="toolbar">
  <div class="tool-group">
    <button class="tool-btn active" id="tool-brush" onclick="setTool('brush')" title="Brush">🖌️</button>
    <button class="tool-btn" id="tool-pencil" onclick="setTool('pencil')" title="Pencil">✏️</button>
    <button class="tool-btn" id="tool-eraser" onclick="setTool('eraser')" title="Eraser">🧹</button>
    <button class="tool-btn" id="tool-fill" onclick="setTool('fill')" title="Fill">🪣</button>
    <button class="tool-btn" id="tool-eyedrop" onclick="setTool('eyedrop')" title="Eyedropper">💉</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tool-group">
    <button class="tool-btn" id="tool-line" onclick="setTool('line')" title="Line">╱</button>
    <button class="tool-btn" id="tool-rect" onclick="setTool('rect')" title="Rectangle">▭</button>
    <button class="tool-btn" id="tool-circle" onclick="setTool('circle')" title="Circle">◯</button>
    <button class="tool-btn" id="tool-text" onclick="setTool('text')" title="Text">T</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tool-group">
    <span class="label">Size</span>
    <input type="range" class="size-slider" id="sizeSlider" min="1" max="60" value="4" oninput="updateSize()">
    <span id="sizeLabel" style="font-size:12px;color:#e6edf3;min-width:24px">4px</span>
  </div>
  <div class="tb-sep"></div>
  <div class="tool-group">
    <span class="label">Opacity</span>
    <input type="range" class="opacity-slider" id="opacitySlider" min="1" max="100" value="100" oninput="updateOpacity()">
    <span id="opacityLabel" style="font-size:12px;color:#e6edf3;min-width:30px">100%</span>
  </div>
  <div class="tb-sep"></div>
  <div class="tool-group">
    <div class="color-swatch" title="Primary color" id="primarySwatch">
      <div class="color-swatch-bg" id="primaryBg"></div>
      <input type="color" id="primaryColor" value="#000000" oninput="setPrimary(this.value)">
    </div>
    <div class="palette" id="palette"></div>
  </div>
  <div class="tb-sep"></div>
  <div class="tool-group">
    <button class="tool-btn" onclick="undo()" title="Undo">↩️</button>
    <button class="tool-btn" onclick="redo()" title="Redo">↪️</button>
    <button class="tool-btn" onclick="clearCanvas()" title="Clear">🗑️</button>
    <button class="tool-btn" onclick="saveImage()" title="Save">💾</button>
    <button class="tool-btn" onclick="copyCanvas()" title="Copy">📋</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tool-group">
    <button class="tool-btn" onclick="resizeCanvas()" title="Resize">⇲</button>
  </div>
</div>
<div class="canvas-wrap" id="canvasWrap">
  <canvas id="canvas" width="900" height="600"></canvas>
</div>
<div class="status-bar">
  <span id="posStatus">X: 0, Y: 0</span>
  <span id="sizeStatus">Canvas: 900 × 600</span>
  <span id="toolStatus">Tool: Brush</span>
  <span id="colorStatus">Color: #000000</span>
</div>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let tool='brush',color='#000000',size=4,opacity=1;
let painting=false,startX=0,startY=0;
let history=[],histIdx=-1,snapshot=null;
const PALETTE=['#000000','#ffffff','#ff0000','#00ff00','#0000ff','#ffff00','#ff8800','#ff00ff','#00ffff','#8800ff','#888888','#444444','#cccccc','#ff4444','#44ff44','#4444ff','#ffa500','#008080','#800080','#dc143c'];

function init(){
  ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);
  pushHistory();
  renderPalette();
  setPrimary('#000000');
}
function renderPalette(){
  const p=document.getElementById('palette');
  p.innerHTML='';
  PALETTE.forEach(c=>{
    const d=document.createElement('div');
    d.className='pal-color'+(c===color?' selected':'');
    d.style.background=c;
    d.onclick=()=>{setPrimary(c);document.querySelectorAll('.pal-color').forEach(x=>x.classList.remove('selected'));d.classList.add('selected');};
    p.appendChild(d);
  });
}
function setPrimary(c){color=c;document.getElementById('primaryBg').style.background=c;document.getElementById('primaryColor').value=c;document.getElementById('colorStatus').textContent=`Color: ${c}`;}
function setTool(t){tool=t;document.querySelectorAll('.tool-btn[id^=tool-]').forEach(b=>b.classList.remove('active'));document.getElementById('tool-'+t)&&document.getElementById('tool-'+t).classList.add('active');document.getElementById('toolStatus').textContent=`Tool: ${t.charAt(0).toUpperCase()+t.slice(1)}`;}
function updateSize(){size=parseInt(document.getElementById('sizeSlider').value);document.getElementById('sizeLabel').textContent=size+'px';}
function updateOpacity(){opacity=parseInt(document.getElementById('opacitySlider').value)/100;document.getElementById('opacityLabel').textContent=Math.round(opacity*100)+'%';}

function getPos(e){const r=canvas.getBoundingClientRect(),s=canvas.width/r.width;return{x:Math.round((e.clientX-r.left)*s),y:Math.round((e.clientY-r.top)*s)};}

function hexToRgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

canvas.onmousedown=e=>{
  const p=getPos(e);startX=p.x;startY=p.y;painting=true;
  if(tool==='fill'){floodFill(p.x,p.y,color);return;}
  if(tool==='eyedrop'){pickColor(p.x,p.y);return;}
  if(tool==='text'){addText(p.x,p.y);return;}
  if(['line','rect','circle'].includes(tool)){snapshot=ctx.getImageData(0,0,canvas.width,canvas.height);}
  ctx.beginPath();ctx.moveTo(p.x,p.y);
  draw(e);
};
canvas.onmousemove=e=>{
  const p=getPos(e);
  document.getElementById('posStatus').textContent=`X: ${p.x}, Y: ${p.y}`;
  if(!painting)return;
  draw(e);
};
canvas.onmouseup=e=>{if(painting){draw(e);pushHistory();}painting=false;};
canvas.onmouseleave=e=>{if(painting){draw(e);pushHistory();}painting=false;};

function draw(e){
  const p=getPos(e);
  ctx.globalAlpha=opacity;
  if(tool==='brush'){
    ctx.strokeStyle=color;ctx.lineWidth=size;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);
  } else if(tool==='pencil'){
    ctx.strokeStyle=color;ctx.lineWidth=1;ctx.lineCap='square';
    ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);
  } else if(tool==='eraser'){
    ctx.globalAlpha=1;ctx.strokeStyle='#ffffff';ctx.lineWidth=size*3;ctx.lineCap='round';
    ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);
  } else if(tool==='line'&&snapshot){
    ctx.putImageData(snapshot,0,0);
    ctx.strokeStyle=color;ctx.lineWidth=size;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(p.x,p.y);ctx.stroke();
  } else if(tool==='rect'&&snapshot){
    ctx.putImageData(snapshot,0,0);
    ctx.strokeStyle=color;ctx.lineWidth=size;
    ctx.strokeRect(startX,startY,p.x-startX,p.y-startY);
  } else if(tool==='circle'&&snapshot){
    ctx.putImageData(snapshot,0,0);
    ctx.strokeStyle=color;ctx.lineWidth=size;
    const rx=Math.abs(p.x-startX)/2,ry=Math.abs(p.y-startY)/2;
    ctx.beginPath();ctx.ellipse(startX+(p.x-startX)/2,startY+(p.y-startY)/2,rx,ry,0,0,Math.PI*2);ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function floodFill(sx,sy,fillColor){
  const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
  const data=imgData.data;
  const idx=(sy*canvas.width+sx)*4;
  const tr=data[idx],tg=data[idx+1],tb=data[idx+2],ta=data[idx+3];
  const fr=parseInt(fillColor.slice(1,3),16),fg=parseInt(fillColor.slice(3,5),16),fb=parseInt(fillColor.slice(5,7),16);
  if(tr===fr&&tg===fg&&tb===fb)return;
  const stack=[[sx,sy]];
  const matches=([x,y])=>{const i=(y*canvas.width+x)*4;return Math.abs(data[i]-tr)<20&&Math.abs(data[i+1]-tg)<20&&Math.abs(data[i+2]-tb)<20;};
  const fill=([x,y])=>{const i=(y*canvas.width+x)*4;data[i]=fr;data[i+1]=fg;data[i+2]=fb;data[i+3]=255;};
  while(stack.length){const pt=stack.pop();const [x,y]=pt;if(x<0||y<0||x>=canvas.width||y>=canvas.height||!matches(pt))continue;fill(pt);stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}
  ctx.putImageData(imgData,0,0);pushHistory();
}
function pickColor(x,y){const d=ctx.getImageData(x,y,1,1).data;const hex='#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');setPrimary(hex);}
function addText(x,y){const t=prompt('Enter text:');if(!t)return;ctx.fillStyle=color;ctx.font=`${size*3+8}px Oxanium`;ctx.fillText(t,x,y);pushHistory();}

function pushHistory(){history=history.slice(0,histIdx+1);history.push(ctx.getImageData(0,0,canvas.width,canvas.height));if(history.length>30)history.shift();histIdx=history.length-1;}
function undo(){if(histIdx>0){histIdx--;ctx.putImageData(history[histIdx],0,0);}}
function redo(){if(histIdx<history.length-1){histIdx++;ctx.putImageData(history[histIdx],0,0);}}
function clearCanvas(){if(confirm('Clear canvas?')){ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);pushHistory();}}
function saveImage(){const a=Object.assign(document.createElement('a'),{href:canvas.toDataURL(),download:`paint-${Date.now()}.png`});a.click();}
function copyCanvas(){canvas.toBlob(b=>navigator.clipboard.write([new ClipboardItem({'image/png':b})]).then(()=>alert('Copied!')),'image/png');}
function resizeCanvas(){
  const w=parseInt(prompt('Width:',canvas.width));
  const h=parseInt(prompt('Height:',canvas.height));
  if(!w||!h)return;
  const img=ctx.getImageData(0,0,canvas.width,canvas.height);
  canvas.width=w;canvas.height=h;
  ctx.fillStyle='white';ctx.fillRect(0,0,w,h);
  ctx.putImageData(img,0,0);
  document.getElementById('sizeStatus').textContent=`Canvas: ${w} × ${h}`;
  pushHistory();
}
init();
</script>
</body>
</html>
