<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; height: 100vh; }
        h1 { font-size: 24px; margin-bottom: 20px; color: #333; }
        table { width: 100%; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #0078d4; color: white; font-weight: 600; }
        button { padding: 6px 12px; background: #ff3b30; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        button:hover { background: #cc2f26; }
        .no-processes { text-align: center; padding: 40px; color: #999; }
    </style>
</head>
<body>
    <h1>Task Manager</h1>
    <table id="processTable">
        <thead>
            <tr>
                <th>App Name</th>
                <th>Icon</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="processList"></tbody>
    </table>

    <script>
        function updateProcesses() {
            const tbody = document.getElementById('processList');
            tbody.innerHTML = '';
            
            // Try to get windows from parent OS
            if (window.parent && window.parent.windows) {
                const windows = window.parent.windows;
                const apps = window.parent.apps;
                
                if (Object.keys(windows).length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="no-processes">No running processes</td></tr>';
                    return;
                }
                
                Object.keys(windows).forEach(appId => {
                    const app = apps[appId];
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${app.name}</td>
                        <td style="font-size: 24px;">${app.icon}</td>
                        <td><span style="color: #34c759;">●</span> Running</td>
                        <td><button onclick="endTask('${appId}')">End Task</button></td>
                    `;
                    tbody.appendChild(row);
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="4" class="no-processes">Cannot access OS process list</td></tr>';
            }
        }
        
        function endTask(appId) {
            if (window.parent && window.parent.closeWindow) {
                window.parent.closeWindow(appId);
                updateProcesses();
            }
        }
        
        updateProcesses();
        setInterval(updateProcesses, 2000);
    </script>
</body>
</html>
