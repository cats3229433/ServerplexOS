<!DOCTYPE html>
<html lang="en">
<head>
<script src="app-theme.js"></script>
<meta charset="UTF-8"><title>Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Courier New',monospace;background:var(--app-bg);color: var(--app-text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.term-header{background:var(--app-surface);border-bottom:1px solid var(--app-border);padding:8px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.term-title{font-family:'Oxanium',sans-serif;font-size:13px;color:var(--app-text2);flex:1}
.term-btns{display:flex;gap:6px}
.term-btn{background:var(--app-border);border:1px solid var(--app-border);border-radius:4px;color:var(--app-text2);padding:4px 10px;cursor:pointer;font-family:'Oxanium',sans-serif;font-size:11px}
.term-btn:hover{background:var(--app-border);color:var(--app-text)}
.output{flex:1;overflow-y:auto;padding:14px 18px;line-height:1.65;font-size:14px}
.line{margin-bottom:2px;word-break:break-all;white-space:pre-wrap}
.line-prompt{color:var(--app-text2)}
.line-cmd{color:var(--app-text)}
.line-out{color:#3fb950}
.line-err{color:#f85149}
.line-warn{color:#e3b341}
.line-info{color:var(--app-accent)}
.line-success{color:#3fb950}
.line-title{color:#d2a8ff;font-weight:bold}
.line-muted{color:var(--app-text2)}
.input-line{display:flex;align-items:center;padding:8px 18px 14px;flex-shrink:0;border-top:1px solid var(--app-border)}
.prompt-label{color:var(--app-accent);font-size:14px;flex-shrink:0;user-select:none}
.cmd-input{flex:1;background:transparent;border:none;outline:none;color:var(--app-text);font-family:'Courier New',monospace;font-size:14px;margin-left:8px;caret-color:#3fb950}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--app-bg)}
::-webkit-scrollbar-thumb{background:var(--app-surface2);border-radius:3px}
</style>
</head>
<body>

<div class="term-header">
  <div class="term-title">ServerplexOS Terminal — bash</div>
  <div class="term-btns">
    <button class="term-btn" onclick="clearTerm()">Clear</button>
    <button class="term-btn" onclick="copyOutput()">Copy</button>
  </div>
</div>
<div class="output" id="output"></div>
<div class="input-line">
  <span class="prompt-label" id="promptLabel">user@serverplexos:~$</span>
  <input class="cmd-input" id="cmdInput" autofocus autocomplete="off" spellcheck="false">
</div>
<script>
const output=document.getElementById('output');
const input=document.getElementById('cmdInput');
let history=JSON.parse(localStorage.getItem('serverplex_terminal_history')||'[]'),histIdx=history.length;
let cwd='~';
let env={USER:'user',HOME:'~',SHELL:'bash',TERM:'xterm',LANG:'en_US.UTF-8',PATH:'/usr/local/bin:/usr/bin:/bin'};
let vars={};

const fs={
  '~':{type:'dir',children:{documents:{type:'dir',children:{readme:{type:'file',content:'Welcome to ServerplexOS!\nThis is a sample document.'},notes:{type:'file',content:'My notes here'}}},downloads:{type:'dir',children:{}},desktop:{type:'dir',children:{}}}},
};

function resolvePath(p){
  if(!p||p==='~')return'~';
  if(p.startsWith('~/'))p='~'+p.slice(1);
  if(!p.startsWith('~')&&!p.startsWith('/'))p=cwd+'/'+(p);
  return p.replace(/\/+/g,'/').replace(/\/$/, '');
}
function getNode(path){
  if(path==='~')return fs['~'];
  const parts=path.split('/').filter(Boolean);
  let node=fs['~'];
  for(let p of parts){if(!p||p==='~')continue;if(!node||!node.children||!node.children[p])return null;node=node.children[p];}
  return node;
}

const commands={
  help:()=>{
    print('title','ServerplexOS Terminal Commands');
    print('info','  help            Show this help');
    print('info','  clear           Clear terminal');
    print('info','  echo [text]     Print text');
    print('info','  date            Show date/time');
    print('info','  whoami          Show current user');
    print('info','  pwd             Print working directory');
    print('info','  ls [path]       List directory');
    print('info','  cd [path]       Change directory');
    print('info','  mkdir [name]    Make directory');
    print('info','  touch [name]    Create file');
    print('info','  cat [file]      Show file contents');
    print('info','  rm [name]       Remove file/dir');
    print('info','  mv [src] [dst]  Move/rename');
    print('info','  cp [src] [dst]  Copy file');
    print('info','  env             Show environment');
    print('info','  export [k=v]    Set env variable');
    print('info','  calc [expr]     Calculate expression');
    print('info','  history         Show command history (persisted)');
    print('info','  clear-history   Wipe saved history');
    print('info','  uptime          Show uptime');
    print('info','  version         OS version');
    print('info','  cowsay [text]   Important');
    print('info','  theme [name]    Change OS theme (white/black/grey)');
    print('info','  neofetch        System info');
  },
  clear:()=>clearTerm(),
  echo:(args)=>print('out',args.join(' ')),
  date:()=>print('out',new Date().toString()),
  whoami:()=>print('out',env.USER),
  pwd:()=>print('out',cwd),
  env:()=>Object.entries(env).forEach(([k,v])=>print('out',`${k}=${v}`)),
  export:(args)=>{const p=args[0];if(!p)return;const[k,v]=p.split('=');if(k&&v!==undefined){env[k]=v;print('success','Exported: '+k+'='+v);}else print('err','Usage: export KEY=VALUE');},
  version:()=>print('out','ServerplexOS v1.0 — Build 2026.03.21'),
  uptime:()=>{const u=Math.floor(performance.now()/1000);const h=Math.floor(u/3600),m=Math.floor((u%3600)/60),s=u%60;print('out',`Uptime: ${h}h ${m}m ${s}s`);},
  history:()=>history.forEach((h,i)=>print('muted',`  ${String(i+1).padStart(3,' ')}  ${h}`)),
  'clear-history':()=>{history=[];histIdx=0;localStorage.removeItem('serverplex_terminal_history');print('success','History cleared.');},
  calc:(args)=>{try{const r=Function('"use strict";return ('+args.join(' ')+')')();print('out',`= ${r}`);}catch(e){print('err','Invalid expression');}},
  theme:(args)=>{const t=args[0];if(!['white','black','grey'].includes(t)){print('err','Usage: theme [white|black|grey]');return;}if(window.parent&&window.parent.changeTheme){window.parent.changeTheme(t);print('success','Theme changed to '+t);}else{localStorage.setItem('serverplex_theme',t);print('warn','Theme saved, will apply on next OS load');}},
  ls:(args)=>{
    const path=args[0]?resolvePath(args[0]):cwd;
    const node=getNode(path);
    if(!node){print('err',`ls: ${args[0]||cwd}: No such file or directory`);return;}
    if(node.type==='file'){print('out',path.split('/').pop());return;}
    const children=Object.entries(node.children||{});
    if(!children.length){print('muted','(empty)');return;}
    children.forEach(([name,n])=>print(n.type==='dir'?'info':'out',(n.type==='dir'?'📁 ':'📄 ')+name));
  },
  cd:(args)=>{
    if(!args[0]||args[0]==='~'){cwd='~';updatePrompt();return;}
    const path=resolvePath(args[0]);
    const node=getNode(path);
    if(!node)print('err',`cd: ${args[0]}: No such directory`);
    else if(node.type==='file')print('err',`cd: ${args[0]}: Not a directory`);
    else{cwd=path;updatePrompt();}
  },
  mkdir:(args)=>{
    if(!args[0]){print('err','Usage: mkdir [name]');return;}
    const node=getNode(cwd);
    if(!node||!node.children){print('err','Cannot create directory here');return;}
    if(node.children[args[0]]){print('err',`mkdir: ${args[0]}: File exists`);return;}
    node.children[args[0]]={type:'dir',children:{}};
    print('success','Created directory: '+args[0]);
  },
  touch:(args)=>{
    if(!args[0]){print('err','Usage: touch [name]');return;}
    const node=getNode(cwd);
    if(!node||!node.children){print('err','Cannot create file here');return;}
    if(!node.children[args[0]])node.children[args[0]]={type:'file',content:''};
    print('success','Created: '+args[0]);
  },
  cat:(args)=>{
    if(!args[0]){print('err','Usage: cat [file]');return;}
    const path=cwd+'/'+args[0];
    const node=getNode(resolvePath(path));
    if(!node)print('err',`cat: ${args[0]}: No such file`);
    else if(node.type==='dir')print('err',`cat: ${args[0]}: Is a directory`);
    else print('out',node.content||'(empty file)');
  },
  rm:(args)=>{
    if(!args[0]){print('err','Usage: rm [name]');return;}
    const node=getNode(cwd);
    if(!node||!node.children||!node.children[args[0]]){print('err',`rm: ${args[0]}: No such file or directory`);return;}
    delete node.children[args[0]];
    print('success','Removed: '+args[0]);
  },
  mv:(args)=>{
    if(args.length<2){print('err','Usage: mv [source] [dest]');return;}
    const parent=getNode(cwd);
    if(!parent||!parent.children||!parent.children[args[0]]){print('err',`mv: ${args[0]}: No such file`);return;}
    parent.children[args[1]]=parent.children[args[0]];
    delete parent.children[args[0]];
    print('success',`Moved ${args[0]} → ${args[1]}`);
  },
  cp:(args)=>{
    if(args.length<2){print('err','Usage: cp [source] [dest]');return;}
    const parent=getNode(cwd);
    if(!parent||!parent.children||!parent.children[args[0]]){print('err',`cp: ${args[0]}: No such file`);return;}
    parent.children[args[1]]=JSON.parse(JSON.stringify(parent.children[args[0]]));
    print('success',`Copied ${args[0]} → ${args[1]}`);
  },
  cowsay:(args)=>{
    const msg=args.join(' ')||'Moo!';const len=msg.length+2;const top='_'.repeat(len);const bot='-'.repeat(len);
    print('out',` ${top}`);print('out',`< ${msg} >`);print('out',` ${bot}`);
    print('out','        \\   ^__^');print('out','         \\  (oo)\\_______');print('out','            (__)\\       )\\/\\');print('out','                ||----w |');print('out','                ||     ||');
  },
  neofetch:()=>{
    const now=new Date();
    print('title', '    ██████╗ ██╗     ██╗██████╗ ███████╗███████╗');
    print('title', '    ██╔══╝██║     ██║██╔══██╗██╔════╝██╔════╝');
    print('title', '    █████╗ ██║     ██║██████╔╝███████╗█████╗  ');
    print('title', '    ██╔══╝ ██║     ██║██╔═══╝ ╚════██║██╔══╝  ');
    print('title', '    ███████╗███████╗██║██║     ███████║███████╗');
    print('out','');
    print('info',`  OS:        ServerplexOS 1.0`);
    print('info',`  Host:      Web Browser`);
    print('info',`  Shell:     ServerplexBash 1.0`);
    print('info',`  Date:      ${now.toLocaleDateString()}`);
    print('info',`  Time:      ${now.toLocaleTimeString()}`);
    print('info',`  User:      ${env.USER}`);
    print('info',`  Theme:     ${localStorage.getItem('serverplex_theme')||'white'}`);
    print('info',`  Platform:  ${navigator.platform}`);
  },
};

function print(type,text){
  const d=document.createElement('div');
  d.className='line line-'+type;
  d.textContent=text;
  output.appendChild(d);
  output.scrollTop=output.scrollHeight;
}

function updatePrompt(){
  document.getElementById('promptLabel').textContent=`${env.USER}@serverplexos:${cwd}$`;
}

function run(cmdStr){
  const trimmed=cmdStr.trim();
  if(!trimmed)return;
  history.push(trimmed);histIdx=history.length;
  localStorage.setItem('serverplex_terminal_history',JSON.stringify(history.slice(-200)));
  print('prompt','');
  const last=output.lastChild;
  if(last){last.innerHTML=`<span style="color:#58a6ff">${env.USER}@serverplexos:${cwd}$</span> <span style="color:#e6edf3">${trimmed}</span>`;}
  const parts=trimmed.split(/\s+/);
  const cmd=parts[0];const args=parts.slice(1);
  if(commands[cmd])commands[cmd](args);
  else{
    // Check for variable assignment
    if(trimmed.match(/^\w+=.*/)){const[k,v]=trimmed.split('=');vars[k]=v;return;}
    print('err',`${cmd}: command not found. Type 'help' for commands.`);
  }
}

input.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const v=input.value;input.value='';run(v);}
  else if(e.key==='ArrowUp'){e.preventDefault();if(histIdx>0){histIdx--;input.value=history[histIdx];}}
  else if(e.key==='ArrowDown'){e.preventDefault();if(histIdx<history.length-1){histIdx++;input.value=history[histIdx];}else{histIdx=history.length;input.value='';}}
  else if(e.key==='Tab'){e.preventDefault();autoComplete();}
  else if(e.key==='l'&&e.ctrlKey){e.preventDefault();clearTerm();}
});

function autoComplete(){
  const v=input.value.trim();
  const parts=v.split(' ');
  if(parts.length===1){
    const matches=Object.keys(commands).filter(c=>c.startsWith(v));
    if(matches.length===1)input.value=matches[0]+' ';
  } else {
    const node=getNode(cwd);
    if(!node||!node.children)return;
    const last=parts[parts.length-1];
    const matches=Object.keys(node.children).filter(n=>n.startsWith(last));
    if(matches.length===1){parts[parts.length-1]=matches[0];input.value=parts.join(' ');}
  }
}

function clearTerm(){output.innerHTML='';}
function copyOutput(){navigator.clipboard.writeText(output.innerText);}

document.addEventListener('click',()=>input.focus());

// Boot
print('title','ServerplexOS Terminal v1.0');
print('muted',`Last login: ${new Date().toUTCString()}`);
print('out','Type \'help\' for available commands. Tab to autocomplete.');
print('out','');
</script>
</body>
</html>
