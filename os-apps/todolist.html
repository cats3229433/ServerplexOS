<!DOCTYPE html>
<html lang="en">
<head>
<script src="app-theme.js"></script>
<meta charset="UTF-8"><title>To-Do List</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Oxanium',sans-serif;background:var(--app-bg);color:var(--app-text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:var(--app-surface);border-bottom:1px solid var(--app-border);padding:16px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.header h1{font-size:20px;font-weight:700}
.stats-row{display:flex;gap:8px;margin-left:auto;font-size:12px}
.stat-chip{padding:4px 10px;border-radius:20px;background:var(--app-border);color:var(--app-text2)}
.stat-chip span{color:var(--app-text);font-weight:700}
.toolbar{padding:12px 16px;background:var(--app-surface);border-bottom:1px solid var(--app-border);display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.add-row{display:flex;gap:8px;flex:1;min-width:300px}
.task-input{flex:1;padding:9px 14px;background:var(--app-bg);border:1px solid var(--app-border);border-radius:8px;color:var(--app-text);font-family:'Oxanium',sans-serif;font-size:13px;outline:none}
.task-input:focus{border-color:var(--app-accent)}
.task-input::placeholder{color:var(--app-text2)}
.p-select{padding:9px 10px;background:var(--app-bg);border:1px solid var(--app-border);border-radius:8px;color:var(--app-text);font-family:'Oxanium',sans-serif;font-size:12px;outline:none}
.p-select option{background:var(--app-bg)}
.cat-input{padding:9px 10px;background:var(--app-bg);border:1px solid var(--app-border);border-radius:8px;color:var(--app-text);font-family:'Oxanium',sans-serif;font-size:12px;outline:none;width:110px}
.cat-input::placeholder{color:var(--app-text2)}
.due-input{padding:9px 10px;background:var(--app-bg);border:1px solid var(--app-border);border-radius:8px;color:var(--app-text);font-family:'Oxanium',sans-serif;font-size:12px;outline:none}
.add-btn{padding:9px 18px;background:#238636;border:none;border-radius:8px;color:white;font-family:'Oxanium',sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.add-btn:hover{background:#2ea043}
.filter-row{display:flex;gap:6px;padding:10px 16px;background:var(--app-surface);border-bottom:1px solid var(--app-border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-btn{padding:5px 12px;border:1px solid var(--app-border);border-radius:20px;background:none;color:var(--app-text2);font-family:'Oxanium',sans-serif;font-size:12px;cursor:pointer;white-space:nowrap;transition:all 0.2s}
.filter-btn:hover{color:var(--app-text);border-color:rgba(128,128,128,0.2)}
.filter-btn.active{background:var(--app-accent);border-color:var(--app-accent);color:white}
.search-input{padding:5px 12px;background:var(--app-bg);border:1px solid var(--app-border);border-radius:20px;color:var(--app-text);font-family:'Oxanium',sans-serif;font-size:12px;outline:none;margin-left:auto;width:180px}
.search-input::placeholder{color:var(--app-text2)}
.tasks-area{flex:1;overflow-y:auto;padding:12px 16px}
.section-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--app-text2);padding:8px 0 6px;margin-bottom:4px}
.task-item{background:var(--app-surface);border:1px solid var(--app-border);border-radius:10px;padding:12px 14px;margin-bottom:6px;display:flex;align-items:flex-start;gap:12px;transition:all 0.2s;cursor:default}
.task-item:hover{border-color:var(--app-border);background:var(--app-surface2)}
.task-item.done{opacity:0.5}
.task-item.high{border-left:3px solid #f85149}
.task-item.medium{border-left:3px solid #e3b341}
.task-item.low{border-left:3px solid #3fb950}
.cb{width:18px;height:18px;border:2px solid rgba(128,128,128,0.2);border-radius:50%;cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.task-item.done .cb{background:#238636;border-color:#238636}
.cb-check{color:white;font-size:11px;display:none}
.task-item.done .cb-check{display:block}
.task-body{flex:1;min-width:0}
.task-text{font-size:14px;font-weight:600;color:var(--app-text);margin-bottom:3px}
.task-item.done .task-text{text-decoration:line-through;color:var(--app-text2)}
.task-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.task-cat{font-size:10px;padding:2px 7px;border-radius:10px;background:rgba(0,120,212,0.15);color:var(--app-accent);border:1px solid rgba(0,120,212,0.2)}
.task-due{font-size:11px;color:var(--app-text2)}
.task-due.overdue{color:#f85149}
.task-acts{display:flex;gap:4px;opacity:0;transition:opacity 0.2s}
.task-item:hover .task-acts{opacity:1}
.ta-btn{background:none;border:none;color:var(--app-text2);cursor:pointer;font-size:14px;padding:3px 5px;border-radius:4px}
.ta-btn:hover{background:var(--app-border);color:var(--app-text)}
.empty{text-align:center;padding:60px 20px;color:var(--app-text2)}
.empty div{font-size:40px;margin-bottom:12px}
.empty p{font-size:14px}
.progress-bar{height:3px;background:var(--app-border);border-radius:2px;margin:0 16px;flex-shrink:0}
.progress-fill{height:100%;background:#238636;border-radius:2px;transition:width 0.4s}
</style>
</head>
<body>

<div class="header">
  <div>📋</div>
  <h1>To-Do List</h1>
  <div class="stats-row">
    <div class="stat-chip">Total <span id="statTotal">0</span></div>
    <div class="stat-chip">Done <span id="statDone">0</span></div>
    <div class="stat-chip">Pending <span id="statPending">0</span></div>
  </div>
</div>
<div class="toolbar">
  <div class="add-row">
    <input class="task-input" id="taskInput" placeholder="Add a new task…" onkeydown="if(event.key==='Enter')addTask()">
    <select class="p-select" id="prioSelect">
      <option value="medium">Medium</option>
      <option value="high">🔴 High</option>
      <option value="low">🟢 Low</option>
    </select>
    <input class="cat-input" id="catInput" placeholder="Category">
    <input class="due-input" type="date" id="dueInput">
    <button class="add-btn" onclick="addTask()">+ Add</button>
  </div>
</div>
<div class="filter-row">
  <button class="filter-btn active" onclick="setFilter('all')">All</button>
  <button class="filter-btn" onclick="setFilter('pending')">Pending</button>
  <button class="filter-btn" onclick="setFilter('done')">Done</button>
  <button class="filter-btn" onclick="setFilter('high')">🔴 High</button>
  <button class="filter-btn" onclick="setFilter('medium')">🟡 Medium</button>
  <button class="filter-btn" onclick="setFilter('low')">🟢 Low</button>
  <button class="filter-btn" onclick="setFilter('overdue')">⚠️ Overdue</button>
  <input class="search-input" id="searchInput" placeholder="Search tasks…" oninput="render()">
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div class="tasks-area" id="taskArea"></div>
<script>
let tasks=JSON.parse(localStorage.getItem('serverplex_tasks_v2')||'[]');
let filter='all';
function save(){localStorage.setItem('serverplex_tasks_v2',JSON.stringify(tasks));}
function setFilter(f){filter=f;document.querySelectorAll('.filter-btn').forEach((b,i)=>{const fs=['all','pending','done','high','medium','low','overdue'];b.classList.toggle('active',fs[i]===f);});render();}
function addTask(){
  const text=document.getElementById('taskInput').value.trim();
  if(!text)return;
  tasks.unshift({id:Date.now(),text,priority:document.getElementById('prioSelect').value,category:document.getElementById('catInput').value.trim(),due:document.getElementById('dueInput').value,done:false,created:new Date().toISOString()});
  document.getElementById('taskInput').value='';
  document.getElementById('catInput').value='';
  document.getElementById('dueInput').value='';
  save();render();
}
function toggle(id){const t=tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();render();}}
function del(id){if(confirm('Delete this task?')){tasks=tasks.filter(x=>x.id!==id);save();render();}}
function editTask(id){
  const t=tasks.find(x=>x.id===id);
  const nw=prompt('Edit task:',t.text);
  if(nw&&nw.trim()){t.text=nw.trim();save();render();}
}
function isOverdue(t){return t.due&&!t.done&&new Date(t.due)<new Date()&&new Date(t.due).toDateString()!==new Date().toDateString();}
function render(){
  const area=document.getElementById('taskArea');
  const q=document.getElementById('searchInput').value.toLowerCase();
  const today=new Date().toISOString().split('T')[0];
  let filtered=tasks.filter(t=>{
    if(q&&!t.text.toLowerCase().includes(q)&&!(t.category||'').toLowerCase().includes(q))return false;
    if(filter==='pending')return!t.done;
    if(filter==='done')return t.done;
    if(filter==='high')return t.priority==='high'&&!t.done;
    if(filter==='medium')return t.priority==='medium'&&!t.done;
    if(filter==='low')return t.priority==='low'&&!t.done;
    if(filter==='overdue')return isOverdue(t);
    return true;
  });
  const done=tasks.filter(t=>t.done).length;
  document.getElementById('statTotal').textContent=tasks.length;
  document.getElementById('statDone').textContent=done;
  document.getElementById('statPending').textContent=tasks.length-done;
  document.getElementById('progressFill').style.width=(tasks.length?Math.round(done/tasks.length*100):0)+'%';
  if(!filtered.length){
    area.innerHTML=`<div class="empty"><div>📭</div><p>No tasks here</p></div>`;
    return;
  }
  const pending=filtered.filter(t=>!t.done);
  const completed=filtered.filter(t=>t.done);
  area.innerHTML='';
  if(pending.length){
    const st=document.createElement('div');st.className='section-title';st.textContent=`Pending (${pending.length})`;area.appendChild(st);
    pending.forEach(t=>area.appendChild(makeCard(t)));
  }
  if(completed.length){
    const st=document.createElement('div');st.className='section-title';st.textContent=`Completed (${completed.length})`;area.appendChild(st);
    completed.forEach(t=>area.appendChild(makeCard(t)));
  }
}
function makeCard(t){
  const div=document.createElement('div');
  div.className=`task-item ${t.priority} ${t.done?'done':''}`;
  const overdue=isOverdue(t);
  const dueStr=t.due?`<span class="task-due ${overdue?'overdue':''}">📅 ${t.due}${overdue?' · Overdue':''}</span>`:'';
  const catStr=t.category?`<span class="task-cat">${t.category}</span>`:'';
  div.innerHTML=`<div class="cb" onclick="toggle(${t.id})"><span class="cb-check">✓</span></div><div class="task-body"><div class="task-text">${t.text}</div><div class="task-meta">${catStr}${dueStr}</div></div><div class="task-acts"><button class="ta-btn" onclick="editTask(${t.id})" title="Edit">✏️</button><button class="ta-btn" onclick="del(${t.id})" title="Delete">🗑️</button></div>`;
  return div;
}
render();
</script>
</body>
</html>
