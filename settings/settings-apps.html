<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="../CoreFiles/app-theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Oxanium',sans-serif;padding:24px;background:var(--app-bg);color:var(--app-text);overflow-y:auto;min-height:100vh}
h1{font-size:26px;font-weight:800;margin-bottom:24px}
.sec-title{font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--app-text2);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--app-border)}
.search-wrap{position:relative;margin-bottom:16px}
.search-wrap input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--app-border);border-radius:10px;background:var(--app-surface);color:var(--app-text);font-family:'Oxanium',sans-serif;font-size:13px;outline:none}
.search-wrap input:focus{border-color:var(--app-accent)}
.search-wrap::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px}
.app-grid{display:grid;gap:8px}
.app-item{background:var(--app-surface);border:1px solid var(--app-border);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:14px;transition:all .18s}
.app-item:hover{border-color:var(--app-border);background:var(--app-surface2)}
.app-icon{font-size:28px;width:38px;text-align:center;flex-shrink:0}
.app-meta{flex:1;min-width:0}
.app-name{font-size:14px;font-weight:700;color:var(--app-text)}
.app-cat{font-size:11px;color:var(--app-text2);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.app-status{font-size:11px;font-weight:700;margin-top:3px}
.app-status.running{color:#34c759}
.app-status.stopped{color:var(--app-text2)}
.btn{padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-family:'Oxanium',sans-serif;font-size:12px;font-weight:700;transition:all .18s;flex-shrink:0}
.btn-primary{background:var(--app-accent);color:#fff}
.btn-primary:hover{opacity:.88}
.btn-stop{background:rgba(255,59,48,.12);color:#ff3b30;border:1px solid rgba(255,59,48,.3)}
.btn-stop:hover{background:rgba(255,59,48,.22)}
.filter-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.filter-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--app-border);background:var(--app-surface);color:var(--app-text2);font-family:'Oxanium',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.filter-btn:hover,.filter-btn.active{background:var(--app-accent);color:#fff;border-color:var(--app-accent)}
</style>
</head>
<body>

<h1>📱 Apps</h1>

<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="Search apps…" oninput="render()">
</div>

<div class="filter-row" id="filterRow"></div>
<div class="sec-title" id="appCount">All Apps</div>
<div class="app-grid" id="appGrid"></div>

<script>
var APPS = [
  {id:'browser',       name:'Browser',        icon:'🌐', cat:'Internet'},
  {id:'notepad',       name:'Notepad',         icon:'📝', cat:'Productivity'},
  {id:'calculator',    name:'Calculator',      icon:'🧮', cat:'Utilities'},
  {id:'calendar',      name:'Calendar',        icon:'📅', cat:'Productivity'},
  {id:'terminal',      name:'Terminal',        icon:'💻', cat:'System'},
  {id:'code',          name:'Code Editor',     icon:'👨‍💻', cat:'Development'},
  {id:'paint',         name:'Paint',           icon:'🎨', cat:'Creative'},
  {id:'todolist',      name:'To-Do List',      icon:'📋', cat:'Productivity'},
  {id:'stickynotes',   name:'Sticky Notes',    icon:'📌', cat:'Productivity'},
  {id:'imageviewer',   name:'Image Viewer',    icon:'🖼️', cat:'Media'},
  {id:'clock',         name:'Clock',           icon:'⏰', cat:'Utilities'},
  {id:'recyclebin',    name:'Recycle Bin',     icon:'🗑️', cat:'System'},
  {id:'search',        name:'Search',          icon:'🔍', cat:'System'},
  {id:'musicplayer',   name:'Music Player',    icon:'🎵', cat:'Media'},
  {id:'markdowneditor',name:'Markdown Editor', icon:'📄', cat:'Productivity'},
  {id:'settings',      name:'Settings',        icon:'⚙️', cat:'System'},
  {id:'filemanager',   name:'File Manager',    icon:'📁', cat:'System'},
  {id:'games',         name:'Games',           icon:'🎮', cat:'Entertainment'},
  {id:'voicerecorder', name:'Voice Recorder',  icon:'🎙️', cat:'Media'},
  {id:'screenrecorder',name:'Screen Recorder', icon:'📹', cat:'Media'},
  {id:'appstore',      name:'App Store',       icon:'🏪', cat:'System'},
];

var CATS = ['All', ...new Set(APPS.map(a => a.cat))];
var curCat = 'All';

// Filter buttons
var fr = document.getElementById('filterRow');
CATS.forEach(function(c){
  var b = document.createElement('button');
  b.className = 'filter-btn' + (c === 'All' ? ' active' : '');
  b.textContent = c;
  b.onclick = function(){
    curCat = c;
    document.querySelectorAll('.filter-btn').forEach(function(x){ x.classList.remove('active'); });
    b.classList.add('active');
    render();
  };
  fr.appendChild(b);
});

function isRunning(id) {
  return !!(window.parent && window.parent.windows && window.parent.windows[id]);
}

function render() {
  var q = document.getElementById('searchInput').value.toLowerCase();
  var list = APPS.filter(function(a){
    if (curCat !== 'All' && a.cat !== curCat) return false;
    if (q && !a.name.toLowerCase().includes(q) && !a.cat.toLowerCase().includes(q)) return false;
    return true;
  });
  // Sort: running first
  list.sort(function(a,b){ return (isRunning(b.id)?1:0) - (isRunning(a.id)?1:0); });
  document.getElementById('appCount').textContent = list.length + ' app' + (list.length !== 1 ? 's' : '') + (curCat !== 'All' ? ' in ' + curCat : '');
  var g = document.getElementById('appGrid');
  g.innerHTML = '';
  list.forEach(function(a){
    var running = isRunning(a.id);
    var div = document.createElement('div');
    div.className = 'app-item';
    div.innerHTML =
      '<div class="app-icon">' + a.icon + '</div>' +
      '<div class="app-meta"><div class="app-name">' + a.name + '</div><div class="app-cat">' + a.cat + '</div>' +
      '<div class="app-status ' + (running?'running':'stopped') + '">' + (running?'● Running':'○ Not running') + '</div></div>' +
      '<button class="btn ' + (running?'btn-stop':'btn-primary') + '" data-id="' + a.id + '">' + (running?'Close':'Launch') + '</button>';
    div.querySelector('button').onclick = function(){
      if (running) { if (window.parent && window.parent.closeWindow) window.parent.closeWindow(a.id); }
      else { if (window.parent && window.parent.openApp) window.parent.openApp(a.id); }
      setTimeout(render, 300);
    };
    g.appendChild(div);
  });
}

render();
setInterval(render, 2000);
</script>
</body>
</html>
