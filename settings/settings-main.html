<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Settings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Oxanium', sans-serif; height: 100vh; display: flex; background: #f5f5f5; }
        .sidebar { width: 250px; background: #fff; border-right: 1px solid #ddd; }
        .sidebar-header { padding: 24px 20px; border-bottom: 1px solid #ddd; }
        .sidebar-header h2 { font-size: 20px; color: #333; }
        .nav-item { padding: 14px 20px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 12px; color: #666; }
        .nav-item:hover { background: #f0f0f0; }
        .nav-item.active { background: #e3f2fd; color: #0078d4; font-weight: 600; }
        .content { flex: 1; overflow-y: auto; padding: 40px; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>⚙️ Settings</h2>
        </div>
        <div class="nav-item active" onclick="loadPage('system')">💻 System</div>
        <div class="nav-item" onclick="loadPage('personalization')">🎨 Personalization</div>
        <div class="nav-item" onclick="loadPage('apps')">📱 Apps</div>
        <div class="nav-item" onclick="loadPage('accounts')">👤 Accounts</div>
        <div class="nav-item" onclick="loadPage('privacy')">🔒 Privacy & Security</div>
        <div class="nav-item" onclick="loadPage('about')">ℹ️ About</div>
    </div>
    <div class="content">
        <iframe id="contentFrame" src="settings-system.html"></iframe>
    </div>

    <script>
        function loadPage(page) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('contentFrame').src = `settings-${page}.html`;
        }
    </script>
</body>
</html>
